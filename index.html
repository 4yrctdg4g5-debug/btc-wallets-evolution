/* --- Accesseurs défensifs. Un `journal` partiel n'est jamais complété par
   loadState : aucun composant ne descend une chaîne de propriétés à la main. --- */
const EMPTY_J = { trades: {}, config: {}, seen: {} };
const jSlice   = (s) => (s && s.journal) || EMPTY_J;
const jTrades  = (s) => jSlice(s).trades || {};
const jRecs    = (s) => Object.keys(jTrades(s)).map(k => jTrades(s)[k]).filter(Boolean);
const jRec     = (s, k) => jTrades(s)[k] || null;
const jSeen    = (s, accId) => (jSlice(s).seen || {})[accId] || null;
const jConf    = (s) => jSlice(s).config || {};
const jOff     = (s, kind) => (jConf(s).off || {})[kind] || [];
const jCustom  = (s, kind) => (jConf(s).custom || {})[kind] || [];

/* Clé d'identité d'un trade — possédée par le journal, jamais recalculée.
   `hl.fills` est une fenêtre glissante remplacée en bloc et `ep.n` est un rang
   sur cette fenêtre : ni l'un ni l'autre ne peut servir d'identifiant. */
const jKey = (accId, coin, t0) => 'hl:' + accId + ':' + coin + ':' + t0;

/* Options actives d'une section : catalogue moins les désactivées, plus les customs. */
function jOptions(state, kind) {
  const off = jOff(state, kind);
  const base = (JOURNAL_CATALOG[kind] || []).filter(o => off.indexOf(o.id) < 0);
  const extra = jCustom(state, kind).filter(o => o && o.id && off.indexOf(o.id) < 0);
  return base.concat(extra);
}
/* Libellé d'un id, y compris pour une option désactivée ou supprimée depuis. */
function jLabel(state, kind, id) {
  const all = (JOURNAL_CATALOG[kind] || []).concat(jCustom(state, kind));
  for (const o of all) if (o && o.id === id) return o.label;
  return id;
}

/* Carte réclamée par un enregistrement. Dérivée, jamais stockée. */
function jCardType(rec) {
  if (!rec || rec.orphan) return null;
  if (rec.opening == null) return 'opening';
  if (rec.t1 != null && rec.closing == null) return 'closing';
  if (rec.t1 == null && rec.reserve) return rec.reserve.type === 'add' ? 'dca' : 'partial';
  return null;
}
// Les trades déjà clos à l'ajout du wallet ne créent AUCUNE dette : jamais dans la
// file, jamais dans le compteur tant qu'on n'y a pas touché. Mais dès qu'on en
// journalise un volontairement, il rejoint le compteur — sinon l'effort serait
// invisible — et il compte alors aussi au dénominateur pour que le ratio reste vrai.
const jInQueue = (rec) => !!rec && !rec.preexisting && !!jCardType(rec);
const jCounted = (rec) => !!rec && !rec.orphan && (!rec.preexisting || !!rec.opening);
/* Remplissage du point de la grille : rien / ouverture seule / plus rien à saisir.
   `preexisting` ne gouverne QUE l'apparence « jamais touché » : dès qu'une saisie
   existe, le point prend la couleur de son portefeuille comme n'importe quel autre,
   sinon journaliser un vieux trade ne se verrait pas.
   Un point plein signifie « rien à saisir MAINTENANT », pas « trade terminé » : un
   trade en cours dont l'ouverture est notée est plein, puis repasse à moitié quand
   sa clôture est détectée. Ce retour en arrière est voulu — il garantit
   l'équivalence « point non saturé = carte en attente », qui est ce qui permet à la
   grille de tenir lieu de file. */
const jDotState = (rec) => rec.opening == null ? (rec.preexisting ? 'pre' : 'empty')
  : jCardType(rec) ? 'half' : 'full';
/* Récence d'une carte : l'événement qui la déclenche, borné par la date de détection
   (une position déjà ouverte lors de l'ajout d'un wallet remonte donc en tête). */
function jSortAt(rec) {
  const t = jCardType(rec);
  const d = rec.detectedAt || 0;
  if (t === 'closing') return Math.max(d, rec.t1 || 0);
  if (t === 'partial' || t === 'dca') return Math.max(d, (rec.reserve && rec.reserve.at) || 0);
  return Math.max(d, rec.t0 || 0);
}

/* File d'attente des cartes à saisir — partagée entre la vue Journal et la colonne KPI
   (même prédicat que le compteur de la nav : les deux chiffres ne peuvent pas diverger).
   Les cartes esquivées (« plus tard ») sont déclassées en fin de file, jamais retirées. */
const jFile = (s) => jRecs(s).filter(jInQueue)
  .sort((a, b) => (!!a.snoozedAt - !!b.snoozedAt) || (jSortAt(b) - jSortAt(a)));

/* =============================================================
   JOURNAL — DÉTECTION
   -------------------------------------------------------------
   Deux mutations synchrones d'un état DÉJÀ cloné, appelées dans l'unique update()
   de syncHl. Elles comparent les épisodes reconstruits aux enregistrements que le
   journal possède — jamais aux anciens fills — ce qui les rend idempotentes par
   construction et immunes au glissement de la fenêtre des 200 fills.
   `nowMs` est un PARAMÈTRE et non un Date.now() interne : le callback d'update est
   un updater React susceptible d'être réinvoqué, et deux exécutions doivent
   produire exactement le même état.
   ============================================================= */
const J_ABSENT_CLOSES_AT = 3;      // synchros consécutives sans la position avant clôture forcée

function jEnsure(s) {
  const J = s.journal || (s.journal = {});
  if (!J.trades || typeof J.trades !== 'object') J.trades = {};
  if (!J.config || typeof J.config !== 'object') J.config = {};
  if (!J.seen || typeof J.seen !== 'object') J.seen = {};
  return J;
}

/* Note libre d'un trade — saisie humaine au même titre qu'`opening`/`closing` : ni
   écrasée par la détection, ni reconstruite. Note vide = suppression, comme côté
   manuel. C'est ce qui permet à un wallet HL d'avoir des notes malgré `hl.snapshot`
   et `hl.fills` remplacés en bloc à chaque synchro. */
const jSetNote = (update, key, text) => update(s => {
  const r = jEnsure(s).trades[key];
  if (!r) return;
  const t = (text || '').trim();
  if (t) r.note = t; else delete r.note;
});
/* Édition APRÈS COUP de la saisie d'ouverture — même modèle que jSetNote.
   Préserve savedAt (date de 1re saisie) et closureKnownAtSave (l'honnêteté de la
   saisie initiale ne se réécrit pas) ; pose editedAt et editedAfterClose.
   `editedAfterClose` est COLLANT : une fois vrai, il ne se rétracte jamais — un
   résultat connu ne se désapprend pas. nowMs calculé HORS du callback : l'updater
   React peut être réinvoqué et deux exécutions doivent produire le même état. */
const jSetOpening = (update, key, patch) => {
  const nowMs = Date.now();
  update(s => {
    const r = jEnsure(s).trades[key];
    if (!r || !r.opening) return;            // édition d'un existant uniquement
    const o = r.opening;
    o.mindset = patch.mindset != null ? patch.mindset : null;
    o.setups = patch.setups || [];
    o.tps = patch.tps || [];
    o.risk = patch.risk || [];
    o.editedAt = nowMs;
    o.editedAfterClose = (o.editedAfterClose === true) || r.t1 != null;
  });
};

/* --- Notes partagées ------------------------------------------------------
   Table centrale `s.sharedNotes` + références `snoteId` posées sur les positions
   (manuel, sim) et les enregistrements du journal (HL). Un seul objet texte,
   édité partout à la fois. Convention : détacher = delete (jamais de champ null),
   comme jSetNote — et `update` clone en JSON, donc jamais d'undefined stocké.
   Lecture défensive : un state partiel n'a pas forcément la tranche. --- */
const snList = (s) => (s && s.sharedNotes) || [];
const snGet = (s, id) => id ? (snList(s).find(n => n.id === id) || null) : null;
const snEnsure = (s) => (Array.isArray(s.sharedNotes) ? s.sharedNotes : (s.sharedNotes = []));

/* id et date générés HORS du callback : l'updater React peut être réinvoqué et
   deux exécutions doivent produire le même état (précédent jSetOpening). L'id est
   retourné pour attacher dans la foulée. */
const snCreate = (update, text) => {
  const id = uid(), at = todayStr() + 'T12:00:00';
  update(s => { snEnsure(s).push({ id, text, at }); });
  return id;
};
/* Texte vide refusé en amont (bouton Enregistrer désactivé) : une note référencée
   ne doit pas se vider par un save accidentel — le helper l'ignore par sécurité. */
const snSetText = (update, id, text) => update(s => {
  const t = (text || '').trim();
  if (!t) return;
  const n = snList(s).find(x => x.id === id);
  if (n) n.text = t;
});
/* Suppression = retrait de la table + purge de TOUTES les références, même update. */
const snDelete = (update, id) => update(s => {
  s.sharedNotes = snList(s).filter(n => n.id !== id);
  for (const a of (s.accounts || [])) for (const p of (a.positions || [])) if (p.snoteId === id) delete p.snoteId;
  for (const a of (s.sims || [])) for (const p of (a.positions || [])) if (p.snoteId === id) delete p.snoteId;
  const T = (s.journal && s.journal.trades) || {};
  for (const k of Object.keys(T)) if (T[k] && T[k].snoteId === id) delete T[k].snoteId;
});
/* Couleurs des portefeuilles où la note est attachée — une entrée PAR portefeuille
   (pas par position), dans l'ordre comptes puis sims. Côté HL la référence vit sur
   le record journal : on remonte au compte par walletId. Alimente les rayures du
   filet de `.pos-note.shared`. */
const snColors = (s, id) => {
  if (!id) return [];
  const out = [];
  const recs = Object.values(jTrades(s));
  for (const a of (s.accounts || [])) {
    const manual = (a.positions || []).some(p => p.snoteId === id);
    const hl = recs.some(r => r && r.snoteId === id && r.walletId === a.id);
    if (manual || hl) out.push(a.color);
  }
  for (const a of (s.sims || [])) if ((a.positions || []).some(p => p.snoteId === id)) out.push(a.color);
  return out;
};
/* Nombre de positions liées (manuel + sim + journal) — affiché dans la gestion. */
const snUsage = (s, id) => {
  let n = 0;
  for (const a of (s.accounts || [])) for (const p of (a.positions || [])) if (p.snoteId === id) n++;
  for (const a of (s.sims || [])) for (const p of (a.positions || [])) if (p.snoteId === id) n++;
  const T = jTrades(s);
  for (const k of Object.keys(T)) if (T[k] && T[k].snoteId === id) n++;
  return n;
};
/* Référence côté HL — champ humain du record, comme `note` : la détection ne le
   touche jamais et il survit aux synchros. null = détacher. */
const jSetSnote = (update, key, id) => update(s => {
  const r = jEnsure(s).trades[key];
  if (!r) return;
  if (id) r.snoteId = id; else delete r.snoteId;
});

/* Enregistrement d'une position HL VIVANTE — même prédicat que journalObserveLive. */
const jOpenRec = (state, accId, coin) =>
  jRecs(state).find(r => r.walletId === accId && r.coin === coin && r.t1 == null && !r.orphan) || null;

function jNewRec(key, accId, addr, ep, nowMs, preexisting) {
  return {
    key, walletId: accId, walletAddr: addr || null,
    coin: ep.coin, side: ep.side, t0: ep.t0, t1: null,
    cap: { atOpen: null, last: null, equityAtOpen: null,
           sizeOpened: 0, avgEntry: 0, entryNotional: 0, exit: null, events: [],
           orders: [], ordersFrozen: false },
    detectedAt: nowMs, observedOpen: false, preexisting: !!preexisting,
    opening: null, closing: null, midNotes: [], note: null,
    reserve: null, snoozedAt: null, orphan: false, absentSyncs: 0,
  };
}

/* Type d'un fill déduit de la SEULE ligne : `startPosition` est la taille avant le
   fill, donc aucune mémoire des tailles précédentes n'est nécessaire. Même
   arithmétique et même tolérance que hlEpisodes. */
function jFillEvent(f) {
  if (!f || f.startPosition == null) return null;
  const dir = String(f.dir || '');
  const sp = Math.abs(f.startPosition), sz = Math.abs(f.sz);
  const tol = Math.max(1e-6, sz * 1e-4);
  if (/^Open/.test(dir)) return sp < 1e-9 ? 'open' : 'add';
  if (/^Close/.test(dir) || dir === 'Liquidation') return (sp - sz) > tol ? 'reduce' : 'close';
  return null;                     // funding, spot (dir Buy/Sell), libellés inconnus
}

/* Fenêtre de fills d'un épisode — même prédicat que hlEpisodeExit. */
function jEpisodeFills(fills, ep) {
  return (fills || []).filter(f => {
    const ts = new Date(f.at).getTime();
    return f.coin === ep.coin && ts >= ep.t0 && (ep.t1 == null || ts <= ep.t1);
  }).sort((a, b) => a.at.localeCompare(b.at));
}


/* Mode de clôture : liquidation > stop > TP, sinon manuel. Dérivé puis stocké, car
   `kind` dépend du dictionnaire oid→orderType reconstruit à la volée depuis
   historicalOrders et jeté aussitôt après la synchro.
   La liquidation se lit sur `kind`, posé au mapping depuis l'objet `liquidation` du
   fill — une vraie liquidation arrive en dir='Close…', PAS 'Liquidation' ; le test
   sur dir ici reste en ceinture. `manual` est le fallback : un kind perdu y tombe,
   d'où la re-dérivation des modes 'manual' dans journalDetect. */
function jExitMode(kinds, closeFills) {
  const k = kinds || [];
  if (k.indexOf('liq') >= 0 || (closeFills || []).some(f => f.dir === 'Liquidation')) return 'liq';
  if (k.indexOf('sl') >= 0) return 'sl';
  if (k.indexOf('tp') >= 0) return 'tp';
  return 'manual';
}

/* Ordres rattachés à un trade : lignes de `historicalOrders` du même coin dont
   l'horodatage de statut tombe dans la fenêtre du trade, FUSIONNÉES PAR OID.
   `historicalOrders` renvoie une ligne PAR TRANSITION DE STATUT, pas une par ordre :
   on ne filtre donc JAMAIS sur `isTrigger`. Sur un stop déclenché, la ligne `filled`
   porte isTrigger:false et triggerPx:0 alors que les lignes `open`/`triggered` du
   MÊME oid portent les vraies valeurs — d'où la première valeur non nulle sur
   l'union des lignes. (`status:"open"` signifie « créé », pas « encore ouvert ».)
   Élagage volontaire : la réponse brute atteint 2 000 lignes par compte (~800 Ko
   pour quatre wallets) et persist() avale silencieusement un dépassement de quota. */
const J_ORDER_PAD_MS = 5 * 60 * 1000;

function jTradeOrders(rawHistOrders, rec, nowMs) {
  const from = rec.t0 - J_ORDER_PAD_MS;
  const to = (rec.t1 == null ? nowMs : rec.t1) + J_ORDER_PAD_MS;
  const byOid = {};
  for (const row of (rawHistOrders || [])) {
    const o = row && row.order;
    if (!o || o.coin !== rec.coin || o.oid == null) continue;
    const ts = row.statusTimestamp;
    if (ts == null || ts < from || ts > to) continue;
    const cur = byOid[o.oid] || (byOid[o.oid] = { oid: o.oid, side: null, orderType: null,
      isTrigger: false, triggerPx: null, tpsl: null, limitPx: null, sz: null,
      origSz: null, reduceOnly: null, statuses: [] });
    if (o.isTrigger) cur.isTrigger = true;
    if (cur.side == null && o.side) cur.side = o.side;
    if (cur.orderType == null && o.orderType) cur.orderType = o.orderType;
    const tpx = hlNum(o.triggerPx);
    if (cur.triggerPx == null && tpx) cur.triggerPx = tpx;      // 0 est une non-valeur ici
    if (cur.tpsl == null && o.isPositionTpsl != null) cur.tpsl = !!o.isPositionTpsl;
    if (cur.limitPx == null && o.limitPx != null) cur.limitPx = hlNum(o.limitPx);
    if (cur.sz == null && o.sz != null) cur.sz = hlNum(o.sz);
    if (cur.origSz == null && o.origSz != null) cur.origSz = hlNum(o.origSz);
    if (cur.reduceOnly == null && o.reduceOnly != null) cur.reduceOnly = !!o.reduceOnly;
    if (!cur.statuses.some(st => st[0] === row.status && st[1] === ts)) cur.statuses.push([row.status, ts]);
  }
  return jSortOrders(Object.keys(byOid).map(k => byOid[k]));
}
const jSortOrders = (list) => {
  // Un stop qui se déclenche et se remplit dans le même instant produit plusieurs
  // lignes au MÊME statusTimestamp : on départage sur l'ordre logique du cycle de
  // vie, sinon le tri est instable et l'historique stocké devient illisible.
  const RANK = { open: 0, triggered: 1, filled: 2 };
  for (const o of list) o.statuses.sort((a, b) => (a[1] - b[1]) || ((RANK[a[0]] ?? 3) - (RANK[b[0]] ?? 3)));
  return list.sort((a, b) => (a.statuses[0] ? a.statuses[0][1] : 0) - (b.statuses[0] ? b.statuses[0][1] : 0));
};
/* Fusion accumulante : les lignes anciennes finissent par sortir de historicalOrders,
   donc on complète l'existant au lieu de le remplacer. Refusionner les mêmes lignes
   ne change rien (idempotent). */
function jMergeOrders(existing, fresh) {
  const byOid = {};
  for (const o of (existing || [])) if (o && o.oid != null) byOid[o.oid] = o;
  for (const o of fresh) {
    const cur = byOid[o.oid];
    if (!cur) { byOid[o.oid] = o; continue; }
    if (!Array.isArray(cur.statuses)) cur.statuses = [];
    for (const st of o.statuses) if (!cur.statuses.some(x => x[0] === st[0] && x[1] === st[1])) cur.statuses.push(st);
    if (o.isTrigger) cur.isTrigger = true;
    for (const k of ['side', 'orderType', 'triggerPx', 'tpsl', 'limitPx', 'sz', 'origSz', 'reduceOnly']) {
      if (cur[k] == null && o[k] != null) cur[k] = o[k];
    }
  }
  return jSortOrders(Object.keys(byOid).map(k => byOid[k]));
}

function journalDetect(s, accId, hl, rawHistOrders, addr, nowMs) {
  const fills = (hl && hl.fills) || [];
  const J = jEnsure(s);
  const seen = J.seen[accId] || (J.seen[accId] = { addedAt: nowMs, baselineDone: false });
  const eps = hlEpisodes(fills);
  if (!eps.length && (fills || []).length && fills.some(f => f.startPosition == null)) {
    // hlEpisodes abandonne EN BLOC si un seul fill stocké n'a pas `startPosition`
    // (fills d'une version antérieure) : sans ce cri, la détection serait muette.
    // ⚠️ Réservé aux VRAIS fills legacy : 0 épisode est aussi l'état normal d'un wallet
    // dont tous les épisodes ont commencé hors de l'horizon des 200 fills — dans ce
    // cas on continue, sinon `seen.baselineDone` resterait faux et un passage
    // ultérieur requalifierait des trades en `preexisting`.
    console.warn('Journal : 0 épisode pour ' + fills.length + ' fills — fills legacy sans startPosition ?');
    return;
  }
  const baseline = !seen.baselineDone;

  for (const ep of eps) {
    const key = jKey(accId, ep.coin, ep.t0);
    let rec = J.trades[key];
    // Au tout premier passage, un épisode DÉJÀ CLOS n'a jamais pu être journalisé :
    // c'est la seule information que ce passage possède et qu'aucun autre ne pourra
    // reconstituer.
    if (!rec) rec = J.trades[key] = jNewRec(key, accId, addr, ep, nowMs, baseline && ep.t1 != null);

    rec.cap.sizeOpened = ep.sizeOpened;
    rec.cap.avgEntry = ep.avgEntry;
    rec.cap.entryNotional = ep.entryNotional;

    // Événements = ORDRES regroupés à la minute, pas fills bruts — MÊME fonction que
    // le graphe et l'historique, donc les deux vues ne peuvent pas diverger. L'id est
    // la clé de regroupement elle-même : déterministe, stable d'une synchro à l'autre.
    // La liste est RECONSTRUITE plutôt qu'incrémentée — c'est de la donnée machine,
    // reconstruire est idempotent par construction — mais seulement si le calcul
    // donne quelque chose : un épisode dont les fills sont sortis de la fenêtre des
    // 200 conserve ainsi son déroulé déjà capté.
    const avant = new Set((rec.cap.events || []).map(e => e.id));
    const refaits = [];
    for (const g of groupHlFills(jEpisodeFills(fills, ep))) {
      const type = jFillEvent(g);
      if (!type) continue;
      refaits.push({ id: g.key, at: new Date(g.firstAt).getTime(), type, sz: g.sz, px: g.px,
        fee: g.fee || 0, kind: g.kind || null });
    }
    if (refaits.length) {
      refaits.sort((a, b) => a.at - b.at);
      rec.cap.events = refaits;
      // Les enregistrements écrits avant le regroupement portent des ids d'un autre
      // schéma : tout paraîtrait neuf et ferait surgir de fausses cartes au premier
      // passage. On ne compare donc les ids que s'ils sont comparables.
      const comparable = avant.size === 0 || [...avant].every(id => String(id).indexOf('|') >= 0);
      if (comparable) for (const e of refaits) {
        if (avant.has(e.id)) continue;
        // Re-servir la carte d'un trade EN COURS déjà journalisé. La garde sur
        // `opening` évite deux entrées de file pour un même trade : si la carte
        // d'ouverture est encore en attente, la partielle n'ajoute rien. Une seconde
        // partielle non acquittée écrase la réserve au lieu de s'empiler.
        if ((e.type === 'add' || e.type === 'reduce') && rec.opening != null && ep.t1 == null) {
          rec.reserve = { type: e.type, at: e.at, evId: e.id };
        }
      }
    }

    // Transition de clôture. Rejouée si la clôture avait été posée à l'estime par
    // la garde anti-poussière (les faits remplacent l'approximation) — et tant que
    // le mode est 'manual' : c'est le fallback de jExitMode, une liquidation mal
    // identifiée y est déjà tombée, re-dériver répare l'existant tant que l'épisode
    // est dans l'horizon des 200 fills (au-delà, le mode figé reste tel quel).
    // Idempotent : mêmes fills, mêmes valeurs ; closing/notes non touchés.
    const aRevoir = rec.cap.exit && (rec.cap.exit.mode === 'unknown' || rec.cap.exit.mode === 'manual');
    if (ep.t1 != null && (rec.t1 == null || aRevoir)) {
      const x = hlEpisodeExit(fills, ep);
      rec.t1 = ep.t1;
      rec.cap.exit = { at: ep.t1, avgExit: x.avgExit, closedSz: x.closedSz,
        fees: x.fees, net: ep.net, kinds: x.kinds, mode: jExitMode(x.kinds, x.closes) };
      rec.reserve = null;          // la carte de clôture prend le relais
      rec.absentSyncs = 0;
    }

    // Capital à l'entrée, figé une fois pour toutes : thinHlSamples réduit les
    // échantillons à un par jour au-delà de 90 jours, donc la même interpolation
    // se dégraderait avec le temps. Réessayé tant que la courbe ne couvre pas t0.
    // ⚠️ APPROXIMATION pour un trade antérieur au suivi : les fenêtres du portfolio
    // HL sont grossières (~1 point/17 h au-delà d'une semaine), et la valeur obtenue
    // peut être incohérente avec la marge (marge > équity). À traiter comme indicatif
    // et non comme base de calcul d'exposition tant que le trade n'a pas été observé
    // vivant — d'où `observedOpen`, qui dit lesquels sont fiables.
    if (rec.cap.equityAtOpen == null) {
      const eq = hlEquityAt(hl && hl.samples, ep.t0);
      if (eq != null) rec.cap.equityAtOpen = eq;
    }

    // Cycle de vie des TP/SL. Accumulé tant que le trade est en cours, puis figé une
    // fois la clôture connue — la fenêtre est alors close et une relecture ne pourrait
    // que perdre des lignes sorties de l'historique.
    if (rawHistOrders && (rec.t1 == null || !rec.cap.ordersFrozen)) {
      rec.cap.orders = jMergeOrders(rec.cap.orders, jTradeOrders(rawHistOrders, rec, nowMs));
      if (rec.t1 != null) rec.cap.ordersFrozen = true;
    }
  }
  seen.baselineDone = true;
  if (seen.baselineAt == null) seen.baselineAt = nowMs;
}

/* Toutes les synchros (60 s). Capture ce qui périt à la clôture — l'API ne conserve
   ni levier ni marge ni TP/SL d'une position fermée — et surveille les transitions.
   Renvoie true si une synchro complète est souhaitable dès maintenant. */
function journalObserveLive(s, accId, snapshot, nowMs) {
  jEnsure(s);
  const positions = (snapshot && snapshot.positions) || [];
  const open = jRecs(s).filter(r => r.walletId === accId && r.t1 == null && !r.orphan);
  const vus = {};
  let escalate = false;

  for (const p of positions) {
    vus[p.coin] = true;
    const rec = open.find(r => r.coin === p.coin);
    if (!rec) { escalate = true; continue; }   // la clé exige t0, donc les fills
    rec.observedOpen = true;
    rec.absentSyncs = 0;
    const snap = { at: nowMs, lev: p.leverage ?? null, margin: p.margin ?? null,
      entryPx: p.entryPrice ?? null, liqPx: p.liqPrice ?? null,
      tp: p.tp ?? null, sl: p.sl ?? null, size: p.size ?? null,
      fundingSinceOpen: p.fundingSinceOpen ?? null };
    if (!rec.cap.atOpen) rec.cap.atOpen = snap;    // écrit une fois : la marge bouge sur un DCA
    rec.cap.last = snap;
  }

  // Position disparue : signal de clôture à ≤ 60 s. Et garde anti-poussière —
  // hlEpisodes ne clôt un épisode que sur un retour EXACT à zéro, donc un résidu
  // laisserait l'enregistrement ouvert pour toujours et sa carte de clôture ne
  // viendrait jamais. Clôture provisoire, remplacée dès que les fills tranchent.
  for (const rec of open) {
    if (vus[rec.coin] || !rec.observedOpen) continue;
    rec.absentSyncs = (rec.absentSyncs || 0) + 1;
    escalate = true;
    if (rec.absentSyncs >= J_ABSENT_CLOSES_AT) {
      rec.t1 = nowMs;
      rec.cap.exit = { at: nowMs, avgExit: null, closedSz: null, fees: null,
        net: null, kinds: [], mode: 'unknown' };
      rec.reserve = null;
    }
  }
  return escalate;
}

/* =============================================================
   PRIX BTC — CoinGecko (inchangé)
   ============================================================= */
function useBtcPrice(state, update) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const url = 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd';
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const price = d && d.bitcoin && d.bitcoin.usd;
      if (typeof price !== 'number') throw new Error('Réponse inattendue');
      update(s => {
        s.btc = { price, updatedAt: new Date().toISOString() };
        if (!s.priceHistory) s.priceHistory = {};
        s.priceHistory[todayStr()] = price;
      });
    } catch (e) {
      setError(e.message || 'Erreur réseau');
      console.warn('Prix BTC indisponible :', e);
    } finally {
      setLoading(false);
    }
  }, [update]);

  useEffect(() => { refresh(); /* eslint-disable-next-line */ }, []);
  useEffect(() => {
    if (!state.settings.autoRefresh) return;
    const id = setInterval(refresh, AUTO_REFRESH_MS);
    return () => clearInterval(id);
  }, [state.settings.autoRefresh, refresh]);

  return { loading, error, refresh };
}

// Pourcentage coloré gain/perte (juste le %, sans montant).
function Pct({ pct, plain = false }) {
  const v = pct == null || isNaN(pct) ? 0 : pct;
  const neg = v < 0;
  const color = plain ? 'var(--text-secondary)' : (neg ? 'var(--loss)' : 'var(--gain)');
  return <span className="num" style={{ fontSize: 'var(--text-sm)', fontWeight: 'var(--weight-semibold)', color, whiteSpace: 'nowrap' }}>
    {neg ? MINUS : '+'}{Math.abs(v).toFixed(2)}%
  </span>;
}

/* Stat label + valeur (langage .modal-stats — panneaux de compte et bandeaux KPI).

   l'indicateur et tout le bloc est cliquable, même vocabulaire que le bloc « Gains »
   de la colonne KPI (.kpi-gains), gestion clavier comprise. */

        <span className="unit-toggle"><span className={unit === 'usdc' ? 'on' : ''}>USDC</span> / <span className={unit === 'pct' ? 'on' : ''}>%</span></span>
      </span>
    : <span className="muted">{label}</span>;
  if (!onToggle) return <div className="modal-stat" title={title}>{head}{children}</div>;
  return (
    <div className="modal-stat togglable" role="button" tabIndex={0} title="Cliquer pour basculer USDC / %"
      onClick={onToggle} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(); } }}>
      {head}{children}
    </div>
  );
}

/* Bandeau d'état de la sauvegarde. Les trois causes sont lues sur des variables
   de module posées par loadState/persist : tout événement qui les change passe
   déjà par un rendu (update() ou le tick du bail), donc aucun abonnement n'est
   nécessaire. Silencieux dans le cas normal. */
function SaveWarning({ owner }) {
  if (persistBlock) return (
    <div className="save-warn">
      <span>{persistBlock}{brokenKey ? ' Le document d\'origine est conservé sous la clé ' + brokenKey + '.' : ''}</span>
      <Button size="sm" onClick={() => {
        if (confirm('Repartir d\'un état vide ? Le document illisible reste conservé sous sa clé de secours.')) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          location.reload();
        }
      }}>Repartir de zéro</Button>
    </div>
  );
  if (quotaFull) return (
    <div className="save-warn">
      <span>Sauvegarde impossible — espace de stockage saturé. Exporte tes données avant de continuer.</span>
    </div>
  );
  if (!owner) return (
    <div className="save-warn">
      <span>Un autre onglet a la main sur la sauvegarde : celui-ci est en lecture seule et se met à jour tout seul.</span>
      <Button size="sm" onClick={() => { takeOverOwner(); location.reload(); }}>Prendre la main</Button>
    </div>
  );
  return null;
}
