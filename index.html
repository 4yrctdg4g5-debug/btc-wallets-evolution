        <div className="menu">
          <button className="menu-item" onClick={() => { setDraft(name); setEditing(true); setOpen(false); }}>
            <span>Renommer l’onglet</span><span className="meta"><IEdit /></span>
          </button>
          <button className="menu-item" onClick={() => { setOpen(false); onDuplicate(); }}>
            <span>Dupliquer l’onglet</span><span className="meta"><ICopy /></span>
          </button>
          <div className="menu-sep" />
          <button className="menu-item" onClick={() => { setOpen(false); onDelete(); }} style={{ color: 'var(--loss)' }}>
            <span>Supprimer l’onglet</span><span className="meta" style={{ color: 'var(--loss)' }}><ITrash /></span>
          </button>
        </div>
      )}
    </div>
  );
}

function buildSimChart(sims) {
  const steps = tabOrderSteps(sims);
  const len = steps.length + 1;
  const seriesPerSim = sims.map(acc => ({
    id: acc.id, name: acc.name, color: idVar(acc.color),
    traj: simTrajectory(acc, steps, simChoice),
  }));
  const total = [];
  for (let k = 0; k < len; k++) {
    let sum = 0;
    for (const s of seriesPerSim) sum += (s.traj[k] != null ? s.traj[k] : s.traj[s.traj.length - 1]);
    total.push(sum);
  }
  return { seriesPerSim, total, steps };
}

function SimChart({ sims, unit, chart, setUnit, toggleSeries }) {
  const bodyRef = useRef(null);
  const { w, h } = useSize(bodyRef);
  const [hover, setHover] = useState(null);
  const accts = chart.accts || {};
  const { seriesPerSim, total, steps } = useMemo(() => buildSimChart(sims), [sims]);
  const len = steps.length + 1;

  const series = useMemo(() => {
    const list = [];
    if (chart.total !== false) list.push({ key: 'total', name: 'Total', stroke: 'var(--text-primary)', chipColor: 'var(--text-primary)', dash: false, data: total });
    for (const s of seriesPerSim) if (accts[s.id] !== false) list.push({ key: s.id, name: s.name, stroke: s.color, chipColor: s.color, dash: true, data: s.traj });
    return list;
  }, [seriesPerSim, total, chart]);

  const labels = useMemo(() => ['Départ', ...steps.map(s => 'P' + s)], [steps]);
  const hasData = len >= 2 && series.length > 0;

  return (
    <div className="panel">
      <div className="panel-head">
        <div className="panel-controls">
          <SegmentedControl size="sm" options={['USDC', '%']} value={unit === 'pct' ? '%' : 'USDC'} onChange={(v) => setUnit(v === '%' ? 'pct' : 'usdc')} />
        </div>
      </div>
      <div className="chart-body" ref={bodyRef}>
        <ChartCanvas series={series} labels={labels} unit={unit} w={w} h={h} hover={hover} setHover={setHover} stepMode />
        {!hasData && (
          <div className="chart-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style={{ opacity: 0.5 }}><path d="M3 3v18h18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><path d="M7 14l3-3 3 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" /></svg>
            <span style={{ fontSize: 'var(--text-sm)', maxWidth: 360 }}>Ajoute des positions (avec TP / SL) dans tes simulations pour voir la trajectoire du capital.</span>
          </div>
        )}
        {hasData && hover != null && (
          <div className="chart-tip" style={{ left: Math.min(Math.max(0, (hover / Math.max(1, len - 1)) * 100), 70) + '%', top: 8 }}>
            <div className="d">{labels[hover]}</div>
            {series.map(se => {
              const raw = se.data[hover];
              let base = se.data.length ? se.data[0] : null;
              const val = unit === 'pct' ? (base ? (raw / base - 1) * 100 : 0) : raw;
              return <div className="r" key={se.key}><span className="k"><span style={{ width: 8, height: 8, borderRadius: '50%', background: se.chipColor, display: 'inline-block' }} />{se.name}</span><span className="v">{unit === 'pct' ? (val >= 0 ? '+' : MINUS) + Math.abs(val).toFixed(2) + '%' : numFmtSigned(val, 0)}</span></div>;
            })}
          </div>
        )}
      </div>
      <div className="chips">
        <SeriesChip label="Total" color="var(--text-primary)" active={chart.total !== false} onChange={() => toggleSeries('total')} />
        {seriesPerSim.map(s => <SeriesChip key={s.id} label={s.name} color={s.color} active={accts[s.id] !== false} onChange={() => toggleSeries(s.id)} />)}
      </div>
    </div>
  );
}

/* =============================================================
   JOURNAL — VUE
   -------------------------------------------------------------
   Réutilise la coquille des panneaux de compte (.account-panel / .modal-stats /
   .acc-list + Section) plutôt que d'inventer une mise en page.
   INVARIANTS DE NON-OBJECTIF, à relire à chaque modification : aucune couleur
   gain/perte, aucune note, aucun score, aucun classement, aucun libellé
   « bien/mal ». Les seules quantités affichées sont des décomptes et un `n`.
   ============================================================= */

/* Grille de chips sélectionnables. Il n'existe aucun multi-select réutilisable dans
   l'app : SegmentedControl et le nuancier sont mono-sélection, `.preset-chip` est un
   poseur de valeur, et SeriesChip (bundle DS) impose une pastille de couleur et se
   lit comme une légende de graphe. On étend donc `.preset-chip` en `.jrn-chip`, avec
   l'état actif porté par `aria-pressed` selon la convention d'app.css.
   `mono` autorise la DÉSÉLECTION (retap) : une erreur de doigt doit être annulable. */
function JournalTagGrid({ options, value, mono, groups, onChange, disabled }) {
  const sel = mono ? (value == null ? [] : [value]) : (value || []);
  const on = (id) => sel.indexOf(id) >= 0;
  const click = (id) => {
    if (disabled) return;
    if (mono) return onChange(value === id ? null : id);
    onChange(on(id) ? sel.filter(x => x !== id) : sel.concat([id]));
  };
  const row = (list) => (
    <div className="jrn-chips">
      {list.map(o => (
        <button key={o.id} type="button" className="jrn-chip" aria-pressed={on(o.id)}
          disabled={disabled} onClick={() => click(o.id)}>{o.label}</button>
      ))}
    </div>
  );
  if (!groups) return row(options);
  return (
    <div className="stack" style={{ gap: 'var(--space-3)' }}>
      {JOURNAL_FAMILIES.map(f => {
        const list = options.filter(o => o.family === f.id);
        if (!list.length) return null;
        return <div key={f.id}><span className="lbl">{f.label}</span>{row(list)}</div>;
      })}
      {(() => {
        const orphelins = options.filter(o => !JOURNAL_FAMILIES.some(f => f.id === o.family));
        return orphelins.length ? <div><span className="lbl">Autres</span>{row(orphelins)}</div> : null;
      })()}
    </div>
  );
}

/* Bandeau de faits d'un trade. Volontairement SANS résultat (PnL) : voir « +361 »
   avant de répondre à « plan respecté ? » biaiserait mécaniquement la réponse. */
function JournalFacts({ rec, accounts }) {
  const acc = accounts.find(a => a.id === rec.walletId) || {};
  const cap = rec.cap || {};
  const ref = cap.atOpen || cap.last;
  // Exposition affichée UNIQUEMENT tant que la position vit : on réutilise alors la
  // formule de tout le reste de l'app (équity TOTALE perp + spot − latent + funding —
  // en isolated, le compte perp seul vaudrait ~100 % par construction).
  // Pour un trade clos, ni la marge ni le capital d'alors ne sont récupérables auprès
  // de l'API, et `cap.equityAtOpen` n'est qu'une interpolation grossière — afficher un
  // pourcentage bâti dessus donnerait une fausse précision.
  const snap = (rec.t1 == null && (acc.hl || {}).snapshot) || null;
  const pos = snap ? (snap.positions || []).find(p => p.coin === rec.coin) : null;
  const alloc = pos ? clampPct(safePct(pos.margin, Math.max(0, (snap.equity || 0) - (snap.latent || 0) + (pos.fundingSinceOpen || 0)))) : null;
  return (
    <div className="stack" style={{ gap: 'var(--space-3)' }}>
      <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center', flexWrap: 'wrap' }}>
        <Badge tone={rec.side} size="sm">{rec.side === 'long' ? 'Long' : 'Short'}</Badge>
        <span style={{ fontWeight: 'var(--weight-semibold)' }}>{rec.coin}</span>
        {ref && ref.lev != null && <LeverageBadge value={ref.lev} size="sm" color={idVar(acc.color)} />}
        <span className="muted" style={{ marginLeft: 'auto', fontSize: 'var(--text-2xs)' }}>{acc.name}</span>
      </div>
      <KpiRow label="Ouvert le">{fmtDateTime(rec.t0)}</KpiRow>
      <KpiRow label="Taille">
        <span className="num">{numFmt(cap.sizeOpened, 4)} {rec.coin} @ {numFmt(cap.avgEntry, 2)}</span>
      </KpiRow>
      {ref && ref.margin != null && <KpiRow label="Marge engagée"><span className="num">{numFmt(ref.margin, 2)} USDC</span></KpiRow>}
      {alloc != null && <KpiRow label="Exposition"><span className="num">{Math.round(alloc)} %</span></KpiRow>}
      {ref && ref.liqPx != null && <KpiRow label="Liquidation"><span className="num">{numFmt(ref.liqPx, 0)}</span></KpiRow>}
      {ref && <KpiRow label="Cibles posées">
        <span className="num">{ref.tp != null ? 'TP ' + numFmt(ref.tp, 0) : 'aucun TP'}
          {' · '}{ref.sl != null ? 'SL ' + numFmt(ref.sl, 0) : 'aucun SL'}</span>
      </KpiRow>}
      {!ref && <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
        Position jamais observée vivante : levier, marge et cibles ne sont pas récupérables auprès de l’API.
      </span>}
    </div>
  );
}

const J_MODE_LABEL = { tp: 'TP atteint', sl: 'Stop touché', liq: 'Liquidé', manual: 'Clôture manuelle', unknown: 'Indéterminée' };
const J_MODE_TONE = { tp: 'gain', sl: 'loss', liq: 'loss', manual: 'neutral', unknown: 'neutral' };

/* Formulaire d'ouverture — ordonné par fréquence de remplissage attendue.
   AUCUNE validation : un formulaire vide est enregistrable, une non-réponse est
   une donnée. La seule garantie est l'horodatage de la saisie. */
function JournalOpeningForm({ state, rec, accounts, draft, set, noFacts }) {
  return (
    <div className="stack">
      {!noFacts && <JournalFacts rec={rec} accounts={accounts} />}
      {rec.t1 != null && (
        <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
          Ce trade est déjà clôturé : le résultat est connu au moment de la saisie. C’est enregistré comme tel.
        </span>
      )}
      {!noFacts && <div className="divider" />}
      <Field label="État d’esprit à l’entrée">
        <JournalTagGrid mono options={jOptions(state, 'mindsets')} value={draft.mindset} onChange={v => set({ mindset: v })} />
      </Field>
      <Field label="Setup d’entrée">
        <JournalTagGrid groups options={jOptions(state, 'setups')} value={draft.setups} onChange={v => set({ setups: v })} />
      </Field>
      <Field label="Cible de sortie visée">
        <JournalTagGrid options={jOptions(state, 'tps')} value={draft.tps} onChange={v => set({ tps: v })} />
      </Field>
      <Field label="Gestion du risque">
        <JournalTagGrid options={JOURNAL_CATALOG.risk} value={draft.risk} onChange={v => set({ risk: v })} />
      </Field>
    </div>
  );
}

/* Éditeur après coup de la saisie d'ouverture (fiche de relecture). Monté à la
   demande : le draft s'initialise depuis rec.opening AU MONTAGE — fermer puis
   rouvrir l'édition repart donc toujours des valeurs enregistrées. */
function JournalOpeningEdit({ state, rec, accounts, onSave, onCancel }) {
  const o = rec.opening || {};
  const [draft, setDraft] = useState(() => ({
    mindset: o.mindset != null ? o.mindset : null,
    setups: (o.setups || []).slice(), tps: (o.tps || []).slice(), risk: (o.risk || []).slice(),
  }));
  const set = (patch) => setDraft(d => ({ ...d, ...patch }));
  return (
    <>
      <JournalOpeningForm state={state} rec={rec} accounts={accounts} draft={draft} set={set} noFacts />
      <div className="btn-row">
        <Button size="sm" onClick={onCancel}>Annuler</Button>
        <Button size="sm" variant="primary" onClick={() => onSave(draft)}>Enregistrer</Button>
      </div>
    </>
  );
}

/* Formulaire de clôture. La raison de clôture manuelle passe EN PREMIER : 73 % des
   clôtures mesurées sur les portefeuilles réels sont des sorties market à la main,
   c'est donc le champ le plus utilisé de tout le système. */
function JournalClosingForm({ state, rec, draft, set }) {
  const x = rec.cap.exit || {};
  return (
    <div className="stack">
      <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center', flexWrap: 'wrap' }}>
        <Badge tone={rec.side} size="sm">{rec.side === 'long' ? 'Long' : 'Short'}</Badge>
        <span style={{ fontWeight: 'var(--weight-semibold)' }}>{rec.coin}</span>
        <Badge tone={J_MODE_TONE[x.mode] || 'neutral'} size="sm">{J_MODE_LABEL[x.mode] || 'Clôture'}</Badge>
      </div>
      <KpiRow label="Clôturé le">{rec.t1 ? fmtDateTime(rec.t1) : '—'}</KpiRow>
      {x.avgExit ? <KpiRow label="Prix de sortie"><span className="num">{numFmt(x.avgExit, 2)}</span></KpiRow> : null}
      <KpiRow label="Durée">{rec.t1 ? fmtDur(rec.t0, rec.t1) : '—'}</KpiRow>
      {x.fees != null ? <KpiRow label="Frais"><span className="num">{numFmt(x.fees, 2)} USDC</span></KpiRow> : null}
      <div className="divider" />
      {x.mode === 'manual' && (
        <Field label="Pourquoi cette sortie à la main ?">
          <JournalTagGrid mono options={jOptions(state, 'closeReasons')} value={draft.reason} onChange={v => set({ reason: v })} />
        </Field>
      )}
      <Field label="Plan respecté">
        <SegmentedControl options={[{ value: 'yes', label: 'Oui' }, { value: 'partial', label: 'Partiellement' }, { value: 'no', label: 'Non' }]}
          value={draft.planRespected} onChange={v => set({ planRespected: v })} full />

      <Field label="Ce que j’en retiens" hint="Optionnel">

}

/* Carte de partielle / renforcement : AUCUN formulaire nouveau. Le bandeau de faits,
   l'événement concerné et une note libre — ce qui impose structurellement qu'une
   partielle ne pose pas de question de plus. */
function JournalMidForm({ rec, accounts, draft, set }) {
  const ev = (rec.cap.events || []).find(e => rec.reserve && e.id === rec.reserve.evId);
  const dca = rec.reserve && rec.reserve.type === 'add';
  return (
    <div className="stack">
      <JournalFacts rec={rec} accounts={accounts} />
      <div className="divider" />
      <KpiRow label={dca ? 'Renforcement' : 'Sortie partielle'}>
        {ev ? <span className="num">{numFmt(ev.sz, 4)} {rec.coin} @ {numFmt(ev.px, 2)} · {fmtDateTime(ev.at)}</span> : '—'}
      </KpiRow>
      <Field label={dca ? 'Pourquoi renforcer ?' : 'Pourquoi alléger ?'} hint="Optionnel">
        <textarea className="strat-input" rows={3} value={draft.note || ''}
          placeholder="Une phrase suffit…" onChange={e => set({ note: e.target.value })} />
      </Field>
    </div>
  );
}

const J_CARD_TITLE = { opening: 'Ouverture', closing: 'Clôture', partial: 'Sortie partielle', dca: 'Renforcement' };

/* Moteur d'enchaînement. Le paquet de cartes est FIGÉ à l'ouverture : une synchro de
   fond ne doit pas réordonner les cartes sous le doigt de l'utilisateur. Les
   nouvelles cartes apparaîtront à la prochaine ouverture. */
function JournalCardModal({ state, update, deck, startIndex, accounts, onClose }) {
  const [i, setI] = useState(startIndex || 0);
  const [draft, setDraft] = useState({});
  useEsc(onClose);
  const rec = deck[i] ? jRec(state, deck[i].key) : null;
  const type = rec ? jCardType(rec) : null;
  const set = (patch) => setDraft(d => ({ ...d, ...patch }));
  const goto = (n) => { setI(n); setDraft({}); };

  if (!rec || !type) return (
    <Modal open title="Journal" width="default" onClose={onClose}
      footer={<Button variant="primary" onClick={onClose}>Fermer</Button>}>
      <div className="empty-note">Tout est journalisé.</div>
    </Modal>
  );

  const save = () => {
    const nowMs = Date.now();
    update(s => {
      const J = jEnsure(s);
      const r = J.trades[rec.key];
      if (!r) return;
      if (type === 'opening') {
        r.opening = { mindset: draft.mindset != null ? draft.mindset : null,
          setups: draft.setups || [], tps: draft.tps || [], risk: draft.risk || [],
          // Capté sans être exploité ici : dit si la thèse a été écrite en
          // connaissant déjà le résultat. Indispensable pour que la notation d'un
          // incrément ultérieur sache à quelles données elle peut se fier.
          closureKnownAtSave: r.t1 != null, savedAt: nowMs };
      } else if (type === 'closing') {
        r.closing = { reason: draft.reason != null ? draft.reason : null,
          planRespected: draft.planRespected != null ? draft.planRespected : null,
          note: (draft.note || '').trim(), savedAt: nowMs };
      } else {
        r.midNotes = (r.midNotes || []).concat([{ at: nowMs, type, note: (draft.note || '').trim() }]);
        r.reserve = null;                    // acquittée
      }
    });
    // Un trade DÉJÀ CLOS dont on vient de saisir l'ouverture réclame aussitôt sa
    // carte de clôture : on reste sur la même position du paquet, le formulaire
    // suivant s'affiche au re-rendu. Sans ça la clôture était sautée et le trade
    // restait à moitié rempli jusqu'à ce qu'on le rouvre à la main.
    if (type === 'opening' && rec.t1 != null) { setDraft({}); return; }
    if (i + 1 < deck.length) goto(i + 1); else onClose();
  };
  const later = () => {
    const nowMs = Date.now();
    // « Plus tard » ne SORT PAS la carte de la file — sinon le compteur mentirait.
    // On note seulement quand elle a été esquivée, et elle passe en fin de file.
    update(s => { const r = jEnsure(s).trades[rec.key]; if (r) r.snoozedAt = nowMs; });
    if (i + 1 < deck.length) goto(i + 1); else onClose();
  };

  return (
    <Modal open width="default" onClose={onClose}
      title={J_CARD_TITLE[type] + ' · ' + rec.coin + (deck.length > 1 ? '  (' + (i + 1) + '/' + deck.length + ')' : '')}
      footer={<div className="btn-row"><Button onClick={later}>Plus tard</Button>
        <Button variant="primary" onClick={save}>Enregistrer</Button></div>}>
      {type === 'opening' ? <JournalOpeningForm state={state} rec={rec} accounts={accounts} draft={draft} set={set} />
        : type === 'closing' ? <JournalClosingForm state={state} rec={rec} draft={draft} set={set} />
        : <JournalMidForm rec={rec} accounts={accounts} draft={draft} set={set} />}
    </Modal>
  );
}

/* Un point = un trade. La teinte porte UNIQUEMENT l'identité du portefeuille ;
   l'état de journalisation est porté par la FORME (contour / demi / plein), pour
   que les deux encodages ne se disputent jamais la même variable visuelle. */
function JournalDot({ rec, colorKey, label, onClick, onHover, onLeave }) {
  const st = jDotState(rec);
  // Tooltip dessiné par l'app (immédiat) plutôt que l'attribut title : le délai du
  // tooltip natif (~1 s au premier survol) est imposé par le navigateur, non réglable.
  const show = (e) => onHover(label, e.currentTarget.getBoundingClientRect());
  return (
    <button type="button" className={'jrn-dot ' + st} aria-label={label}
      style={{ '--dot': idVar(colorKey) }}
      onMouseEnter={show} onMouseLeave={onLeave} onFocus={show} onBlur={onLeave}
      onClick={onClick} />
  );
}

function JournalGrid({ records, accounts, onOpen }) {
  const colorOf = (id) => (accounts.find(a => a.id === id) || {}).color || 'slate';
  const nameOf = (id) => (accounts.find(a => a.id === id) || {}).name || '—';
  // Numéro de trade — mêmes épisodes que les badges des graphes (rang glissant sur
  // l'horizon des fills, jamais stocké, cf. JournalTradeModal) ; hors horizon → pas
  // de numéro, repli Long/Short.
  const numOf = useMemo(() => {
    const m = {};
    for (const a of accounts) {
      if (a.source !== 'hyperliquid') continue;
      for (const e of hlEpisodes((a.hl || {}).fills)) m[a.id + '|' + e.coin + '|' + e.t0] = e.n;
    }
    return m;
  }, [accounts]);
  // Infobulle « <wallet> L#<n> <date> » — l'état de journalisation n'y figure pas :
  // il est déjà porté par la forme du point (et la légende de la page Journal).
  const labelOf = (rec) => {
    const n = numOf[rec.walletId + '|' + rec.coin + '|' + rec.t0];
    const tag = n != null ? (rec.side === 'long' ? 'L#' : 'S#') + n : (rec.side === 'long' ? 'Long' : 'Short');
    return nameOf(rec.walletId) + ' ' + tag + ' ' + new Date(rec.t0).toLocaleDateString('fr-FR');
  };
  // Tri croissant : l'ordre du document en lignes place le plus récent en bas à
  // droite, sans inversion. ~50 points → ni virtualisation ni fenêtre glissante
  // (garde-fou à 600 pour ne jamais bloquer le rendu, invisible avant des années).
  const shown = records.slice().sort((a, b) => a.t0 - b.t0).slice(-600);
  // Fil scrollable : les récents sont en bas — on y démarre. Pas de légende — le
  // tooltip des points porte tout au survol (l'état reste porté par la forme).
  const gridRef = useRef(null);
  useEffect(() => { if (gridRef.current) gridRef.current.scrollTop = gridRef.current.scrollHeight; }, [shown.length]);
  // Tooltip en position:fixed (coordonnées viewport du point survolé) : il échappe
  // ainsi au clip du conteneur scrollable ; bascule sous le point près du bord haut.
  const [tip, setTip] = useState(null);
  const showTip = (label, r) => {
    const below = r.top < 48;
    setTip({ label, below, x: r.left + r.width / 2, y: below ? r.bottom + 6 : r.top - 6 });
  };
  const hideTip = () => setTip(null);
  if (!shown.length) return <div className="empty-note">Aucun trade détecté pour l’instant.</div>;
  return (
    <>
      <div className="jrn-grid" ref={gridRef}>
        {shown.map(rec => (
          <JournalDot key={rec.key} rec={rec} colorKey={colorOf(rec.walletId)}
            label={labelOf(rec)} onHover={showTip} onLeave={hideTip}
            onClick={() => { hideTip(); onOpen(rec); }} />
        ))}
      </div>
      {tip && <div className={'jrn-tip' + (tip.below ? ' below' : '')} style={{ left: tip.x, top: tip.y }}>{tip.label}</div>}
    </>
  );
}

/* Chips en lecture seule : on ne rend que les options RETENUES, pas tout le
   catalogue grisé. `aria-pressed` + `aria-disabled` donnent « choisi, inerte » avec
   le CSS existant. Le libellé passe par jLabel, donc une option désactivée depuis
   reste lisible. */
function JournalTags({ state, kind, ids, vide }) {
  const list = [].concat(ids || []).filter(x => x != null);
  if (!list.length) return <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>{vide || 'rien de noté'}</span>;
  return (
    <div className="jrn-chips">
      {list.map(id => <span key={id} className="jrn-chip" aria-pressed="true" aria-disabled>{jLabel(state, kind, id)}</span>)}
    </div>
  );
}

const J_EVENT_LABEL = { open: 'Ouverture', add: 'Renforcement', reduce: 'Sortie partielle', close: 'Clôture' };
/* Traduction des statuts d'ordre de l'API. La distinction qui compte est
   `canceled` (geste de l'utilisateur) vs `reduceOnlyCanceled` / `siblingFilledCanceled`
   (retraits automatiques par la plateforme) — c'est elle qui rend le cycle de vie des
   TP/SL exploitable, et elle n'était lisible nulle part dans l'app. */
const J_STATUS_LABEL = {
  open: 'créé', filled: 'exécuté', triggered: 'déclenché',
  canceled: 'annulé à la main', reduceOnlyCanceled: 'retiré (position fermée)',
  siblingFilledCanceled: 'retiré (l’autre jambe est partie)',
  marginCanceled: 'annulé (marge insuffisante)', perpMarginRejected: 'refusé (marge insuffisante)',
  rejected: 'rejeté',
};
const J_PLAN_LABEL = { yes: 'Oui', partial: 'Partiellement', no: 'Non' };

/* Fiche complète d'un trade, ouverte au clic sur un point saturé de la grille.
   Elle lit UNIQUEMENT l'enregistrement du journal, jamais un épisode recalculé :
   c'est ce qui la rend valable indéfiniment, même quand les fills d'origine sont
   sortis de la fenêtre des 200 conservés par l'app.
   Le résultat (PnL) est affiché ICI, contrairement aux cartes de saisie : c'est une
   surface de relecture, il n'y a plus de réponse déclarative à biaiser. */
function JournalTradeModal({ state, update, rec, accounts, onClose }) {
  useEsc(onClose);
  const [noteEditing, setNoteEditing] = useState(false);
  const [openEditing, setOpenEditing] = useState(false);
  const acc = accounts.find(a => a.id === rec.walletId) || {};
  const cap = rec.cap || {};
  const ref = cap.atOpen;
  const x = cap.exit || null;
  const enCours = rec.t1 == null;
  const net = x && x.net != null ? x.net : null;
  const snap = (enCours && (acc.hl || {}).snapshot) || null;
  const pos = snap ? (snap.positions || []).find(p => p.coin === rec.coin) : null;
  // Équity TOTALE (perp + spot) — même règle d'exposition que allocOf / JournalFacts.
  const alloc = pos ? clampPct(safePct(pos.margin, Math.max(0, (snap.equity || 0) - (snap.latent || 0) + (pos.fundingSinceOpen || 0)))) : null;
  const ordres = (cap.orders || []).filter(o => o.isTrigger);
  const evts = (cap.events || []);
  // Numéro de trade IDENTIQUE aux badges du graphe. Volontairement recalculé à
  // l'affichage depuis les mêmes fills que le graphe, et jamais stocké : ce rang est
  // relatif à l'horizon des 200 fills et glisse quand un vieux trade en sort. Le figer
  // dans l'enregistrement le ferait tôt ou tard contredire le graphe ; le recalculer
  // garantit qu'ils disent toujours la même chose. Hors horizon, le graphe n'affiche
  // rien non plus — donc pas de numéro, et c'est cohérent.
  const num = useMemo(() => {
    const hit = hlEpisodes((acc.hl || {}).fills).find(e => e.coin === rec.coin && e.t0 === rec.t0);
    return hit ? hit.n : null;
  }, [acc, rec.coin, rec.t0]);
  const tag = (rec.side === 'long' ? 'L#' : 'S#') + num;

  return (
    <Modal open width="default" onClose={onClose}
      title={(num != null ? tag + ' · ' : '') + rec.coin + ' · ' + new Date(rec.t0).toLocaleDateString('fr-FR')}
      footer={<Button variant="primary" onClick={onClose}>Fermer</Button>}>
      <div className="stack">
        <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center', flexWrap: 'wrap' }}>
          <Badge tone={rec.side} size="sm">{rec.side === 'long' ? 'Long' : 'Short'}</Badge>
          {num != null && <span className="muted num" style={{ fontSize: 'var(--text-2xs)' }} title="Numéro du trade sur le graphe du portefeuille">{tag}</span>}
          {ref && ref.lev != null && <LeverageBadge value={ref.lev} size="sm" color={idVar(acc.color)} />}
          <ColorDot color={dsColor(acc.color)} size={8} />
          <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>{acc.name}</span>
          {enCours ? <Badge tone="accent" size="sm">En cours</Badge>
            : net != null ? <Badge tone={net >= 0 ? 'gain' : 'loss'} size="sm">{net >= 0 ? 'Gagnant' : 'Perdant'}</Badge>
            : <Badge tone="neutral" size="sm">Clôturé</Badge>}
          <span style={{ marginLeft: 'auto' }}>
            {net != null && <MoneyValue value={net} size="md" signed colored="pnl" showCurrency={false} />}
          </span>
        </div>

        <div className="stack" style={{ gap: 'var(--space-3)' }}>
          <span className="lbl">Entrée</span>
          <KpiRow label="Date">{fmtDateTime(rec.t0)}</KpiRow>
          <KpiRow label="Taille"><span className="num">{numFmt(cap.sizeOpened, 4)} {rec.coin} @ {numFmt(cap.avgEntry, 2)}</span></KpiRow>
          {ref && ref.margin != null && <KpiRow label="Marge engagée"><span className="num">{numFmt(ref.margin, 2)} USDC</span></KpiRow>}
          {alloc != null && <KpiRow label="Exposition"><span className="num">{Math.round(alloc)} %</span></KpiRow>}
          {ref && ref.liqPx != null && <KpiRow label="Liquidation"><span className="num">{numFmt(ref.liqPx, 0)}</span></KpiRow>}
          {ref && <KpiRow label="Cibles posées">
            <span className="num">{ref.tp != null ? 'TP ' + numFmt(ref.tp, 0) : 'aucun TP'}
              {' · '}{ref.sl != null ? 'SL ' + numFmt(ref.sl, 0) : 'aucun SL'}</span>
          </KpiRow>}
          {!ref && <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
            Position jamais observée vivante par l’app : levier, marge, liquidation et cibles ne sont pas récupérables auprès de l’API.
          </span>}
        </div>

        {!enCours && x && (
          <div className="stack" style={{ gap: 'var(--space-3)' }}>
            <span className="lbl">Sortie</span>
            <KpiRow label="Date">{fmtDateTime(rec.t1)}</KpiRow>
            {x.avgExit ? <KpiRow label="Prix moyen"><span className="num">{numFmt(x.avgExit, 2)}</span></KpiRow> : null}
            <KpiRow label="Type"><Badge tone={J_MODE_TONE[x.mode] || 'neutral'} size="sm">{J_MODE_LABEL[x.mode] || '—'}</Badge></KpiRow>
            {x.fees != null ? <KpiRow label="Frais"><span className="num">{numFmt(x.fees, 2)} USDC</span></KpiRow> : null}

              {rec.opening.closureKnownAtSave && (
                <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>

                  <div className="stack" style={{ gap: 'var(--space-2)' }}>

        {/* Note libre — la même que celle du panneau du wallet : un seul champ, deux

                </span>

                  <div key={e.id} className="mv-row">
                    <Badge tone="neutral" size="sm">{J_EVENT_LABEL[e.type] || e.type}</Badge>
                    <span className="num">{numFmt(e.sz, 4)} @ {numFmt(e.px, 2)}</span>

        {!!ordres.length && (
          <div className="stack" style={{ gap: 'var(--space-2)' }}>

            <div className="pos-list">
              {ordres.map(o => (

                  <Badge tone="neutral" size="sm">{/stop/i.test(o.orderType || '') ? 'SL' : 'TP'}</Badge>
                  <span className="num">{o.triggerPx != null ? numFmt(o.triggerPx, 0) : '—'}</span>
                  <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
                    {(o.statuses || []).map(st => (J_STATUS_LABEL[st[0]] || st[0]) + ' le ' + fmtDateTime(st[1])).join(' → ')}
                  </span>
                </div>
              ))}
            </div>

        )}
      </div>
    </Modal>
  );
}

/* Une distribution = des DÉCOMPTES, jamais un classement de qualité. Sous n = 10,
   les pourcentages sont supprimés : à 7-8 trades par mois, un pourcentage sur 4
   observations donnerait une fausse précision — c'est exactement le biais que le
   journal est censé corriger. Aucun croisement n'est proposé, pour la même raison. */
const J_MIN_PCT_N = 10;

function JournalDist({ title, n, rows }) {
  const max = rows.reduce((m, r) => Math.max(m, r.count), 0);
  return (
    <div className="stack" style={{ gap: 'var(--space-2)' }}>
      <span className="lbl">{title} <span className="muted">· n = {n}</span></span>
      {!rows.length ? <div className="empty-note">Rien de noté pour l’instant.</div> : (
        <div className="pos-list">
          {rows.map(r => (
            <div key={r.id} className="jrn-bar-row">
              <span>{r.label}</span>
              <span className="jrn-bar"><span style={{ width: (max ? (r.count / max) * 100 : 0) + '%' }} /></span>
              <span className="gnum">{r.count}{n >= J_MIN_PCT_N ? ' · ' + Math.round((r.count / n) * 100) + ' %' : ''}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function JournalStats({ state, records }) {
  const comptes = records.filter(jCounted);
  const avecOuv = records.filter(r => r.opening);
  const clos = records.filter(r => r.closing && r.cap.exit);
  const tally = (list, get) => {
    const m = {};
    for (const r of list) for (const id of [].concat(get(r) || [])) if (id != null) m[id] = (m[id] || 0) + 1;
    return Object.keys(m).map(id => ({ id, count: m[id] })).sort((a, b) => b.count - a.count);
  };
  const lab = (kind) => (rows) => rows.map(r => ({ ...r, label: jLabel(state, kind, r.id) }));
  return (
    <div className="stack">
      <div className="modal-stats">
        <ModalStat label="Trades suivis"><span className="gnum">{comptes.length}</span></ModalStat>
        <ModalStat label="Ouvertures notées"><span className="gnum">{avecOuv.length}</span></ModalStat>
        <ModalStat label="Clôtures notées"><span className="gnum">{clos.length}</span></ModalStat>
      </div>
      {avecOuv.length < J_MIN_PCT_N && (
        <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
          Volume encore trop faible pour que des pourcentages ou des croisements veuillent dire quoi que ce soit — décomptes bruts seulement.
        </span>
      )}
      <JournalDist title="Setups d’entrée" n={avecOuv.length} rows={lab('setups')(tally(avecOuv, r => r.opening.setups))} />
      <div className="divider" />
      <JournalDist title="État d’esprit" n={avecOuv.length} rows={lab('mindsets')(tally(avecOuv, r => r.opening.mindset))} />
      <div className="divider" />
      <JournalDist title="Cibles visées" n={avecOuv.length} rows={lab('tps')(tally(avecOuv, r => r.opening.tps))} />
      <div className="divider" />
      <JournalDist title="Mode de clôture" n={clos.length}
        rows={tally(clos, r => r.cap.exit.mode).map(r => ({ ...r, label: J_MODE_LABEL[r.id] || r.id }))} />
      <div className="divider" />
      <JournalDist title="Raison d’une sortie à la main" n={clos.filter(r => r.closing.reason).length}
        rows={lab('closeReasons')(tally(clos, r => r.closing.reason))} />
    </div>
  );
}

/* Un bloc de réglages. Interaction VOLONTAIREMENT distincte de la sélection : ici un
   clic active/désactive une option du catalogue au lieu de la choisir. Seul le
   vocabulaire visuel (.jrn-chips/.jrn-chip) est partagé — fusionner les deux dans un
   composant à drapeau `manage` aurait donné une sémantique ambiguë. */
function JournalConfigBlock({ state, update, kind, title, grouped }) {
  const [adding, setAdding] = useState(false);
  const [txt, setTxt] = useState('');
  const [fam, setFam] = useState(JOURNAL_FAMILIES[0].id);
  const off = jOff(state, kind);
  const custom = jCustom(state, kind);
  const all = (JOURNAL_CATALOG[kind] || []).concat(custom);
  const actives = all.filter(o => off.indexOf(o.id) < 0).length;
  const isCustom = (id) => custom.some(o => o.id === id);

  const toggle = (id) => update(s => {
    const J = jEnsure(s);
    const c = J.config.off || (J.config.off = {});
    const list = c[kind] || (c[kind] = []);
    const i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
  });
  const add = () => {
    const t = txt.trim(); if (!t) return;
    update(s => {
      const J = jEnsure(s);
      const c = J.config.custom || (J.config.custom = {});
      const list = c[kind] || (c[kind] = []);
      // Préfixe `c_` : un id personnalisé ne peut jamais entrer en collision avec le catalogue.
      list.push(grouped ? { id: 'c_' + uid(), family: fam, label: t } : { id: 'c_' + uid(), label: t });
    });
    setTxt(''); setAdding(false);
  };
  const del = (id) => update(s => {
    const J = jEnsure(s);
    const c = J.config.custom || {};
    if (c[kind]) c[kind] = c[kind].filter(o => o.id !== id);
    const o = J.config.off || {};
    if (o[kind]) o[kind] = o[kind].filter(x => x !== id);
  });

  const chips = (list) => (
    <div className="jrn-chips">
      {list.map(o => (
        <span key={o.id} className="jrn-chipwrap">
          <button type="button" className="jrn-chip" aria-pressed={off.indexOf(o.id) < 0}
            onClick={() => toggle(o.id)}>{o.label}</button>
          {isCustom(o.id) && <button type="button" className="jrn-chipx" title="Supprimer" onClick={() => del(o.id)}>×</button>}
        </span>
      ))}
    </div>
  );

  return (
    <div className="stack" style={{ gap: 'var(--space-3)' }}>
      <span className="lbl">{title} <span className="muted">· {actives} active{actives > 1 ? 's' : ''}</span></span>
      {actives < 5 && (
        <span className="muted" style={{ fontSize: 'var(--text-2xs)', color: 'var(--warn)' }}>
          Moins de 5 options actives : la saisie devient trop grossière pour être exploitable plus tard.
        </span>
      )}
      {grouped
        ? JOURNAL_FAMILIES.map(f => {
            const list = all.filter(o => o.family === f.id);
            return list.length ? <div key={f.id}><span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>{f.label}</span>{chips(list)}</div> : null;
          })
        : chips(all)}
      {adding ? (
        <div className={grouped ? 'grid2' : undefined}>
          <Input value={txt} placeholder="Nom de l’option" autoFocus
            onChange={e => setTxt(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') add(); }} />
          {grouped && (
            <select className="jrn-select" value={fam} onChange={e => setFam(e.target.value)}>
              {JOURNAL_FAMILIES.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
            </select>
          )}
          <div className="btn-row">
            <Button size="sm" onClick={() => { setAdding(false); setTxt(''); }}>Annuler</Button>
            <Button size="sm" variant="primary" disabled={!txt.trim()} onClick={add}>Ajouter</Button>
          </div>
        </div>
      ) : (
        <div><Button size="sm" onClick={() => setAdding(true)}>Ajouter une option</Button></div>
      )}
    </div>
  );
}

function JournalConfig({ state, update, records }) {
  const backup = (() => {
    try { return JSON.parse(localStorage.getItem(JOURNAL_BACKUP_KEY) || 'null'); } catch (e) { return null; }
  })();
  const nBackup = backup ? Object.keys(backup.entries || {}).length : 0;
  const nSaisies = records.filter(r => r.opening || r.closing).length;
  const poids = Math.round(JSON.stringify(jSlice(state)).length / 1024);

  /* Réinjecte les saisies sauvegardées SANS écraser ce qui existe : une restauration
     ne doit jamais faire perdre une saisie plus récente. */
  const restore = () => {
    if (!backup || !nBackup) return;
    if (!confirm('Réinjecter ' + nBackup + ' saisie(s) depuis la sauvegarde locale ? Les saisies actuelles sont conservées.')) return;
    update(s => {
      const J = jEnsure(s);
      if (backup.config && !Object.keys(J.config || {}).length) J.config = backup.config;
      // Notes partagées : réinjecte celles qui manquent dans la table (jamais d'écrasement).
      for (const n of (backup.sharedNotes || [])) {
        if (n && n.id && n.text && !snList(s).some(x => x.id === n.id)) snEnsure(s).push(n);
      }
      for (const k of Object.keys(backup.entries || {})) {
        const src = backup.entries[k], r = J.trades[k];
        if (!r || !src) continue;
        if (!r.opening && src.opening) r.opening = src.opening;
        if (!r.closing && src.closing) r.closing = src.closing;
        if (!(r.midNotes || []).length && (src.midNotes || []).length) r.midNotes = src.midNotes;
        if (!r.note && src.note) r.note = src.note;
        if (!r.snoteId && src.snoteId) r.snoteId = src.snoteId;
      }
    });
  };
  const purge = () => {
    const n = jRecs(state).filter(r => r.orphan).length;
    if (!n) return alert('Aucun enregistrement orphelin.');
    if (!confirm('Supprimer ' + n + ' enregistrement(s) orphelin(s) ?')) return;
    update(s => { const J = jEnsure(s); for (const k of Object.keys(J.trades)) if (J.trades[k].orphan) delete J.trades[k]; });
  };

  return (
    <div className="stack">
      <JournalConfigBlock state={state} update={update} kind="setups" title="Setups d’entrée" grouped />
      <div className="divider" />
      <JournalConfigBlock state={state} update={update} kind="tps" title="Cibles de sortie" />
      <div className="divider" />
      <JournalConfigBlock state={state} update={update} kind="mindsets" title="États d’esprit" />
      <div className="divider" />
      <JournalConfigBlock state={state} update={update} kind="closeReasons" title="Raisons de sortie à la main" />
      <div className="divider" />
      <span className="lbl">Gestion du risque</span>
      <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>
        Les trois déclarations de risque ne sont pas modifiables : elles servent de repère stable dans le temps.
      </span>
      <div className="jrn-chips">
        {JOURNAL_CATALOG.risk.map(o => <span key={o.id} className="jrn-chip" aria-disabled>{o.label}</span>)}
      </div>
      <div className="divider" />
      <span className="lbl">Entretien</span>
      <div className="modal-stats">
        <ModalStat label="Saisies"><span className="gnum">{nSaisies}</span></ModalStat>
        <ModalStat label="Sauvegarde locale"><span className="gnum">{nBackup}</span></ModalStat>
        <ModalStat label="Poids du journal"><span className="gnum">{poids} Ko</span></ModalStat>
      </div>
      <div className="btn-row">
        <Button size="sm" onClick={purge}>Purger les orphelins</Button>
        <Button size="sm" disabled={!nBackup} onClick={restore}>Restaurer depuis la sauvegarde</Button>
      </div>
    </div>
  );
}

/* Gestion centrale des notes partagées — liste datée avec compteur de positions
   liées, édition, suppression (purge des références partout, même update). */
function SharedNotesModal({ state, update, onClose }) {
  useEsc(onClose);
  const [editId, setEditId] = useState(null);
  const notes = snList(state).slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const del = (n) => {
    const usage = snUsage(state, n.id);
    if (!confirm('Supprimer cette note partagée ?' + (usage ? ' Elle est attachée à ' + usage + ' position(s) — les liens seront retirés.' : ''))) return;
    snDelete(update, n.id);
    if (editId === n.id) setEditId(null);
  };
  return (
    <Modal open title="Notes partagées" width="default" onClose={onClose}
      footer={<Button variant="primary" onClick={onClose}>Fermer</Button>}>
      {notes.length === 0
        ? <div className="empty-note">Aucune note partagée. Crée-en une depuis l’icône lien d’une ligne de position.</div>
        : <div className="pos-list">
            {notes.map(n => editId === n.id
              ? <NoteEditor key={n.id} requireText value={n.text}
                  onSave={(t) => { snSetText(update, n.id, t); setEditId(null); }} onCancel={() => setEditId(null)} />
              : <div key={n.id} className="strat-row">
                  <div className="strat-main">
                    <span className="muted strat-date">{fmtDateShort(dOf(n.at))} · {snUsage(state, n.id)} position(s) liée(s)</span>
                    <span className="strat-text" style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}><NoteBody text={n.text} /></span>
                  </div>
                  <div className="strat-actions">
                    <IconButton size="sm" label="Éditer" onClick={() => setEditId(n.id)}><IEdit /></IconButton>
                    <IconButton size="sm" label="Supprimer" onClick={() => del(n)}><ITrash /></IconButton>
                  </div>
                </div>)}
          </div>}
    </Modal>
  );
}

/* =============================================================
   APP
   ============================================================= */
function App() {
  const [state, update, replace, resync] = useStore();
  const { loading, error: priceError, refresh } = useBtcPrice(state, update);
  const [createOpen, setCreateOpen] = useState(false);
  const [pineAllOpen, setPineAllOpen] = useState(false);
  const [snotesOpen, setSnotesOpen] = useState(false);
  const [createSimOpen, setCreateSimOpen] = useState(false);
  const [activeSim, setActiveSim] = useState(null);
  const [newTabOpen, setNewTabOpen] = useState(false);
  const fileRef = useRef(null);

  // Bail réclamé DANS l'initialiseur (pas dans un effet) : les effets de
  // useBtcPrice/syncAllHl sont enregistrés avant ceux d'App et écriraient déjà.
  // L'opération est idempotente, et il n'y a pas de StrictMode ici.
  const [owner, setOwner] = useState(() => refreshOwnerLease());
  useEffect(() => {
    // Reprise du bail par CET onglet (libre ou périmé) : on relit d'abord le document —
    // un autre onglet a pu écrire pendant qu'on était en lecture seule ou suspendu
    // (téléphone en arrière-plan, page en cache), et persist réécrit TOUT depuis la mémoire.
    const tick = () => {
      const had = isOwner();
      const ok = refreshOwnerLease();
      if (ok && !had) resync();
      setOwner(ok);
    };
    // Retour sur la page (onglet réaffiché, page restaurée du cache) : reprise immédiate,
    // sans attendre le prochain tick de 20 s.
    const onVisible = () => { if (document.visibilityState === 'visible') tick(); };
    tick();
    const id = setInterval(tick, OWNER_RENEW_MS);
    // pagehide : seul événement de sortie fiable sur mobile (Safari iOS n'émet jamais
    // beforeunload, Chrome Android rarement). Sans lui, une page rechargée ou rouverte
    // trouvait le bail de la précédente encore « frais » et restait en lecture seule
    // jusqu'à 3 min — « Prendre la main », qui recharge, retombait dans le même piège.
    window.addEventListener('beforeunload', releaseOwner);
    window.addEventListener('pagehide', releaseOwner);
    window.addEventListener('pageshow', tick);
    document.addEventListener('visibilitychange', onVisible);
    return () => {
      clearInterval(id);
      window.removeEventListener('beforeunload', releaseOwner);
      window.removeEventListener('pagehide', releaseOwner);
      window.removeEventListener('pageshow', tick);
      document.removeEventListener('visibilitychange', onVisible);
      releaseOwner();
    };
  }, []);

  const price = state.btc.price;
  useEffect(() => { document.documentElement.setAttribute('data-theme', state.settings.theme); }, [state.settings.theme]);

  // agg = agrégat AFFICHÉ (flux re-basés sur le T0 de chaque compte) ;
  // aggRaw = agrégat depuis l'origine, seul comparable aux points de `history`.
  const agg = useMemo(() => aggregateNow(state.accounts, price, state.priceHistory), [state.accounts, price, state.priceHistory]);
  const aggRaw = useMemo(() => aggregate(state.accounts, price), [state.accounts, price]);
  const history = useMemo(() => buildHistory(state.accounts, state.priceHistory), [state.accounts, state.priceHistory]);

  const today = useMemo(() => {
    const t = todayStr();
    const prior = history.filter(p => p.date < t);
    const b = prior.length ? prior[prior.length - 1] : null;
    if (!b) return { latent: 0, latentPct: 0 };
    // Delta de gains totaux (latent + réalisé) = variation d'équity hors flux —
    // couvre les clôtures du jour ET les comptes hyperliquid (latent historisé constant).
    // Sur aggRaw : `history` n'est pas re-basé, un T0 décalerait les deux membres.
    const dl = (aggRaw.latent + aggRaw.realized) - (b.latent + b.realized);
    return { latent: dl, latentPct: safePct(dl, b.equity) };
  }, [aggRaw, history]);

  const [backfilling, setBackfilling] = useState(false);
  const backfillHistory = useCallback(async () => {
    const start = earliestActivity(state.accounts);
    if (!start) { alert('Crée d’abord un compte et saisis tes positions avec leurs dates.'); return; }
    setBackfilling(true);
    try {
      const startMs = new Date(start + 'T00:00:00').getTime();
      const days = Math.min(365, Math.ceil((Date.now() - startMs) / 86400000) + 2);
      const url = `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=${days}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!d || !Array.isArray(d.prices)) throw new Error('Réponse inattendue');
      const daily = {};
      for (const [ms, p] of d.prices) daily[todayStr(new Date(ms))] = p;
      update(s => {
        s.priceHistory = { ...daily, ...(s.priceHistory || {}) };
        if (s.btc.price != null) s.priceHistory[todayStr()] = s.btc.price;
      });
    } catch (e) {
      alert('Reconstruction impossible : ' + e.message + '\n(API CoinGecko gratuite — réessaie dans 1 min si limite atteinte.)');
      console.warn('Backfill échoué :', e);
    } finally { setBackfilling(false); }
  }, [state.accounts, update]);

  /* ── Synchro des comptes Hyperliquid ─────────────────────────
     Léger (état + ordres) à chaque tick auto-refresh ; complet
     (portfolio/ledger/fills/spot) au montage, à la demande et
     toutes les HL_FULL_SYNC_MS. stateRef évite les fermetures
     périmées dans l'intervalle. */
  const stateRef = useRef(state);
  stateRef.current = state;
  // Synchros complètes réclamées par le journal (position apparue/disparue vue par la
  // couche légère). État de SESSION, volontairement hors du document persisté : un
  // montage force déjà une synchro complète, donc rien à faire survivre au rechargement.
  const needFullRef = useRef({});
  const syncHl = useCallback(async (id, full = false, addrOverride = null) => {
    const acc = (stateRef.current.accounts || []).find(a => a.id === id && a.source === 'hyperliquid');
    const address = addrOverride || (acc && acc.address);   // override : compte pas encore dans stateRef à la création
    if (!address) return;
    try {
      const d = await fetchHlData(address, full);
      const nowMs = Date.now();     // hors de l'updater : une réinvocation doit être identique
      let escalate = false;
      update(s => {
        const a = s.accounts.find(x => x.id === id);
        if (!a) return;
        const hl = a.hl || (a.hl = {});
        hl.snapshot = d.snapshot;
        hl.lastSync = new Date().toISOString();
        hl.error = null;
        if (d.ledger) hl.ledger = mapHlLedger(d.ledger);
        // Fills AVANT le portfolio : les jours de clôture corrigent l'historique d'équity.
        if (d.fills) hl.fills = mapHlFills(d.fills, hlOrdersById(d.histOrders), address);
        if (d.portfolio) {
          const closes = groupHlFills(hl.fills).filter(g => /^Close/.test(g.dir) || g.dir === 'Liquidation');
          applyHlPortfolio(d.portfolio, hl, closes);
          hl.lastFull = hl.lastSync;
        }
        hl.equityHistory = { ...(hl.equityHistory || {}), [todayStr()]: d.snapshot.equity };
        // Point live (60 s) : la courbe du jour s'affine en continu tant que l'app est ouverte.
        hl.samples = thinHlSamples([...(hl.samples || []), [Date.now(), d.snapshot.equity]].sort((a, b) => a[0] - b[0]));
        hl.spotNote = d.spotNote;
        // Journal. La détection a besoin des fills, donc des synchros COMPLÈTES, et
        // vient après applyHlPortfolio pour interpoler `equityAtOpen` sur des
        // échantillons à jour. La capture live tourne sur TOUTES les synchros.
        if (d.fills) journalDetect(s, id, hl, d.histOrders, address, nowMs);
        escalate = journalObserveLive(s, id, d.snapshot, nowMs);
      });
      // Une position apparue ou disparue ne se lit que dans les fills : on réclame une
      // synchro complète au prochain tick plutôt que d'attendre l'échéance des 10 min.
      if (full) delete needFullRef.current[id];
      if (escalate && !full) needFullRef.current[id] = true;
    } catch (e) {
      console.warn('Synchro Hyperliquid échouée (' + hlShortAddr(address) + ') :', e);
      update(s => { const a = s.accounts.find(x => x.id === id); if (a) { (a.hl || (a.hl = {})).error = e.message; } });
    }
  }, [update]);
  const syncAllHl = useCallback(async (full = false) => {
    for (const a of (stateRef.current.accounts || []).filter(x => x.source === 'hyperliquid')) {
      const needFull = full || !a.hl || !a.hl.lastFull || !!needFullRef.current[a.id] ||
        (Date.now() - new Date(a.hl.lastFull).getTime() > HL_FULL_SYNC_MS);
      await syncHl(a.id, needFull);                       // séquentiel : doux avec le rate limit
    }
  }, [syncHl]);
  useEffect(() => { syncAllHl(true); /* eslint-disable-next-line */ }, []);
  useEffect(() => {
    if (!state.settings.autoRefresh) return;
    const id = setInterval(() => syncAllHl(false), AUTO_REFRESH_MS);
    return () => clearInterval(id);
  }, [state.settings.autoRefresh, syncAllHl]);
  const refreshAll = useCallback(() => { refresh(); syncAllHl(false); }, [refresh, syncAllHl]);

  const view = state.settings.view || 'live';
  const createAccount = (d) => {
    const id = uid();
    update(s => { s.accounts.push({ id, cashflows: [], positions: [], ...d }); s.settings.liveAcct = id; });
    if (d.source === 'hyperliquid') syncHl(id, true, d.address);   // 1re synchro complète (backfill portfolio)
    setCreateOpen(false);
  };
  const setLiveAcct = (id) => update(s => { s.settings.liveAcct = id; });
  const createSim = (d) => { const id = uid(); update(s => { if (!s.sims) s.sims = []; s.sims.push({ id, cashflows: [], positions: [], strategies: [], simTab: view, ...d }); }); setActiveSim(id); setCreateSimOpen(false); };
  const setUnit = (u) => update(s => { s.settings.chartUnit = u; });
  const setRange = (r) => update(s => { s.settings.range = r; });
  const toggleSeries = (id) => update(s => {
    if (id === 'total') s.chart.total = !s.chart.total;
    else if (id === 'cash') s.chart.cash = !s.chart.cash;
    else { if (!s.chart.accts) s.chart.accts = {}; s.chart.accts[id] = !s.chart.accts[id]; }
  });
  const toggleTheme = () => update(s => { s.settings.theme = s.settings.theme === 'dark' ? 'light' : 'dark'; });
  const toggleAuto = () => update(s => { s.settings.autoRefresh = !s.settings.autoRefresh; });
  const setView = (v) => update(s => { s.settings.view = v; });
  const setSimUnit = (u) => update(s => { s.settings.simUnit = u; });
  const toggleSimSeries = (id) => update(s => {
    const c = s.settings.simChart || (s.settings.simChart = { total: true, accts: {} });
    if (!c.accts) c.accts = {};
    if (id === 'total') c.total = c.total === false ? true : false;
    else c.accts[id] = c.accts[id] === false ? true : false;
  });
  const createSimTab = () => { update(s => {
    if (!s.simTabs) s.simTabs = [];
    const id = uid();
    s.simTabs.push({ id, name: 'Simulation ' + (s.simTabs.length + 1) });
    s.settings.view = id;
  }); setNewTabOpen(false); };
  /* Copie du Live : un sim par compte live (capital engagé = cash + marges, hors latent),
     positions ouvertes converties en positions simulées (vrai prix, marge %, TP/SL). */
  const createSimTabFromLive = () => {
    const id = uid();
    update(s => {
      if (!s.simTabs) s.simTabs = [];
      s.simTabs.push({ id, name: 'Copie du Live' });
      if (!s.sims) s.sims = [];
      for (const acc of (s.accounts || [])) {
        const snap = accAt(acc, todayStr(), 0);
        // Capital hors PnL latent — identique à cash + openMargin pour un compte manuel
        // (équity = cash + Σ(marge+pnl)), et correct aussi pour un compte hyperliquid.
        const base = Math.max(0, snap.equity - snap.latent);
        const srcPos = acc.source === 'hyperliquid'
          ? (((acc.hl || {}).snapshot || {}).positions || [])          // positions du wallet (déjà mappées)
          : (acc.positions || []).filter(p => p.status === 'open');
        // Conversion CHAÎNÉE (même marche que migrateSims) : simChain applique le % de
        // chaque position au capital APRÈS l'issue des précédentes — un % calculé sur le
        // capital total sous-évaluait l'exposition copiée dès la 2ᵉ position. Le capital
        // est déroulé avec l'issue par défaut (TP si cible, sinon SL), celle que
        // simChoice donnera aux positions fraîchement copiées (sans `scenario`).
        let capital = base;
        const positions = srcPos.map((p, i) => {
          const capitalBefore = Math.max(0, capital);
          const pct = (p.margin != null && capitalBefore > 1e-9) ? clampPct((p.margin / capitalBefore) * 100) : 0;
          const eff = { ...p, margin: (pct / 100) * capitalBefore };
          const pnlTp = p.tp != null ? posPnl(eff, p.tp) : null;
          capital += pnlTp != null ? pnlTp : posPnl(eff, posStopPrice(eff));
          return {
            id: uid(), side: p.side, leverage: p.leverage, entryPrice: p.entryPrice,
            tp: p.tp != null ? p.tp : null, sl: p.sl != null ? p.sl : null,
            openFee: 0, marginPct: pct,
            status: 'open', order: i + 1, openedAt: p.openedAt || (todayStr() + 'T12:00:00'),
            ...(p.note ? { note: p.note } : (p.coin && p.coin !== 'BTC' ? { note: p.coin } : {})),
            // Positions manuelles seulement — le snapshot HL ne porte pas de snoteId
            // (sa référence vit sur le record journal), même règle que `note` ci-dessus.
            ...(p.snoteId ? { snoteId: p.snoteId } : {}),
          };
        });
        s.sims.push({ id: uid(), name: acc.name, color: acc.color, createdAt: todayStr(), openingCash: base, cashflows: [], strategies: [], positions, simTab: id });
      }
      s.settings.view = id;
    });
    setActiveSim(null);
    setNewTabOpen(false);
  };
  const renameSimTab = (id, name) => update(s => { const t = (s.simTabs || []).find(x => x.id === id); if (t) t.name = name; });
  const deleteSimTab = (id) => {
    const t = (state.simTabs || []).find(x => x.id === id);
    if (!confirm('Supprimer l’onglet « ' + (t ? t.name : '') + ' » et toutes ses simulations ?')) return;
    update(s => {
      s.simTabs = (s.simTabs || []).filter(x => x.id !== id);
      s.sims = (s.sims || []).filter(x => x.simTab !== id);
      if (s.settings.view === id) s.settings.view = s.simTabs.length ? s.simTabs[0].id : 'live';
    });
  };
  const duplicateSimTab = (id) => {
    const newId = uid();
    update(s => {
      const tab = (s.simTabs || []).find(x => x.id === id);
      if (!tab) return;
      s.simTabs.splice(s.simTabs.indexOf(tab) + 1, 0, { id: newId, name: tab.name + ' (copie)' });
      if (!s.sims) s.sims = [];
      for (const sim of (s.sims || []).filter(x => x.simTab === id)) {
        s.sims.push({ ...sim, id: uid(), simTab: newId,
          positions: (sim.positions || []).map(p => ({ ...p, id: uid() })),
          strategies: (sim.strategies || []).map(st => ({ ...st, id: uid() })),
          cashflows: (sim.cashflows || []).map(cf => ({ ...cf, id: uid() })) });
      }
      s.settings.view = newId;
    });
    setActiveSim(null);
  };
  const duplicateSim = (id) => {
    const newId = uid();
    update(s => {
      const src = (s.sims || []).find(x => x.id === id);
      if (!src) return;
      const used = (s.sims || []).filter(x => x.simTab === src.simTab).map(a => dsColor(a.color)); // couleurs de l'onglet
      const freshColor = ID_ORDER.find(k => !used.includes(k)) || src.color;
      s.sims.splice(s.sims.indexOf(src) + 1, 0, {
        ...src, id: newId, name: src.name + ' (copie)', color: freshColor,   // simTab conservé par ...src
        positions:  (src.positions  || []).map(p  => ({ ...p,  id: uid() })),
        cashflows:  (src.cashflows  || []).map(cf => ({ ...cf, id: uid() })),
        strategies: (src.strategies || []).map(st => ({ ...st, id: uid() })),
      });
    });
    setActiveSim(newId);   // sélectionne le doublon (même pattern que createSim)
  };

  const doExport = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'btc-wallets-evolution-' + todayStr() + '.json';
    // L'ancre doit être DANS le document et l'URL révoquée au tour suivant : révoquer
    // dans le même tour que click() fait échouer le téléchargement silencieusement
    // sur certains navigateurs (Firefox/Safari).
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 0);
  };
  const doImport = () => fileRef.current && fileRef.current.click();
  const onFile = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.accounts)) throw new Error('Format invalide');
        if (!confirm('Importer ce fichier ? Les données actuelles seront remplacées.')) return;
        // Rejouer les MIGRATIONS comme au chargement (loadState) et à la synchro
        // inter-onglets : un export legacy (positions sim en marge absolue, sims sans
        // onglet, vue disparue) resterait sinon non migré jusqu'au prochain rechargement —
        // et la première persistance détruirait les marges sim (marginPct absent → 0).
        const migrated = hydrate(migrateSimTabs(migrateSims(parsed)));
        // L'import remplace en bloc. Les saisies du journal sont la seule donnée non
        // retéléchargeable de l'app : on nomme les deux comptes avant d'écraser.
        const nAvant = jRecs(state).filter(r => r.opening || r.closing).length;
        const nApres = jRecs(migrated).filter(r => r.opening || r.closing).length;
        if (nAvant > nApres && !confirm('Le fichier contient ' + nApres + ' saisie(s) de journal, l’état actuel en contient '
          + nAvant + '. Continuer et perdre la différence ?\n\n(Une sauvegarde locale des saisies reste récupérable depuis les réglages du journal.)')) return;
        replace(migrated);
      } catch (err) { alert('Import impossible : ' + err.message); }
    };
    reader.readAsText(f);
    e.target.value = '';
  };
  const doReset = () => { if (confirm('Tout effacer et repartir de zéro ? (pense à exporter d’abord)')) replace(defaultState()); };

  const usedColors = state.accounts.map(a => a.color);
  const activeAccId = state.accounts.some(a => a.id === state.settings.liveAcct) ? state.settings.liveAcct : (state.accounts[0] ? state.accounts[0].id : null);
  const activeAccount = state.accounts.find(a => a.id === activeAccId) || null;
  const sims = state.sims || [];
  const simTabs = state.simTabs || [];
  const activeTab = simTabs.find(t => t.id === view) || null;
  const tabSims = sims.filter(a => a.simTab === view);
  const usedSimColors = tabSims.map(a => a.color);
  const activeSimId = tabSims.some(a => a.id === activeSim) ? activeSim : (tabSims[0] ? tabSims[0].id : null);
  const activeSimAcc = tabSims.find(a => a.id === activeSimId) || null;

  return (
    <div className="app">
      <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={onFile} />
      <div className="wrap">
        <SaveWarning owner={owner} />
        <Header btc={state.btc} priceLoading={loading} priceError={priceError} onRefresh={refreshAll}
          onExport={doExport} onImport={doImport} onReset={doReset}
          onBackfill={backfillHistory} backfilling={backfilling}
          theme={state.settings.theme} onToggleTheme={toggleTheme}
          autoRefresh={state.settings.autoRefresh} onToggleAuto={toggleAuto}
          onPine={() => setPineAllOpen(true)} onSnotes={() => setSnotesOpen(true)} />

        <div className="viewnav-row">
          <nav className="viewnav">
            <button aria-pressed={view === 'live'} onClick={() => setView('live')}>Live</button>
            {simTabs.map(t => <button key={t.id} aria-pressed={view === t.id} onClick={() => setView(t.id)}>{t.name || 'Simulation'}</button>)}
            <button className="add" onClick={() => setNewTabOpen(true)} title="Nouvel onglet de simulation">+</button>
          </nav>
          {activeTab && <SimTabMenu name={activeTab.name} onRename={(v) => renameSimTab(view, v)} onDuplicate={() => duplicateSimTab(view)} onDelete={() => deleteSimTab(view)} />}
        </div>

        {(view === 'live' || !activeTab) ? (
          <>
            <div className="dash">
              <SummaryBar agg={agg} today={today} price={price} accounts={state.accounts} state={state} update={update} />
              <EvoChart history={history} accounts={state.accounts} settings={state.settings} chart={state.chart}
                setUnit={setUnit} setRange={setRange} toggleSeries={toggleSeries} onBackfill={backfillHistory} backfilling={backfilling} />
            </div>
            <nav className="accttabs">
              {state.accounts.map(a => (
                <button key={a.id} aria-pressed={a.id === activeAccId} onClick={() => setLiveAcct(a.id)}>
                  <ColorDot color={dsColor(a.color)} size={8} />{a.name}
                </button>
              ))}
              <button className="add" onClick={() => setCreateOpen(true)} title="Créer un compte">+</button>
            </nav>
            {activeAccount
              ? (activeAccount.source === 'hyperliquid'
                  ? <HlAccountPanel key={activeAccount.id} acc={activeAccount} state={state} update={update}
                      usedColors={usedColors} onSync={() => syncHl(activeAccount.id, true)} />
                  : <AccountPanel key={activeAccount.id} acc={activeAccount} price={price} update={update}
                      usedColors={usedColors} history={history} priceHistory={state.priceHistory}
                      onBackfill={backfillHistory} backfilling={backfilling} state={state} />)
              : <div className="empty-note">Crée ton premier compte pour commencer (bouton +).</div>}
          </>
        ) : (
          <>
            <div className="dash">
              <SimSummaryBar sims={tabSims} />
              <SimChart sims={tabSims} unit={state.settings.simUnit || 'usdc'} chart={state.settings.simChart || { total: true, accts: {} }} setUnit={setSimUnit} toggleSeries={toggleSimSeries} />
            </div>
            <nav className="accttabs">
              {tabSims.map(a => (
                <button key={a.id} aria-pressed={a.id === activeSimId} onClick={() => setActiveSim(a.id)}>
                  <ColorDot color={dsColor(a.color)} size={8} />{a.name}
                </button>
              ))}
              <button className="add" onClick={() => setCreateSimOpen(true)} title="Nouvelle simulation">+</button>
            </nav>
            {activeSimAcc
              ? <SimAccountPanel key={activeSimAcc.id} acc={activeSimAcc} state={state} update={update} usedColors={usedSimColors} steps={tabOrderSteps(tabSims)} onDeleted={() => setActiveSim(null)} onDuplicate={duplicateSim} />
              : <div className="empty-note">Crée ta première simulation pour commencer (bouton +).</div>}
          </>
        )}
      </div>

      {createOpen && <CreateAccountModal usedColors={usedColors} onClose={() => setCreateOpen(false)} onCreate={createAccount}
        allowHl hlAddresses={state.accounts.filter(a => a.source === 'hyperliquid').map(a => a.address)} />}
      {createSimOpen && <CreateAccountModal usedColors={usedSimColors} title="Nouvelle simulation" onClose={() => setCreateSimOpen(false)} onCreate={createSim} />}
      {newTabOpen && <NewSimTabModal hasLive={state.accounts.length > 0} onCopy={createSimTabFromLive} onBlank={createSimTab} onClose={() => setNewTabOpen(false)} />}
      {pineAllOpen && <PineScriptModal accounts={state.accounts} price={price} onClose={() => setPineAllOpen(false)} />}
      {snotesOpen && <SharedNotesModal state={state} update={update} onClose={() => setSnotesOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
