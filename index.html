  const deleteCashflow = (cid) => { if (!confirm('Supprimer ce mouvement de trésorerie ?')) return; mutateAcc(a => { a.cashflows = a.cashflows.filter(x => x.id !== cid); }); };
  const addStrategy = () => { const t = strat.trim(); if (t) { mutateAcc(a => { (a.strategies || (a.strategies = [])).push({ id: uid(), text: t, at: todayStr() + 'T12:00:00' }); }); setStrat(''); } };
  const editStrategy = (sid, text) => mutateAcc(a => { const s = (a.strategies || []).find(x => x.id === sid); if (s) s.text = text; });
  const deleteStrategy = (sid) => { if (confirm('Supprimer cette stratégie ?')) mutateAcc(a => { a.strategies = (a.strategies || []).filter(x => x.id !== sid); }); };
  const deleteAccount = () => { if (confirm('Supprimer définitivement le compte « ' + acc.name + ' » et tout son historique ?')) update(s => { s.accounts = s.accounts.filter(x => x.id !== acc.id); s.settings.liveAcct = s.accounts[0] ? s.accounts[0].id : null; }); };
  const duplicateAccount = () => {
    update(s => {
      const src = s.accounts.find(x => x.id === acc.id);
      if (!src) return;
      const newId = uid();
      const used = s.accounts.map(a => dsColor(a.color));
      const freshColor = ID_ORDER.find(k => !used.includes(k)) || src.color;   // 1re couleur libre
      s.accounts.splice(s.accounts.indexOf(src) + 1, 0, {
        ...src, id: newId, name: src.name + ' (copie)', color: freshColor,
        // `...p` copie snoteId tel quel : l'original et la copie pointent la MÊME
        // note partagée — c'est le sens d'une note partagée, pas un oubli.
        positions:  (src.positions  || []).map(p  => ({ ...p,  id: uid() })),
        cashflows:  (src.cashflows  || []).map(cf => ({ ...cf, id: uid() })),
        strategies: (src.strategies || []).map(st => ({ ...st, id: uid() })),
      });
      s.settings.liveAcct = newId;                                             // sélectionne le doublon
    });
    setMenuOpen(false);
  };
  const saveEdit = (d) => { mutateAcc(a => { a.name = d.name; a.color = d.color; }); setEditing(false); };
  const saveT0 = (v) => { mutateAcc(a => { if (v) a.t0 = v; else delete a.t0; }); setT0Editing(false); };
  const wdNum = parseNum(wd);

  return (
    <div className="account-panel">
      <div className="account-menu" ref={menuRef}>
        <IconButton size="sm" label="Actions du compte" active={menuOpen} onClick={() => setMenuOpen(o => !o)}><IMore /></IconButton>
        {menuOpen && (
          <div className="menu">
            <button className="menu-item" onClick={() => { setEditing(e => !e); setT0Editing(false); setMenuOpen(false); }}>
              <span>Éditer le compte</span><span className="meta"><IEdit /></span>
            </button>
            <button className="menu-item" onClick={() => { setT0Editing(v => !v); setEditing(false); setMenuOpen(false); }}>
              <span>Point de départ (T0)</span><span className="meta">{acc.t0 ? fmtDateShort(acc.t0) : '—'}</span>
            </button>
            <button className="menu-item" onClick={() => { setMenuOpen(false); duplicateAccount(); }}>
              <span>Dupliquer le compte</span><span className="meta"><ICopy /></span>
            </button>
            <button className="menu-item" onClick={() => { setMenuOpen(false); setPineOpen(true); }}>
              <span>Script TradingView (Pine)</span><span className="meta"><ICode /></span>
            </button>
            <div className="menu-sep" />
            <button className="menu-item" onClick={() => { setMenuOpen(false); deleteAccount(); }} style={{ color: 'var(--loss)' }}>
              <span>Supprimer le compte</span><span className="meta" style={{ color: 'var(--loss)' }}><ITrash /></span>
            </button>
          </div>
        )}
      </div>
      <div className="modal-stats">
        <ModalStat label="Valeur"><MoneyValue value={equity} size="lg" /></ModalStat>
        <ModalStat label="Cash dispo"><MoneyValue value={free} size="md" /></ModalStat>
        <ModalStat label="Réalisé" unit={unit} onToggle={toggleUnit}>
          {unit === 'pct' ? pctNode(safePct(realized, st.base))
            : <MoneyValue value={realized} size="md" signed colored="pnl" showCurrency={false} />}
        </ModalStat>
        {/* Win rate : basculable, mais SANS l'indicateur — « Réalisé » le porte pour les deux. */}
        {ws.total > 0 && (
          <ModalStat label="Win rate" onToggle={toggleUnit}>
            <span className="gnum">{unit === 'pct' ? Math.round(safePct(ws.wins, ws.total)) + '%' : ws.wins + '/' + ws.total}</span>
          </ModalStat>
        )}
        {st.t0 && <ModalStat label="Depuis T0"><span className="gnum">{fmtDateShort(st.t0)}</span></ModalStat>}
        {fc.hasOpen && <>
          <div className="divider" />
          {/* VALEURS du compte aux cibles, pas des écarts : ni signe ni couleur — comme Valeur. */}
          <ModalStat label="Valeur si TP" title="Positions sans TP : leur valeur actuelle est conservée telle quelle dans la projection.">
            <MoneyValue value={valTp} size="md" />
          </ModalStat>
          <ModalStat label="Valeur si SL/liq"><MoneyValue value={valSl} size="md" /></ModalStat>
        </>}
      </div>
      {/* Sans aucun TP, computeForecast retombe sur le latent courant : « Valeur si TP »
          vaudrait la valeur actuelle sans le dire. Même phrase que la colonne KPI. */}
      {fc.hasOpen && !fc.anyTp && <span className="kpi-note stat-note">Définis des TP pour la projection</span>}

      {editing && <EditAccountForm acc={acc} usedColors={usedColors} onCancel={() => setEditing(false)} onSave={saveEdit} />}
      {t0Editing && <T0Form acc={acc} minDate={acc.createdAt} onCancel={() => setT0Editing(false)} onSave={saveT0} />}
      {pineOpen && <PineScriptModal acc={acc} price={price} onClose={() => setPineOpen(false)} />}

      <div className="acc-list">
        <Section title="Positions ouvertes" open={openSec.ouvertes} onToggle={() => toggleSec('ouvertes')}
          right={<span className="muted">{open.length}</span>}>
          <div className="stack">
            <CollapsibleHeader title="Ouvrir une position" open={posFormOpen} onToggle={() => setPosFormOpen(o => !o)} />
            {posFormOpen && <OpenPositionForm freeCash={free} btcPrice={price} onSubmit={addPosition} hideTitle />}
          </div>
          {open.length === 0 ? <div className="empty-note">Aucune position ouverte.</div>
            : <div className="pos-list">{open.map(p => <PositionRowView key={p.id} pos={p} price={price} color={acc.color} capitalBasis={equityAtOpen(acc, p)} unit={posUnit} onToggleUnit={togglePosUnit} onClose={(d) => closePosition(p.id, d)} onEdit={(d) => editPosition(p.id, d)} onDelete={() => deletePosition(p.id)} state={state} update={update} onSetSnote={(id) => setPosSnote(p.id, id)} />)}</div>}
        </Section>

        <Section title="Évolution" open={openSec.graphique} onToggle={() => toggleSec('graphique')}>
          <AccountChart acc={acc} color={acc.color} price={price} history={history} priceHistory={priceHistory}
            onPref={(d) => mutateAcc(a => Object.assign(a, d))}
            onBackfill={onBackfill} backfilling={backfilling}
            onSelectTrade={(t) => setChartTrade(c => c && c.pid === t.p.id ? null : { pid: t.p.id, n: t.n })} />
          {chartTrade && (() => {
            const p = (acc.positions || []).find(x => x.id === chartTrade.pid);
            if (!p) return null;   // position supprimée → la ligne disparaît d'elle-même
            return (
              <div className="chart-traderow">
                <div className="chart-traderow-head">
                  <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>{'Trade ' + (p.side === 'long' ? 'L#' : 'S#') + chartTrade.n}</span>
                  <IconButton size="sm" label="Fermer" onClick={() => setChartTrade(null)}><IClose /></IconButton>
                </div>
                <div className="pos-list">
                  {p.status === 'closed'
                    ? <ClosedPositionRow pos={p} acc={acc} onEditNote={(t) => editPosition(p.id, { note: t })} onDelete={() => deletePosition(p.id)} state={state} update={update} onSetSnote={(id) => setPosSnote(p.id, id)} />
                    : <PositionRowView pos={p} price={price} color={acc.color} capitalBasis={equityAtOpen(acc, p)} unit={posUnit} onToggleUnit={togglePosUnit} onClose={(d) => closePosition(p.id, d)} onEdit={(d) => editPosition(p.id, d)} onDelete={() => deletePosition(p.id)} state={state} update={update} onSetSnote={(id) => setPosSnote(p.id, id)} />}
                </div>
              </div>
            );
          })()}
        </Section>

        <Section title="Stratégies" open={openSec.strategies} onToggle={() => toggleSec('strategies')}
          right={<span className="muted">{(acc.strategies || []).length}</span>}>
          <div className="stack">
            <CollapsibleHeader title="Nouvelle stratégie" open={stratFormOpen} onToggle={() => setStratFormOpen(o => !o)} />
            {stratFormOpen && (
              <>
                <textarea className="strat-input" value={strat} rows={3} placeholder="Décris ta stratégie…" onChange={e => setStrat(e.target.value)} />
                <Button variant="primary" disabled={!strat.trim()} onClick={addStrategy}>Ajouter</Button>
              </>
            )}
          </div>
          {(acc.strategies || []).length === 0
            ? <div className="empty-note">Aucune stratégie pour l’instant.</div>
            : <div className="pos-list">{(acc.strategies || []).slice().reverse().map(s => <StrategyRow key={s.id} strat={s} onEdit={(t) => editStrategy(s.id, t)} onDelete={() => deleteStrategy(s.id)} />)}</div>}
        </Section>

        <Section title="Historique" open={openSec.historique} onToggle={() => toggleSec('historique')}
          right={<span className="muted">{closed.length}</span>}>
          {closed.length === 0 ? <div className="empty-note">Aucune position clôturée.</div>
            : <div className="pos-list">{closed.map(p => <ClosedPositionRow key={p.id} pos={p} acc={acc} onEditNote={(t) => editPosition(p.id, { note: t })} onDelete={() => deletePosition(p.id)} state={state} update={update} onSetSnote={(id) => setPosSnote(p.id, id)} />)}</div>}
        </Section>

        <Section title="Trésorerie" open={openSec.tresorerie} onToggle={() => toggleSec('tresorerie')}
          right={<MoneyValue value={free} size="sm" showCurrency={false} />}>
          <div className="grid2">
            <div className="stack">
              <Field label="Déposer (USDC)"><Input numeric value={dep} onChange={e => setDep(e.target.value)} placeholder="0.00" inputMode="decimal" /></Field>
              <Field label="Date"><Input type="date" value={depDate} max={todayStr()} onChange={e => setDepDate(e.target.value)} /></Field>
              <Button variant="primary" disabled={!(parseNum(dep) > 0)} onClick={doDeposit}>Déposer</Button>
            </div>
            <div className="stack">
              <Field label="Retirer (USDC)" error={wdNum != null && wdNum > free + 1e-9 ? 'Supérieur au cash dispo' : null}>
                <Input numeric invalid={wdNum != null && wdNum > free + 1e-9} value={wd} onChange={e => setWd(e.target.value)} placeholder="0.00" inputMode="decimal" />
              </Field>
              <Field label="Date"><Input type="date" value={wdDate} max={todayStr()} onChange={e => setWdDate(e.target.value)} /></Field>
              <Button disabled={!(wdNum > 0 && wdNum <= free + 1e-9)} onClick={doWithdraw}>Retirer</Button>
            </div>
          </div>
          <div className="stack">
            <span className="lbl">Mouvements</span>
            <div className="pos-list">
              <div className="mv-row"><Badge tone="neutral" size="sm">Init</Badge><span className="muted" style={{ flex: 1 }}>Cash à l’ouverture · {fmtDateShort(acc.createdAt)}</span><MoneyValue value={acc.openingCash} size="sm" /></div>
              {(acc.cashflows || []).slice().reverse().map(cf => (
                <div className="mv-row" key={cf.id}>
                  <Badge tone={cf.type === 'deposit' ? 'gain' : 'accent'} size="sm">{cf.type === 'deposit' ? 'Dépôt' : 'Retrait'}</Badge>
                  <span className="muted" style={{ flex: 1 }}>{new Date(cf.at).toLocaleDateString('fr-FR')}</span>
                  <MoneyValue value={cf.type === 'deposit' ? cf.amount : -cf.amount} size="sm" signed colored="pnl" showCurrency={false} />
                  <IconButton size="sm" label="Supprimer" onClick={() => deleteCashflow(cf.id)}><IClose /></IconButton>
                </div>
              ))}
            </div>
          </div>
        </Section>
      </div>
    </div>
  );
}

/* =============================================================
   FORMULAIRE — ÉDITION D'IDENTITÉ DU COMPTE (nom + couleur)
   ============================================================= */
function EditAccountForm({ acc, usedColors, onCancel, onSave, showCapital = false }) {
  const [name, setName] = useState(acc.name);
  const [color, setColor] = useState(dsColor(acc.color));
  const [cap, setCap] = useState(acc.openingCash != null ? String(acc.openingCash) : '');
  const used = (usedColors || []).map(dsColor).filter(c => c !== dsColor(acc.color));
  const capNum = parseNum(cap);
  const capValid = !showCapital || (capNum != null && capNum >= 0);
  const valid = name.trim() && capValid;
  const save = () => {
    const d = { name: name.trim(), color };
    if (showCapital) d.openingCash = capNum;
    onSave(d);
  };
  return (
    <div className="edit-account stack">
      <Field label={showCapital ? 'Nom de la simulation' : 'Nom du compte'}><Input value={name} onChange={e => setName(e.target.value)} autoFocus /></Field>
      <Field label="Couleur">
        <div style={{ display: 'flex', gap: 'var(--space-3)', flexWrap: 'wrap' }}>
          {ID_ORDER.map(k => (
            <button key={k} type="button" onClick={() => setColor(k)} title={k}
              style={{ width: 30, height: 30, borderRadius: '50%', cursor: 'pointer', background: ID_VARS[k], border: color === k ? '2px solid var(--text-primary)' : '2px solid transparent', opacity: used.includes(k) && color !== k ? 0.4 : 1, padding: 0 }} />
          ))}
        </div>
      </Field>
      {showCapital && <Field label="Capital de départ (USDC)"><Input numeric value={cap} onChange={e => setCap(e.target.value)} placeholder="0.00" inputMode="decimal" suffix="USDC" /></Field>}
      <div style={{ display: 'flex', gap: 'var(--space-2)' }}>
        <Button onClick={onCancel}>Annuler</Button>
        <Button variant="primary" disabled={!valid} onClick={save}>Enregistrer</Button>
      </div>
    </div>
  );
}

/* =============================================================
   FORMULAIRE — POINT DE DÉPART T0 DU COMPTE
   ============================================================= */
/* Le T0 re-base les calculs de performance (win rate, gains, capital de référence)
   et pose une barre verticale sur la courbe du compte. Vide = tout l'historique. */
function T0Form({ acc, minDate, onCancel, onSave }) {
  const [date, setDate] = useState(acc.t0 || '');
  const tooEarly = !!(date && minDate && date < minDate);
  const tooLate = !!(date && date > todayStr());
  const err = tooEarly ? 'Antérieure au début du compte' : tooLate ? 'Date future' : null;
  return (
    <div className="edit-account stack">
      <Field label="Date T0" error={err}
        hint={err ? null : 'Origine des calculs : win rate, gains, capital de référence. Vide = tout l’historique.'}>
        <Input type="date" invalid={!!err} value={date} min={minDate || undefined} max={todayStr()}
          onChange={e => setDate(e.target.value)} autoFocus />
      </Field>
      <div style={{ display: 'flex', gap: 'var(--space-2)', flexWrap: 'wrap' }}>
        <Button onClick={onCancel}>Annuler</Button>
        {acc.t0 && <Button onClick={() => onSave(null)}>Effacer le T0</Button>}
        <Button variant="primary" disabled={!!err || !date} onClick={() => onSave(date)}>Enregistrer</Button>
      </div>
    </div>
  );
}

/* =============================================================
   MODALE — SCRIPT PINE (TradingView)
   ============================================================= */
/* `acc` = un portefeuille ; `accounts` = tous (script global, chaque compte gardant son T0). */
function PineScriptModal({ acc, accounts, price, onClose }) {
  useEsc(onClose);
  const multi = !!accounts;
  const [copied, setCopied] = useState(false);
  const taRef = useRef(null);
  const { trades, script } = useMemo(() => {
    const t = multi ? collectAllBtcTrades(accounts, price) : collectBtcTrades(acc, price);
    const scope = multi
      ? { name: 'Tous les portefeuilles', multi: true, anyT0: (accounts || []).some(a => a.t0) }
      : { name: acc.name || 'compte', multi: false, t0: acc.t0 || null };
    return { trades: t, script: t.length ? buildPineScript(scope, t) : null };
  }, [acc, accounts, price, multi]);
  const closed = trades.filter(t => !t.open).length;
  const wallets = [...new Set(trades.map(t => t.acct))];
  const span = trades.length
    ? fmtDateShort(todayStr(new Date(Math.min(...trades.map(t => t.tOpen))))) + ' → ' +
      fmtDateShort(todayStr(new Date(Math.max(...trades.map(t => (t.open ? Date.now() : t.tClose))))))
    : null;
  // navigator.clipboard est indisponible en file:// (contexte non sécurisé) → repli execCommand.
  const copy = () => {
    const txt = script ? script.code : '';
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    const legacy = () => {
      const ta = taRef.current;
      if (!ta) return;
      ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { alert('Copie impossible : sélectionne le texte et fais Cmd+C.'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, legacy);
    else legacy();
  };
  return (
    <Modal open title="Script TradingView (Pine)" width="wide" onClose={onClose}
      footer={<>
        <Button onClick={onClose}>Fermer</Button>
        <Button variant="primary" disabled={!script} onClick={copy}>{copied ? 'Copié !' : 'Copier le script'}</Button>
      </>}>
      <div className="stack">
        {script ? <>
          <div className="derived">
            <div className="d"><span className="k">{multi ? 'Portefeuilles' : 'Compte'}</span><span className="v">{multi ? wallets.join(', ') : acc.name}</span></div>
            <div className="d"><span className="k">Trades BTC</span><span className="v num">{script.count} ({closed} clôturé{closed > 1 ? 's' : ''})</span></div>
            <div className="d"><span className="k">Période</span><span className="v">{span}</span></div>
            <div className="d"><span className="k">T0</span><span className="v">
              {multi ? ((accounts || []).some(a => a.t0) ? 'propre à chaque compte' : 'tout l’historique')
                     : (acc.t0 ? fmtDateShort(acc.t0) : 'tout l’historique')}</span></div>
          </div>
          <span className="muted">Colle ce script dans l’éditeur Pine de TradingView, sur un graphe BTC.</span>
          {script.warnings.map((w, i) => <span key={i} className="muted">⚠ {w}</span>)}
          <textarea ref={taRef} className="pine-code" readOnly rows={18} value={script.code} onFocus={e => e.target.select()} />
        </> : (
          <div className="empty-note">
            Aucun trade BTC à exporter.{(multi ? (accounts || []).some(a => a.t0) : acc.t0) ? ' Le T0 écarte peut-être tout l’historique.' : ''}
            {(multi ? (accounts || []).some(a => a.source === 'hyperliquid') : acc.source === 'hyperliquid')
              ? ' Côté wallet suivi, seuls les trades reconstruits depuis les 200 derniers fills sont disponibles.' : ''}
          </div>
        )}
      </div>
    </Modal>
  );
}

/* =============================================================
   COMPTE HYPERLIQUID — graphe + panneau lecture seule
   ============================================================= */
/* Courbe d'équity du wallet — haute résolution : échantillons bruts du portfolio
   (intraday sur la période récente) + points injectés à l'instant exact des clôtures,
   sur un axe X proportionnel au temps réel (prop xs de ChartCanvas). */
const HL_RANGES = ['7J', ...RANGES];
rangeDays['7J'] = 7;   // plage propre au graphe HL (grain intraday ~2 h)

function HlAccountChart({ acc, onPref, onSelectTrade }) {
  const bodyRef = useRef(null);
  const { w, h } = useSize(bodyRef);
  const [hover, setHover] = useState(null);
  const [hoverX, setHoverX] = useState(null);   // fraction écran du point survolé (suit le zoom)
  // Mêmes préférences portées par le compte que AccountChart — liste HL_RANGES (7J inclus).
  const unit = acc.chartUnit === 'pct' ? 'pct' : 'usdc';
  const range = HL_RANGES.includes(acc.chartRange) ? acc.chartRange : '90J';
  const setUnit = (u) => onPref({ chartUnit: u });
  const setRange = (r) => onPref({ chartRange: r });
  const [reperes, setReperes] = useState(true);
  const [trades, setTrades] = useState(true);
  const hl = acc.hl || {};
  const closes = useMemo(() => groupHlFills(hl.fills).filter(g => /^Close/.test(g.dir) || g.dir === 'Liquidation'), [hl.fills]);
  const episodes = useMemo(() => hlEpisodes(hl.fills), [hl.fills]);
  // Points = échantillons bruts (repli : equityHistory quotidien) + un point synthétique à
  // l'instant exact de chaque clôture (équité continue : valeur = 1er échantillon réel suivant,
  // borné avant la clôture suivante) + un point à chaque ENTRÉE d'épisode (valeur interpolée
  // entre les échantillons voisins — l'équité ne saute pas à l'ouverture).
  const pts = useMemo(() => {
    let samples = hl.samples || [];
    if (!samples.length) samples = Object.keys(hl.equityHistory || {}).sort()
      .map(d => [new Date(d + 'T12:00:00').getTime(), hl.equityHistory[d]]);
    const out = samples.map(s => ({ ts: s[0], v: s[1], close: null, open: null }));
    const evs = closes.map(g => ({ ts: new Date(g.at).getTime(), g })).sort((a, b) => a.ts - b.ts);
    for (let i = 0; i < evs.length; i++) {
      const exact = out.find(p => p.ts === evs[i].ts);        // point déjà injecté par la synchro
      if (exact) { exact.close = evs[i].g; continue; }
      const bound = i + 1 < evs.length ? evs[i + 1].ts : Infinity;
      const after = samples.find(s => s[0] >= evs[i].ts && s[0] < bound);
      if (after) out.push({ ts: evs[i].ts, v: after[1], close: evs[i].g, open: null });
    }
    out.sort((a, b) => a.ts - b.ts);
    for (const ep of episodes) {
      const exact = out.find(p => p.ts === ep.t0);
      if (exact) { exact.open = ep; continue; }
      let prev = null, next = null;
      for (const p of out) { if (p.ts <= ep.t0) prev = p; else { next = p; break; } }
      if (!prev || !next) continue;
      const v = prev.v + (next.v - prev.v) * ((ep.t0 - prev.ts) / Math.max(1, next.ts - prev.ts));
      out.push({ ts: ep.t0, v, close: null, open: ep });
    }
    return out.sort((a, b) => a.ts - b.ts);
  }, [hl.samples, hl.equityHistory, closes, episodes]);
  const view = useMemo(() => {
    if (rangeDays[range] === Infinity) return pts;
    const cut = Date.now() - rangeDays[range] * 86400000;
    return pts.filter(p => p.ts >= cut);
  }, [pts, range]);
  const span = view.length > 1 ? view[view.length - 1].ts - view[0].ts : 1;
  const xsArr = useMemo(() => view.map(p => (p.ts - (view.length ? view[0].ts : 0)) / span), [view, span]);
  const withTime = rangeDays[range] <= 7;
  const labels = useMemo(() => view.map(p => {
    const d = new Date(p.ts);
    return fmtDateShort(todayStr(d)) + (withTime ? ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '');
  }), [view, withTime]);
  // En % : même convention que le graphe global (gainsPct) — dépôts nets du jour de chaque
  // point via hlAccAt (cache par date : jusqu'à ~4 000 échantillons). Repères et marqueurs
  // convertis ici aussi, puis ChartCanvas en pctDirect.
  const pct = unit === 'pct';
  const ndOf = useMemo(() => {
    const cache = {};
    return (ts) => {
      const d = todayStr(new Date(ts));
      if (!(d in cache)) { const r = hlAccAt(acc, d); cache[d] = r.exists ? r.netDeposits : null; }
      return cache[d];
    };
  }, [acc]);
  const inUnit = (v, ts) => (pct ? gainsPct(v, ndOf(ts)) : v);
  const series = useMemo(() => [{
    key: 'eq', name: 'Valeur', stroke: idVar(acc.color), chipColor: idVar(acc.color), dash: false,
    data: view.map(p => inUnit(p.v, p.ts)),
  }], [view, acc.color, pct, ndOf]);
  const hasData = view.length >= 2;
  // Repères TP / SL agrégés : équity du compte si toutes les cibles sont touchées (comme AccountChart).
  const st = useMemo(() => hlAccAt(acc, todayStr()), [acc]);
  const fc = useMemo(() => computeForecast([acc], null), [acc]);
  const hlines = useMemo(() => {
    if (!reperes || !fc.hasOpen) return [];
    const base = st.equity - st.latent;
    const now = Date.now();
    // Idem AccountChart : pas de ligne TP si aucune position n'a de TP (elle vaudrait le latent).
    return [
      ...(fc.anyTp ? [{ value: inUnit(base + fc.upPnl, now), label: 'TP', color: 'var(--gain)' }] : []),
      { value: inUnit(base + fc.downPnl, now), label: 'SL', color: 'var(--loss)' },
    ];
  }, [reperes, fc, st, pct, ndOf]);
  // Badges TP/SL/Rekt sur les points de clôture (au-dessus) + entrées d'épisodes (en dessous),
  // numérotés « L#n / S#n » pour apparier entrée et sortie ; cliquables → la sélection
  // remonte au panneau (onSelectTrade), qui affiche la ligne du trade sous le graphe.
  const markers = useMemo(() => {
    const out = [];
    const epOf = (g) => {
      const ts = new Date(g.at).getTime();
      return episodes.find(ep => ep.coin === g.coin && ts >= ep.t0 && (ep.t1 == null || ts <= ep.t1)) || null;
    };
    view.forEach((p, i) => {
      if (reperes && p.close) {
        const ep = epOf(p.close);
        const num = ep ? (ep.side === 'long' ? 'L#' : 'S#') + ep.n + ' ' : '';
        const net = p.close.closedPnl - p.close.fee;
        const tag = p.close.kind === 'tp' ? 'TP ' : p.close.kind === 'sl' ? 'SL ' : p.close.kind === 'liq' ? 'Rekt ' : '';
        out.push({ index: i, value: inUnit(p.v, p.ts), label: num + tag + (net >= 0 ? '+' : MINUS) + numFmt(Math.abs(net), 0),
                   tone: p.close.kind === 'liq' ? 'loss' : (net >= 0 ? 'gain' : 'loss'),
                   trade: ep ? { ep } : null });
      }
      if (trades && p.open) {
        // Couleur du badge d'entrée = RÉSULTAT du trade (comme le filigrane), pas le sens —
        // le sens est déjà dans le label L#/S#. Trade en cours → accent.
        const epTone = p.open.t1 == null ? 'accent' : (p.open.net >= 0 ? 'gain' : 'loss');
        out.push({ index: i, value: inUnit(p.v, p.ts), label: (p.open.side === 'long' ? 'L#' : 'S#') + p.open.n + ' ' + p.open.coin,
                   tone: epTone, below: true, trade: { ep: p.open } });
      }
    });
    return out;
  }, [reperes, trades, view, episodes, pct, ndOf]);
  // Filigranes : bande translucide sur la durée de chaque épisode (résultat : vert/rouge ; ouvert : accent).
  const spans = useMemo(() => {
    if (!trades || view.length < 2) return [];
    const t0v = view[0].ts, spanT = Math.max(1, view[view.length - 1].ts - t0v);
    const frac = (t) => (t - t0v) / spanT;
    return episodes.map(ep => ({
      f0: Math.max(0, frac(ep.t0)),
      f1: Math.min(1, frac(ep.t1 != null ? ep.t1 : view[view.length - 1].ts)),
      tone: ep.t1 == null ? 'accent' : (ep.net >= 0 ? 'gain' : 'loss'),
    })).filter(sp => sp.f1 > 0 && sp.f0 < 1 && sp.f1 > sp.f0);
  }, [trades, episodes, view]);
  // Barre verticale du T0 (axe temporel) — rien si la date sort de la plage affichée.
  const vlines = useMemo(() => {
    if (!acc.t0 || view.length < 2) return [];
    const t0v = view[0].ts, spanT = Math.max(1, view[view.length - 1].ts - t0v);
    const f = (new Date(acc.t0 + 'T00:00:00').getTime() - t0v) / spanT;
    return (f < 0 || f > 1) ? [] : [{ f, label: 'T0', color: 'var(--text-muted)' }];
  }, [acc.t0, view]);
  return (
    <div className="stack">
      <div className="panel-head">
        <div className="panel-controls">
          <SegmentedControl size="sm" options={['USDC', '%']} value={unit === 'pct' ? '%' : 'USDC'} onChange={(v) => setUnit(v === '%' ? 'pct' : 'usdc')} />
          <SegmentedControl size="sm" options={HL_RANGES} value={range} onChange={setRange} />
        </div>
      </div>
      <div className="chart-body" ref={bodyRef}>
        <ChartCanvas key={unit + range} series={series} labels={labels} unit={unit} w={w} h={h} hover={hover} setHover={setHover}
          hlines={hlines} markers={markers} xs={xsArr} zoomable setHoverX={setHoverX} spans={spans} vlines={vlines}
          onMarkerClick={(mk) => mk.trade && onSelectTrade && onSelectTrade(mk.trade)} pctDirect={pct} />
        {!hasData && (
          <div className="chart-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style={{ opacity: 0.5 }}><path d="M3 3v18h18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><path d="M7 14l3-3 3 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" /></svg>
            <span style={{ fontSize: 'var(--text-sm)', maxWidth: 360 }}>L’historique d’équity se remplit à la première synchronisation complète.</span>
          </div>
        )}
        {hasData && hover != null && (
          <div className="chart-tip" style={{ left: Math.min(Math.max(0, (hoverX || 0) * 100), 70) + '%', top: 8 }}>
            <div className="d">{labels[hover]}</div>
            {series.map(se => {
              const val = se.data[hover];             // série déjà dans l'unité affichée
              if (val == null) return null;
              return <div className="r" key={se.key}><span className="k"><span style={{ width: 8, height: 8, borderRadius: '50%', background: se.chipColor, display: 'inline-block' }} />{se.name}</span><span className="v">{pct ? (val >= 0 ? '+' : MINUS) + Math.abs(val).toFixed(2) + '%' : numFmtSigned(val, 0)}</span></div>;
            })}
          </div>
        )}
      </div>
      <div className="chips">
        <SeriesChip label="Repères" color="var(--text-muted)" active={reperes} onChange={() => setReperes(r => !r)} />
        <SeriesChip label="Trades" color="var(--text-muted)" active={trades} onChange={() => setTrades(t => !t)} />
      </div>
    </div>
  );
}

const HL_LEDGER_LABEL = {
  deposit: 'Dépôt', withdraw: 'Retrait', vaultDeposit: 'Vault +', vaultWithdraw: 'Vault −',
  internalTransfer: 'Transfert', subAccountTransfer: 'Sous-compte', accountClassTransfer: 'Spot ⇄ Perp',
  liquidation: 'Liquidation',
};

/* Ligne de position ouverte HL — calquée sur PositionRowView, mais SANS édition ni
   clôture : un wallet suivi reste en lecture seule. La note ne vit pas dans la
   position (remplacée en bloc à chaque synchro) mais dans l'enregistrement journal du
   trade, seul porteur d'une identité stable. Tant qu'il n'existe pas — position tout
   juste ouverte, dont les fills ne sont pas encore remontés — le bouton est inerte. */
function HlPositionRowView({ pos, alloc, color, note, canNote, journalPending, onSaveNote, unit, onToggleUnit, onOpenJournal, state, update, snoteId, onSetSnote }) {
  const [mode, setMode] = useState(null);
  const sn = snGet(state, snoteId);
  // Mêmes conventions que computeForecast côté HL : P&L à un prix = taille × écart.
  const dir = pos.side === 'long' ? 1 : -1;
  const pnlAt = (px) => pos.size * (px - pos.entryPrice) * dir;
  const slPnl = pos.sl != null ? pnlAt(pos.sl) : (pos.liqPrice != null ? pnlAt(pos.liqPrice) : -pos.margin);
  return (
    <div>
      <OpenPosRow side={pos.side} leverage={pos.leverage} alloc={alloc} color={color}
        line1={`${numFmt(pos.margin)} USDC @ ${hlPx(pos.entryPrice)}`}
        line2={`${numFmt(pos.size, 4)} ${pos.coin} · TP ${pos.tp != null ? hlPx(pos.tp) : '—'} · SL ${pos.sl != null ? hlPx(pos.sl) : (pos.liqPrice != null ? hlPx(pos.liqPrice) + ' (liq)' : '—')}`}
        now={pos.margin + pos.latent} latent={pos.latent} latentPct={safePct(pos.latent, pos.margin)}
        tpVal={pos.tp != null ? pos.margin + pnlAt(pos.tp) : null}
        slVal={pos.margin + slPnl} slIsLiq={pos.sl == null && pos.liqPrice != null}
        unit={unit} onToggleUnit={onToggleUnit}
        actions={<>
          <IconButton size="sm" label="Note" active={!!note} disabled={!canNote}
            title={canNote ? undefined : 'Note disponible après la prochaine synchronisation'}
            onClick={() => setMode(m => m === 'note' ? null : 'note')}><INote /></IconButton>
          <SnoteControl state={state} update={update} snoteId={snoteId || null} localNote={note || null}
            onAttach={onSetSnote} onClearLocal={() => onSaveNote('')}
            onNew={() => setMode('snote-new')} onEditText={() => setMode('snote-edit')}
            disabled={!canNote} disabledTitle="Note partagée disponible après la prochaine synchronisation" />
          {/* Journal du trade en cours — même logique que les pastilles du fil :
              reste-à-saisir → carte de saisie, sinon → fiche de relecture. */}
          <IconButton size="sm" label="Journal" disabled={!canNote} active={canNote && !journalPending}
            title={!canNote ? 'Journal disponible après la prochaine synchronisation'
              : (journalPending ? 'Journaliser ce trade' : 'Fiche journal du trade')}
            onClick={onOpenJournal}><IBook /></IconButton>
        </>} />
      {mode !== 'snote-edit' && sn && <PosNote text={sn.text} shared colors={snColors(state, sn.id)} />}
      {mode !== 'note' && note && <PosNote text={note} />}
      {mode === 'note' && <NoteEditor value={note} onSave={(t) => { onSaveNote(t); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-new' && <NoteEditor requireText value="" onSave={(t) => { if (t) onSetSnote(snCreate(update, t)); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-edit' && sn && <NoteEditor requireText value={sn.text} onSave={(t) => { snSetText(update, sn.id, t); setMode(null); }} onCancel={() => setMode(null)} />}
    </div>
  );
}

const HL_EXIT_BADGE = { tp: ['TP', 'gain'], sl: ['SL', 'loss'], liq: ['Rekt', 'accent'] };
const EFF_LEV_TITLE = 'Levier effectif : notionnel d’entrée / capital à l’entrée (= exposition × levier) — '
  + 'l’API Hyperliquid ne conserve pas la marge ni le levier d’une position fermée';
const ALLOC_TITLE = 'Exposition au moment du trade : marge captée pendant que la position vivait, '
  + 'rapportée au capital interpolé sur la courbe d’équity — approximatif';

/* Ligne d'un trade HL CLÔTURÉ — pendant de ClosedPositionRow côté manuel, même gabarit
   PosRow et mêmes emplacements de badges. Elle ne lit QUE l'enregistrement du journal,
   jamais un épisode recalculé : c'est ce qui la rend valable indéfiniment, même quand
   les fills d'origine sont sortis de la fenêtre des 200.
   L'anneau d'exposition n'apparaît que pour un trade observé vivant — sans `cap.atOpen`
   il n'y a pas de marge, et bâtir un pourcentage sur la seule interpolation donnerait
   une fausse précision (cf. JournalFacts). Le levier effectif prend alors le relais. */
function HlClosedTradeRow({ rec, num, color, note, journalPending, onSaveNote, onOpen, onOpenJournal, state, update, onSetSnote }) {
  const [mode, setMode] = useState(null);
  const sn = snGet(state, rec.snoteId);
  const cap = rec.cap || {}, ref = cap.atOpen, x = cap.exit || {};
  const net = x.net != null ? x.net : null;
  const alloc = (rec.observedOpen && ref && ref.margin != null && cap.equityAtOpen > 0)
    ? clampPct(safePct(ref.margin, cap.equityAtOpen)) : null;
  const effLev = (alloc == null && cap.equityAtOpen > 0 && cap.sizeOpened > 0)
    ? Math.round((cap.sizeOpened * cap.avgEntry / cap.equityAtOpen) * 10) / 10 : null;
  const lev = (ref && ref.lev != null) ? ref.lev : effLev;
  const badge = HL_EXIT_BADGE[x.mode] || null;
  const tag = (rec.side === 'long' ? 'L#' : 'S#') + num;
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  return (
    <div>
      <div onClick={onOpen} style={{ cursor: 'pointer' }}>
        <PosRow side={rec.side} leverage={lev} alloc={alloc} allocColor={color}
          levTitle={ref && ref.lev != null ? undefined : EFF_LEV_TITLE} allocTitle={ALLOC_TITLE}
          line1={`${ref && ref.margin != null ? numFmt(ref.margin) + ' USDC' : numFmt(cap.sizeOpened, 4) + ' ' + rec.coin}`
            + ` · ${hlPx(cap.avgEntry)} → ${x.avgExit != null ? hlPx(x.avgExit) : '—'}`}
          line2={<>
            {/* Segments insécables (.seg), comme lineSegs : coupure entre segments seulement. */}
            {num != null && <><span className="num seg" title="Numéro du trade sur le graphe du portefeuille">{tag}</span>{' · '}</>}
            <span className="seg">{new Date(rec.t1).toLocaleDateString('fr-FR')}</span>{' · '}
            <span className="seg">{rec.coin}</span>{' · '}<span className="seg">{fmtDur(rec.t0, rec.t1)}</span>
            {x.fees != null && <>{' · '}<span className="seg">{'frais ' + numFmt(x.fees)}</span></>}
          </>}
          center={badge ? <Badge tone={badge[1]} size="sm">{badge[0]}</Badge> : null}
          right={<>
            {/* Montant TOUJOURS affiché, pourcentage seulement quand la marge d'alors est
                connue : le manuel peut se contenter du % parce qu'il a toujours sa marge,
                ici une ligne sur deux en manquerait et la colonne ne dirait plus la même
                chose d'une ligne à l'autre. */}
            {net != null
              ? <PnLIndicator value={net} amount={net} percent={ref && ref.margin ? safePct(net, ref.margin) : undefined} size="sm" />
              : <Badge tone="neutral" size="sm">Clôturé</Badge>}
            <IconButton size="sm" label="Note" active={!!note} onClick={stop(() => setMode(m => m === 'note' ? null : 'note'))}><INote /></IconButton>
            <SnoteControl state={state} update={update} snoteId={rec.snoteId || null} localNote={note || null}
              onAttach={onSetSnote} onClearLocal={() => onSaveNote('')}
              onNew={() => setMode('snote-new')} onEditText={() => setMode('snote-edit')} />
            {/* Même logique que l'icône des positions ouvertes : reste-à-saisir → carte
                (y compris l'ouverture volontaire d'un trade antérieur au suivi), sinon fiche. */}
            <IconButton size="sm" label="Journal" active={!journalPending}
              title={journalPending ? 'Journaliser ce trade' : 'Fiche journal du trade'}
              onClick={stop(onOpenJournal)}><IBook /></IconButton>
          </>} />
      </div>
      {mode !== 'snote-edit' && sn && <PosNote text={sn.text} shared colors={snColors(state, sn.id)} />}
      {mode !== 'note' && note && <PosNote text={note} />}
      {(mode === 'note' || mode === 'snote-new' || mode === 'snote-edit') && <div onClick={(e) => e.stopPropagation()}>
        {mode === 'note' && <NoteEditor value={note} onSave={(t) => { onSaveNote(t); setMode(null); }} onCancel={() => setMode(null)} />}
        {mode === 'snote-new' && <NoteEditor requireText value="" onSave={(t) => { if (t) onSetSnote(snCreate(update, t)); setMode(null); }} onCancel={() => setMode(null)} />}
        {mode === 'snote-edit' && sn && <NoteEditor requireText value={sn.text} onSave={(t) => { snSetText(update, sn.id, t); setMode(null); }} onCancel={() => setMode(null)} />}
      </div>}
    </div>
  );
}

/* Panneau d'un wallet Hyperliquid suivi — lecture seule (sauf Stratégies, notes locales). */
function HlAccountPanel({ acc, state, update, usedColors, onSync }) {
  const [openSec, setOpenSec] = useState({ positions: true, graphique: true, strategies: false, historique: false, tresorerie: false });
  const [t0Editing, setT0Editing] = useState(false);
  const [pineOpen, setPineOpen] = useState(false);
  const [detail, setDetail] = useState(null);      // clé du trade dont on lit la fiche
  const [deck, setDeck] = useState(null);          // paquet de cartes de saisie (icône journal)
  // Même logique que les pastilles du fil : reste-à-saisir → carte de saisie
  // (paquet = la file complète, démarré sur ce trade), sinon → fiche de relecture.
  const openJournal = (rec) => {
    if (!jCardType(rec)) return setDetail(rec.key);
    const file = jFile(state);
    const cards = file.some(r => r.key === rec.key) ? file : [rec].concat(file);
    setDeck({ cards, start: Math.max(0, cards.findIndex(r => r.key === rec.key)) });
  };
  const [unit, setUnit] = useState('usdc');        // bascule du bandeau (Réalisé + Win rate)
  const toggleUnit = () => setUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // Bascule du bloc Latent des lignes de position — même règle que côté manuel.
  const [posUnit, setPosUnit] = useState('usdc');
  const togglePosUnit = () => setPosUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // Trade sélectionné depuis un repère du graphe — clé stable {coin, t0}, re-résolue
  // à chaque rendu via jKey (jamais de copie figée d'épisode).
  const [chartTrade, setChartTrade] = useState(null);
  const toggleSec = (k) => setOpenSec(s => ({ ...s, [k]: !s[k] }));
  const [editing, setEditing] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [strat, setStrat] = useState('');
  const [stratFormOpen, setStratFormOpen] = useState(false);
  const menuRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const hl = acc.hl || {};
  const positions = (hl.snapshot || {}).positions || [];
  const fills = hl.fills || [];
  // Historique = enregistrements du journal, JAMAIS les épisodes recalculés : eux seuls
  // survivent à la sortie des fills d'origine de la fenêtre des 200, et eux seuls portent
  // la marge / le levier / les TP-SL captés pendant que la position vivait.
  const closedTrades = useMemo(() => jRecs(state)
    .filter(r => r.walletId === acc.id && r.t1 != null && !r.orphan)
    .sort((a, b) => b.t1 - a.t1), [state, acc.id]);
  // Numéro de trade recalculé depuis les MÊMES épisodes que les badges du graphe, et
  // jamais stocké (cf. JournalTradeModal) : ce rang glisse avec la fenêtre, le figer
  // finirait par contredire le graphe. Hors horizon, pas de numéro — comme sur le graphe.
  const eps = useMemo(() => hlEpisodes(fills), [fills]);
  const numOf = useMemo(() => {
    const m = {};
    for (const e of eps) m[e.coin + '|' + e.t0] = e.n;
    return m;
  }, [eps]);
  const ws = useMemo(() => accWinStats(acc, state), [state, acc.t0]);
  // Vraie borne basse de l'historique : ce qui était déjà hors de la fenêtre des 200 le
  // jour de l'ajout n'a jamais été détecté et n'existe nulle part.
  const seen = jSeen(state, acc.id);
  const suiviDepuis = seen && seen.addedAt ? new Date(seen.addedAt).toLocaleDateString('fr-FR') : null;
  const ledger = hl.ledger || [];
  const strategies = acc.strategies || [];
  const st = accNow(acc, null, null);                   // flux re-basés sur acc.t0 s'il existe
  const latentAbs = st.latent + st.t0Latent;            // latent RÉEL (avant re-base) — exposition, projections
  const fc = computeForecast([acc], null);
  // VALEUR que prendrait le wallet si toutes les cibles étaient touchées : équity purgée
  // du latent courant, plus le P&L aux cibles. Même grandeur que les repères TP/SL du
  // graphe — pas un écart à la base.
  const valTp = st.equity - latentAbs + fc.upPnl, valSl = st.equity - latentAbs + fc.downPnl;
  // Exposition « au moment du trade » : marge engagée / capital TOTAL du wallet (perp +
  // USDC spot) hors latent, corrigé du funding accumulé depuis l'ouverture (sinceOpen
  // signé : négatif = reçu). En marge ISOLÉE, le compte perp ne contient que la marge des
  // positions — s'y limiter afficherait ~100 % pour tout le monde. Même base que l'anneau
  // des trades clôturés (cap.equityAtOpen) et que le manuel (equityAtOpen).
  const allocOf = (p) => clampPct(safePct(p.margin, Math.max(0, (hl.snapshot ? hl.snapshot.equity : 0) - latentAbs + (p.fundingSinceOpen || 0))));

  const mutateAcc = (fn) => update(s => { const a = s.accounts.find(x => x.id === acc.id); if (a) fn(a); });
  const addStrategy = () => { const t = strat.trim(); if (t) { mutateAcc(a => { (a.strategies || (a.strategies = [])).push({ id: uid(), text: t, at: todayStr() + 'T12:00:00' }); }); setStrat(''); } };
  const editStrategy = (sid, text) => mutateAcc(a => { const s = (a.strategies || []).find(x => x.id === sid); if (s) s.text = text; });
  const deleteStrategy = (sid) => { if (confirm('Supprimer cette stratégie ?')) mutateAcc(a => { a.strategies = (a.strategies || []).filter(x => x.id !== sid); }); };
  const deleteAccount = () => { if (confirm('Ne plus suivre le wallet « ' + acc.name + ' » ? (les données Hyperliquid restent sur la chaîne)')) update(s => {
    s.accounts = s.accounts.filter(x => x.id !== acc.id); s.settings.liveAcct = s.accounts[0] ? s.accounts[0].id : null;
    // Seul point de sortie d'un wallet : ses enregistrements de journal deviennent
    // ORPHELINS — marqués ici, ils sortent des compteurs/file/grille (filtres !r.orphan)
    // et deviennent purgeables via « Purger les orphelins » des réglages du journal.
    const J = jEnsure(s);
    for (const k of Object.keys(J.trades)) if (J.trades[k].walletId === acc.id) J.trades[k].orphan = true;
  }); };
  const saveEdit = (d) => { mutateAcc(a => { a.name = d.name; a.color = d.color; }); setEditing(false); };
  const saveT0 = (v) => { mutateAcc(a => { if (v) a.t0 = v; else delete a.t0; }); setT0Editing(false); };
  // Borne basse = plus ancienne date d'historique connue du wallet (rien avant n'est calculable).
  const hlStart = useMemo(() => {
    const ks = Object.keys(hl.equityHistory || {});
    return ks.length ? ks.sort()[0] : null;
  }, [hl.equityHistory]);
  const doSync = async () => { setSyncing(true); try { await onSync(); } finally { setSyncing(false); } };

  return (
    <div className="account-panel">
      <div className="account-menu" ref={menuRef}>
        <IconButton size="sm" label="Actions du wallet" active={menuOpen} onClick={() => setMenuOpen(o => !o)}><IMore /></IconButton>
        {menuOpen && (
          <div className="menu">
            <button className="menu-item" onClick={() => { setMenuOpen(false); doSync(); }}>
              <span>Resynchroniser</span><span className="meta"><IRefresh /></span>
            </button>
            <button className="menu-item" onClick={() => { setEditing(e => !e); setT0Editing(false); setMenuOpen(false); }}>
              <span>Éditer le compte</span><span className="meta"><IEdit /></span>
            </button>
            <button className="menu-item" onClick={() => { setT0Editing(v => !v); setEditing(false); setMenuOpen(false); }}>
              <span>Point de départ (T0)</span><span className="meta">{acc.t0 ? fmtDateShort(acc.t0) : '—'}</span>
            </button>
            <button className="menu-item" onClick={() => { setMenuOpen(false); setPineOpen(true); }}>
              <span>Script TradingView (Pine)</span><span className="meta"><ICode /></span>
            </button>
            <div className="menu-sep" />
            <button className="menu-item" onClick={() => { setMenuOpen(false); deleteAccount(); }} style={{ color: 'var(--loss)' }}>
              <span>Ne plus suivre</span><span className="meta" style={{ color: 'var(--loss)' }}><ITrash /></span>
            </button>
          </div>
        )}
      </div>
      <div className="modal-stats">
        <ModalStat label="Valeur"><MoneyValue value={st.equity} size="lg" /></ModalStat>
        <ModalStat label="Cash dispo"><MoneyValue value={st.cash} size="md" /></ModalStat>
        <ModalStat label="Réalisé" unit={unit} onToggle={toggleUnit}>
          {unit === 'pct' ? pctNode(safePct(st.realized, st.base))
            : <MoneyValue value={st.realized} size="md" signed colored="pnl" showCurrency={false} />}
        </ModalStat>
        {/* Win rate : basculable, mais SANS l'indicateur — « Réalisé » le porte pour les deux. */}
        {ws.total > 0 && (
          <ModalStat label="Win rate" onToggle={toggleUnit}>
            <span className="gnum">{unit === 'pct' ? Math.round(safePct(ws.wins, ws.total)) + '%' : ws.wins + '/' + ws.total}</span>
          </ModalStat>
        )}
        {st.t0 && <ModalStat label="Depuis T0"><span className="gnum">{fmtDateShort(st.t0)}</span></ModalStat>}
        {fc.hasOpen && <>
          <div className="divider" />
          {/* VALEURS du wallet aux cibles, pas des écarts : ni signe ni couleur — comme Valeur. */}
          <ModalStat label="Valeur si TP" title="Positions sans TP : leur valeur actuelle est conservée telle quelle dans la projection.">
            <MoneyValue value={valTp} size="md" />
          </ModalStat>
          <ModalStat label="Valeur si SL/liq"><MoneyValue value={valSl} size="md" /></ModalStat>
        </>}
      </div>
      {/* Sans aucun TP, computeForecast retombe sur le latent courant : « Valeur si TP »
          vaudrait la valeur actuelle sans le dire. Même phrase que la colonne KPI. */}
      {fc.hasOpen && !fc.anyTp && <span className="kpi-note stat-note">Définis des TP pour la projection</span>}
      <div className="hl-meta">
        <span className="hl-addr num" title={acc.address}>{hlShortAddr(acc.address)}</span>
        <span className="muted">{syncing ? 'Synchronisation…' : ('Synchro : ' + (hl.lastSync ? relTime(hl.lastSync) : '—'))}</span>
        {hl.error && <span className="hl-error">⚠ {hl.error}</span>}
        {hl.snapshot && hl.snapshot.spotUsdc > 0 && <span className="muted">dont spot : {numFmt(hl.snapshot.spotUsdc)} USDC</span>}
        {hl.spotNote && <span className="muted">Spot non compté : {hl.spotNote}</span>}
      </div>

      {editing && <EditAccountForm acc={acc} usedColors={usedColors} onCancel={() => setEditing(false)} onSave={saveEdit} />}
      {t0Editing && <T0Form acc={acc} minDate={hlStart} onCancel={() => setT0Editing(false)} onSave={saveT0} />}
      {pineOpen && <PineScriptModal acc={acc} price={null} onClose={() => setPineOpen(false)} />}

      <div className="acc-list">
        <Section title="Positions ouvertes" open={openSec.positions} onToggle={() => toggleSec('positions')}
          right={<span className="muted">{positions.length}</span>}>
          {positions.length === 0 ? <div className="empty-note">Aucune position ouverte sur ce wallet.</div>
            : <div className="pos-list">{positions.map((p) => {
                // Clé React = le coin seul : HL n'autorise qu'une position perp par actif,
                // l'index glisserait à chaque ouverture/clôture et ferait sauter l'éditeur.
                const rec = jOpenRec(state, acc.id, p.coin);
                return (
                <HlPositionRowView key={p.coin} pos={p} alloc={allocOf(p)} color={acc.color}
                  note={rec && rec.note} canNote={!!rec} journalPending={!!(rec && jCardType(rec))}
                  unit={posUnit} onToggleUnit={togglePosUnit}
                  state={state} update={update} snoteId={rec ? (rec.snoteId || null) : null}
                  onSetSnote={(id) => { if (rec) jSetSnote(update, rec.key, id); }}
                  onOpenJournal={() => { if (rec) openJournal(rec); }}
                  onSaveNote={(t) => { if (rec) jSetNote(update, rec.key, t); }} />
                );
              })}</div>}
        </Section>

        <Section title="Évolution" open={openSec.graphique} onToggle={() => toggleSec('graphique')}>
          <HlAccountChart acc={acc} onPref={(d) => mutateAcc(a => Object.assign(a, d))}
            onSelectTrade={(t) => setChartTrade(c => c && c.coin === t.ep.coin && c.t0 === t.ep.t0 ? null : { coin: t.ep.coin, t0: t.ep.t0 })} />
          {chartTrade && (() => {
            const rec = jRec(state, jKey(acc.id, chartTrade.coin, chartTrade.t0));
            const head = (label) => (
              <div className="chart-traderow-head">
                <span className="muted" style={{ fontSize: 'var(--text-2xs)' }}>{label}</span>
                <IconButton size="sm" label="Fermer" onClick={() => setChartTrade(null)}><IClose /></IconButton>
              </div>
            );
            if (rec && rec.t1 != null) {
              const num = numOf[rec.coin + '|' + rec.t0];
              return (
                <div className="chart-traderow">
                  {head('Trade ' + (rec.side === 'long' ? 'L#' : 'S#') + (num != null ? num : '—') + ' · ' + rec.coin)}
                  <div className="pos-list">
                    <HlClosedTradeRow rec={rec} num={num} color={acc.color}
                      note={rec.note} journalPending={!!jCardType(rec)} onSaveNote={(t) => jSetNote(update, rec.key, t)}
                      state={state} update={update} onSetSnote={(id) => jSetSnote(update, rec.key, id)}
                      onOpen={() => setDetail(rec.key)} onOpenJournal={() => openJournal(rec)} />
                  </div>
                </div>
              );
            }
            const p = positions.find(x => x.coin === chartTrade.coin);
            if (p) {
              const r2 = jOpenRec(state, acc.id, p.coin);
              return (
                <div className="chart-traderow">
                  {head('Trade en cours · ' + p.coin)}
                  <div className="pos-list">
                    <HlPositionRowView pos={p} alloc={allocOf(p)} color={acc.color}
                      note={r2 && r2.note} canNote={!!r2} journalPending={!!(r2 && jCardType(r2))}
                      unit={posUnit} onToggleUnit={togglePosUnit}
                      state={state} update={update} snoteId={r2 ? (r2.snoteId || null) : null}
                      onSetSnote={(id) => { if (r2) jSetSnote(update, r2.key, id); }}
                      onOpenJournal={() => { if (r2) openJournal(r2); }}
                      onSaveNote={(t) => { if (r2) jSetNote(update, r2.key, t); }} />
                  </div>
                </div>
              );
            }
            return (
              <div className="chart-traderow">
                {head(chartTrade.coin)}
                <div className="empty-note">Trade hors de l’horizon du journal — pas de ligne d’historique.</div>
              </div>
            );
          })()}
        </Section>

        <Section title="Stratégies" open={openSec.strategies} onToggle={() => toggleSec('strategies')}
          right={<span className="muted">{strategies.length}</span>}>
          <div className="stack">
            <CollapsibleHeader title="Nouvelle stratégie" open={stratFormOpen} onToggle={() => setStratFormOpen(o => !o)} />
            {stratFormOpen && (
              <>
                <textarea className="strat-input" value={strat} rows={3} placeholder="Décris ta stratégie…" onChange={e => setStrat(e.target.value)} />
                <Button variant="primary" disabled={!strat.trim()} onClick={addStrategy}>Ajouter</Button>
              </>
            )}
          </div>
          {strategies.length === 0
            ? <div className="empty-note">Aucune stratégie pour l’instant.</div>
            : <div className="pos-list">{strategies.slice().reverse().map(s => <StrategyRow key={s.id} strat={s} onEdit={(t) => editStrategy(s.id, t)} onDelete={() => deleteStrategy(s.id)} />)}</div>}
        </Section>

        <Section title="Historique" open={openSec.historique} onToggle={() => toggleSec('historique')}
          right={<span className="muted">{closedTrades.length}</span>}>
          {closedTrades.length === 0 ? <div className="empty-note">Aucun trade clôturé sur ce wallet.</div>
            : <div className="pos-list">{closedTrades.map(r => (
                <HlClosedTradeRow key={r.key} rec={r} num={numOf[r.coin + '|' + r.t0]} color={acc.color}
                  note={r.note} journalPending={!!jCardType(r)} onSaveNote={(t) => jSetNote(update, r.key, t)}
                  state={state} update={update} onSetSnote={(id) => jSetSnote(update, r.key, id)}
                  onOpen={() => setDetail(r.key)} onOpenJournal={() => openJournal(r)} />
              ))}</div>}
          {suiviDepuis && <span className="muted">Reconstitué depuis l’ajout du wallet le {suiviDepuis} — l’API Hyperliquid ne permet pas de remonter plus loin.</span>}
        </Section>

        <Section title="Trésorerie" open={openSec.tresorerie} onToggle={() => toggleSec('tresorerie')}
          right={<MoneyValue value={st.cash} size="sm" showCurrency={false} />}>
          {ledger.length === 0 ? <div className="empty-note">Aucun mouvement détecté.</div>
            : <div className="pos-list">{ledger.map((l, i) => (
                <div className="mv-row" key={i}>
                  <Badge tone={l.amount >= 0 ? 'gain' : 'accent'} size="sm">{HL_LEDGER_LABEL[l.type] || l.type}</Badge>
                  <span className="muted" style={{ flex: 1 }}>{new Date(l.at).toLocaleDateString('fr-FR')}</span>
                  <MoneyValue value={l.amount} size="sm" signed colored="pnl" showCurrency={false} />
                </div>
              ))}</div>}
        </Section>
      </div>
      {deck && <JournalCardModal state={state} update={update} deck={deck.cards}
        startIndex={deck.start} accounts={state.accounts} onClose={() => setDeck(null)} />}
      {detail && jRec(state, detail) && <JournalTradeModal state={state} update={update} rec={jRec(state, detail)}
        accounts={state.accounts} onClose={() => setDetail(null)} />}
    </div>
  );
}

/* =============================================================
   SIMULATION
   ============================================================= */
function PickBtn({ label, value, active, onClick, disabled }) {
  return (
    <button type="button" disabled={disabled} onClick={onClick} title={'Issue : ' + label}
      style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 6, width: '100%', padding: '3px 8px',
        borderRadius: 'var(--radius-md)', cursor: disabled ? 'default' : 'pointer',
        border: '1px solid ' + (active ? 'var(--accent)' : 'var(--hairline)'),
        background: active ? 'var(--accent-soft)' : 'transparent',
        opacity: disabled ? 0.4 : (active ? 1 : 0.7),
      }}>
      <span style={{ fontSize: 'var(--text-2xs)', color: 'var(--text-secondary)', fontWeight: 'var(--weight-medium)' }}>{label}</span>
      {value != null ? <MoneyValue value={value} size="sm" signed colored="pnl" showCurrency={false} /> : <span className="muted">—</span>}
    </button>
  );
}

function SimPositionRowView({ pos, row, color, onEdit, onDelete, onPick, state, update, onSetSnote }) {
  const [mode, setMode] = useState(null);
  const slShown = pos.sl != null ? numFmt(pos.sl, 0) : numFmt(posLiqPrice(pos), 0) + ' (liq)';
  const choice = simChoice(pos);
  const sn = snGet(state, pos.snoteId);
  return (
    <div>
      <PosRow side={pos.side} leverage={pos.leverage} alloc={row.pct} allocColor={color}
        line1={`${numFmt(row.marginAbs)} USDC @ ${numFmt(pos.entryPrice, 0)}`}
        line2={`cap. avant ${numFmt(row.capitalBefore, 0)} · TP ${pos.tp != null ? numFmt(pos.tp, 0) : '—'} · SL ${slShown}`}
        center={<div className="pos-order-stepper">
          <IconButton size="sm" label="Augmenter l'ordre" onClick={() => onEdit({ order: (pos.order || 1) + 1 })}><IChevUp /></IconButton>
          <input className="pos-order" type="number" min="1" step="1" value={pos.order ?? ''} title="N° d'ordre dans la rotation"
            onChange={e => { const v = parseInt(e.target.value, 10); if (Number.isInteger(v) && v >= 1) onEdit({ order: v }); }} />
          <IconButton size="sm" label="Diminuer l'ordre" onClick={() => onEdit({ order: Math.max(1, (pos.order || 1) - 1) })}><IChevDown /></IconButton>
        </div>}
        right={
          <>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, width: 126 }}>
              <PickBtn label="@TP" value={row.pnlTp} active={choice === 'tp'} disabled={row.pnlTp == null} onClick={() => onPick(choice === 'tp' ? null : 'tp')} />
              <PickBtn label="@SL" value={row.pnlSl} active={choice === 'sl'} onClick={() => onPick(choice === 'sl' ? null : 'sl')} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              <IconButton size="sm" label="Note" active={!!pos.note} onClick={() => setMode(x => x === 'note' ? null : 'note')}><INote /></IconButton>
              <SnoteControl state={state} update={update} snoteId={pos.snoteId || null} localNote={pos.note || null}
                onAttach={onSetSnote} onClearLocal={() => onEdit({ note: '' })}
                onNew={() => setMode('snote-new')} onEditText={() => setMode('snote-edit')} />
              <IconButton size="sm" label="Éditer" onClick={() => setMode(x => x === 'edit' ? null : 'edit')}><IEdit /></IconButton>
              <IconButton size="sm" label="Supprimer" onClick={onDelete}><ITrash /></IconButton>
            </div>
          </>
        } />
      {mode !== 'snote-edit' && sn && <PosNote text={sn.text} shared colors={snColors(state, sn.id)} />}
      {mode !== 'note' && pos.note && <PosNote text={pos.note} />}
      {mode === 'note' && <NoteEditor value={pos.note} onSave={(t) => { onEdit({ note: t }); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-new' && <NoteEditor requireText value="" onSave={(t) => { if (t) onSetSnote(snCreate(update, t)); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-edit' && sn && <NoteEditor requireText value={sn.text} onSave={(t) => { snSetText(update, sn.id, t); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'edit' && <EditPositionForm pos={pos} pctMode capitalBasis={row.capitalBefore} onCancel={() => setMode(null)} onSave={(d) => { onEdit(d); setMode(null); }} />}
    </div>
  );
}

/* Graphe d'évolution propre à une simulation — trajectoire du capital par étapes
   (Départ, P1, P2…) dérivée de simChain. Pas d'axe temporel (réutilise ChartCanvas en stepMode). */
function SimAccountChart({ acc, steps = [] }) {
  const bodyRef = useRef(null);
  const { w, h } = useSize(bodyRef);
  const [hover, setHover] = useState(null);
  const [unit, setUnit] = useState('usdc');
  const traj = useMemo(() => simTrajectory(acc, steps, simChoice), [acc, steps]);
  const labels = useMemo(() => ['Départ', ...steps.map(s => 'P' + s)], [steps]);
  const series = useMemo(() => [{ key: acc.id, name: acc.name, stroke: idVar(acc.color), chipColor: idVar(acc.color), dash: true, data: traj }], [traj, acc.id, acc.color, acc.name]);
  const hasData = traj.length >= 2;
  // Badges TP / SL posés sur la courbe à chaque position (issue choisie + net) — comme le live.
  const chain = useMemo(() => simChain(acc, simChoice), [acc]);
  const markers = useMemo(() => {
    const out = [];
    for (const p of (acc.positions || [])) {
      if (p.order == null) continue;
      const k = steps.indexOf(p.order);
      if (k < 0) continue;
      const row = chain.rowById[p.id];
      if (!row) continue;
      const net = row.net;
      const tag = simChoice(p) === 'tp' ? 'TP' : 'SL';
      const val = unit === 'pct'
        ? (net >= 0 ? '+' : MINUS) + Math.abs(safePct(net, row.marginAbs)).toFixed(1) + '%'
        : (net >= 0 ? '+' : MINUS) + numFmt(Math.abs(net), 0);
      out.push({ index: k + 1, value: traj[k + 1], label: tag + ' ' + val, tone: net >= 0 ? 'gain' : 'loss' });
    }
    return out;
  }, [acc, steps, traj, unit, chain]);
  return (
    <div className="stack">
      <div className="panel-head">
        <div className="panel-controls">
          <SegmentedControl size="sm" options={['USDC', '%']} value={unit === 'pct' ? '%' : 'USDC'} onChange={(v) => setUnit(v === '%' ? 'pct' : 'usdc')} />
        </div>
      </div>
      <div className="chart-body" ref={bodyRef}>
        <ChartCanvas series={series} labels={labels} unit={unit} w={w} h={h} hover={hover} setHover={setHover} stepMode markers={markers} pctBase={traj[0]} />
        {!hasData && (
          <div className="chart-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style={{ opacity: 0.5 }}><path d="M3 3v18h18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><path d="M7 14l3-3 3 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" /></svg>
            <span style={{ fontSize: 'var(--text-sm)', maxWidth: 360 }}>Ajoute des positions (avec TP / SL) pour voir la trajectoire du capital.</span>
          </div>
        )}
        {hasData && hover != null && (
          <div className="chart-tip" style={{ left: Math.min(Math.max(0, (hover / Math.max(1, traj.length - 1)) * 100), 70) + '%', top: 8 }}>
            <div className="d">{labels[hover]}</div>
            {series.map(se => {
              const raw = se.data[hover];
              const base = se.data.length ? se.data[0] : null;
              const val = unit === 'pct' ? (base ? (raw / base - 1) * 100 : 0) : raw;
              return <div className="r" key={se.key}><span className="k"><span style={{ width: 8, height: 8, borderRadius: '50%', background: se.chipColor, display: 'inline-block' }} />{se.name}</span><span className="v">{unit === 'pct' ? (val >= 0 ? '+' : MINUS) + Math.abs(val).toFixed(2) + '%' : numFmtSigned(val, 0)}</span></div>;
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* Panneau de détail d'une simulation — inline, calqué sur AccountPanel.
   Adapté sim : pas d'Historique ni de Trésorerie ; graphe par étapes ; marge en %. */
function SimAccountPanel({ acc, state, update, usedColors, onDeleted, onDuplicate, steps = [] }) {
  const [openSec, setOpenSec] = useState({ ouvertes: true, graphique: true, strategies: false });
  const toggleSec = (k) => setOpenSec(s => ({ ...s, [k]: !s[k] }));
  const [editing, setEditing] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [posFormOpen, setPosFormOpen] = useState(false);
  const [strat, setStrat] = useState('');
  const [stratFormOpen, setStratFormOpen] = useState(false);
  const menuRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const chain = simChain(acc, simChoice);
  const capital = chain.start;
  const capitalScenario = chain.finalCapital;
  const capitalTp = simChain(acc, () => 'tp').finalCapital;
  const capitalSl = simChain(acc, () => 'sl').finalCapital;
  const gainSc = capitalScenario - capital;
  const positions = acc.positions || [];
  const strategies = acc.strategies || [];

  const mutate = (fn) => update(s => { const a = (s.sims || []).find(x => x.id === acc.id); if (a) fn(a); });
  const addPosition = (d) => mutate(a => { const order = Math.max(0, ...(a.positions || []).map(p => p.order || 0)) + 1; a.positions.push({ id: uid(), status: 'open', openedAt: d.openedAt || new Date().toISOString(), ...d, order }); });
  const editPosition = (pid, d) => mutate(a => { const p = a.positions.find(x => x.id === pid); if (p) Object.assign(p, d); });
  // Même setter dédié que côté manuel : la référence se retire par delete, jamais null.
  const setPosSnote = (pid, id) => mutate(a => { const p = a.positions.find(x => x.id === pid); if (p) { if (id) p.snoteId = id; else delete p.snoteId; } });
  const deletePosition = (pid) => { if (confirm('Supprimer cette position simulée ?')) mutate(a => { a.positions = a.positions.filter(x => x.id !== pid); }); };
  const addStrategy = () => { const t = strat.trim(); if (t) { mutate(a => { (a.strategies || (a.strategies = [])).push({ id: uid(), text: t, at: todayStr() + 'T12:00:00' }); }); setStrat(''); } };
  const editStrategy = (sid, text) => mutate(a => { const s = (a.strategies || []).find(x => x.id === sid); if (s) s.text = text; });
  const deleteStrategy = (sid) => { if (confirm('Supprimer cette stratégie ?')) mutate(a => { a.strategies = (a.strategies || []).filter(x => x.id !== sid); }); };
  const deleteAccount = () => { if (confirm('Supprimer la simulation « ' + acc.name + ' » ?')) { update(s => { s.sims = (s.sims || []).filter(x => x.id !== acc.id); }); onDeleted(); } };
  const saveEdit = (d) => { mutate(a => { a.name = d.name; a.color = d.color; if (d.openingCash != null) a.openingCash = d.openingCash; }); setEditing(false); };

  return (
    <div className="account-panel">
      <div className="account-menu" ref={menuRef}>
        <IconButton size="sm" label="Actions de la simulation" active={menuOpen} onClick={() => setMenuOpen(o => !o)}><IMore /></IconButton>
        {menuOpen && (
          <div className="menu">
            <button className="menu-item" onClick={() => { setEditing(e => !e); setMenuOpen(false); }}>
              <span>Éditer la simulation</span><span className="meta"><IEdit /></span>
            </button>
            <button className="menu-item" onClick={() => { setMenuOpen(false); onDuplicate(acc.id); }}>
              <span>Dupliquer la simulation</span><span className="meta"><ICopy /></span>
            </button>
            <div className="menu-sep" />
            <button className="menu-item" onClick={() => { setMenuOpen(false); deleteAccount(); }} style={{ color: 'var(--loss)' }}>
              <span>Supprimer la simulation</span><span className="meta" style={{ color: 'var(--loss)' }}><ITrash /></span>
            </button>
          </div>
        )}
      </div>
      <div className="modal-stats">
        <ModalStat label="Capital"><MoneyValue value={capital} size="lg" /></ModalStat>
        {chain.count > 0 && <>
          <div className="divider" />
          <ModalStat label="Capital scénario"><MoneyValue value={capitalScenario} size="lg" colored={gainSc >= 0 ? 'none' : 'pnl'} /></ModalStat>
          <ModalStat label={'Gain · ' + chain.scenarioCount + '/' + chain.count}><StatNode v={gainSc} size="md" /></ModalStat>
          <div className="divider" />
          <ModalStat label="Tout TP"><MoneyValue value={capitalTp} size="md" /></ModalStat>
          <ModalStat label="Tout SL / liq."><MoneyValue value={capitalSl} size="md" /></ModalStat>
        </>}
      </div>

      {editing && <EditAccountForm acc={acc} usedColors={usedColors} showCapital onCancel={() => setEditing(false)} onSave={saveEdit} />}

      <div className="acc-list">
        <Section title="Positions simulées" open={openSec.ouvertes} onToggle={() => toggleSec('ouvertes')}
          right={<span className="muted">{positions.length}</span>}>
          <div className="stack">
            <CollapsibleHeader title="Ouvrir une position" open={posFormOpen} onToggle={() => setPosFormOpen(o => !o)} />
            {posFormOpen && <OpenPositionForm freeCash={0} btcPrice={null} cashless pctMode capitalBasis={capitalScenario} hideTitle onSubmit={addPosition} />}
          </div>
          {positions.length === 0 ? <div className="empty-note">Aucune position. Configure des scénarios (marge en % du capital, avec TP / SL).</div>
            : <div className="pos-list">{positions.slice().sort((a, b) => ((a.order != null ? a.order : Infinity) - (b.order != null ? b.order : Infinity))).map(p => <SimPositionRowView key={p.id} pos={p} row={chain.rowById[p.id]} color={acc.color} onEdit={(d) => editPosition(p.id, d)} onDelete={() => deletePosition(p.id)} onPick={(scenario) => editPosition(p.id, { scenario })} state={state} update={update} onSetSnote={(id) => setPosSnote(p.id, id)} />)}</div>}
        </Section>

        <Section title="Évolution" open={openSec.graphique} onToggle={() => toggleSec('graphique')}>
          <SimAccountChart acc={acc} steps={steps} />
        </Section>

        <Section title="Stratégies" open={openSec.strategies} onToggle={() => toggleSec('strategies')}
          right={<span className="muted">{strategies.length}</span>}>
          <div className="stack">
            <CollapsibleHeader title="Nouvelle stratégie" open={stratFormOpen} onToggle={() => setStratFormOpen(o => !o)} />
            {stratFormOpen && (
              <>
                <textarea className="strat-input" value={strat} rows={3} placeholder="Décris ta stratégie…" onChange={e => setStrat(e.target.value)} />
                <Button variant="primary" disabled={!strat.trim()} onClick={addStrategy}>Ajouter</Button>
              </>
            )}
          </div>
          {strategies.length === 0
            ? <div className="empty-note">Aucune stratégie pour l’instant.</div>
            : <div className="pos-list">{strategies.slice().reverse().map(s => <StrategyRow key={s.id} strat={s} onEdit={(t) => editStrategy(s.id, t)} onDelete={() => deleteStrategy(s.id)} />)}</div>}
        </Section>
      </div>
    </div>
  );
}

/* Colonne KPI de la vue Simulation (même gabarit .kpi-col que le Live) */
function SimSummaryBar({ sims }) {
  const [unit, setUnit] = useState('usdc');
  const toggle = () => setUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // Même convention que SummaryBar : USDC et % à la MÊME taille → pas de saut de hauteur.
  const gMain = (v, p) => unit === 'pct'
    ? <span className="gnum" style={{ color: semColor(p) }}>{(p >= 0 ? '+' : MINUS)}{Math.abs(p).toFixed(2)}%</span>
    : <MoneyValue value={v} size="md" signed colored="pnl" showCurrency={false} />;
  let totalInitial = 0, totalScenario = 0, totalTp = 0, totalSl = 0;
  const expos = [];
  for (const acc of sims) {
    const ch = simChain(acc, simChoice);
    totalInitial += ch.start;
    totalScenario += ch.finalCapital;
    totalTp += simChain(acc, () => 'tp').finalCapital;
    totalSl += simChain(acc, () => 'sl').finalCapital;
    for (const r of ch.rows) expos.push(r.pct);
  }
  const gTp = totalTp - totalInitial, gSl = totalSl - totalInitial;
  const avgExpo = expos.length ? expos.reduce((a, b) => a + b, 0) / expos.length : 0;
  const maxExpo = expos.length ? Math.max(...expos) : 0;
  const hasPos = expos.length > 0;
  let nbLong = 0, nbShort = 0, levSum = 0, levN = 0;
  for (const acc of sims) for (const p of (acc.positions || [])) {
    if (p.side === 'long') nbLong++; else nbShort++;
    levSum += (p.leverage || 0); levN++;
  }
  const avgLev = levN ? Math.round(levSum / levN * 10) / 10 : 0;
  return (
    <div className="kpi-col">
      <ModalStat label="Valeur totale · scénario"><MoneyValue value={totalScenario} size="lg" colored="accent" /></ModalStat>
      <KpiRow label="Initiale"><MoneyValue value={totalInitial} size="md" /></KpiRow>
      <div className="kpi-sep" />
      {hasPos ? (
        <div className="kpi-gains" role="button" tabIndex={0} onClick={toggle}
          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
          title="Cliquer pour basculer USDC / %">
          <div className="kpi-group-head">
            <span className="muted">Gains</span>
            <span className="unit-toggle"><span className={unit === 'usdc' ? 'on' : ''}>USDC</span> / <span className={unit === 'pct' ? 'on' : ''}>%</span></span>
          </div>
          <KpiRow label="Si tous TP">{gMain(gTp, safePct(gTp, totalInitial))}</KpiRow>
          <KpiRow label="Si tous SL / liq.">{gMain(gSl, safePct(gSl, totalInitial))}</KpiRow>
        </div>
      ) : (
        <KpiRow label="Prévisions"><span className="muted">Aucune position simulée</span></KpiRow>
      )}
      <div className="kpi-sep" />
      <KpiRow label="Positions ouvertes">
        <span className="kpi-sides">
          <span className="gnum">{nbLong}</span><Badge tone="long" size="sm" style={{ justifyContent: 'center' }}>Long</Badge>
          <span className="gnum">{nbShort}</span><Badge tone="short" size="sm" style={{ justifyContent: 'center' }}>Short</Badge>
        </span>
      </KpiRow>
      <KpiRow label="Expo moyenne"><span className="kpi-ring"><AllocationRing percent={avgExpo} color="var(--accent)" risk size="md" /></span></KpiRow>
      <KpiRow label="Expo max"><span className="kpi-ring"><AllocationRing percent={maxExpo} color="var(--accent)" risk size="md" /></span></KpiRow>
      <KpiRow label="Levier moyen">{levN ? <LeverageBadge value={avgLev} size="sm" /> : <span className="muted">—</span>}</KpiRow>
    </div>
  );
}

/* En-tête d'onglet de simulation : nom + menu kebab (renommer inline / supprimer) */
function SimTabMenu({ name, onRename, onDuplicate, onDelete }) {

  const [editing, setEditing] = useState(false);
  // Brouillon local commité au blur/Enter : l'ancien onChange → onRename persistait
  // le document ENTIER (update + persist) à chaque frappe. Échap = abandon du brouillon.
  const [draft, setDraft] = useState('');
  const cancel = useRef(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  return (
    <div className="viewnav-tail" ref={ref}>
      {editing && <input className="simtab-rename" value={draft} aria-label="Nom de l’onglet" autoFocus
        onChange={e => setDraft(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); else if (e.key === 'Escape') { cancel.current = true; setEditing(false); } }}
        onBlur={() => { if (!cancel.current && draft.trim() && draft.trim() !== name) onRename(draft.trim()); cancel.current = false; setEditing(false); }} />}
      <IconButton size="sm" label="Actions de l’onglet" active={open} onClick={() => setOpen(o => !o)}><IMore /></IconButton>
