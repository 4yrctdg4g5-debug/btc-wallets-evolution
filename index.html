/* =============================================================
   BANDEAU KPI — synthèse live sur une ligne (langage .modal-stats)
   ============================================================= */
function SummaryBar({ agg, today, price, accounts = [], state, update }) {
  const [unit, setUnit] = useState('usdc');
  // Positions ouvertes : manuelles + snapshot des comptes hyperliquid (mêmes champs side/leverage).
  const open = accounts.flatMap(a => a.source === 'hyperliquid'
    ? (((a.hl || {}).snapshot || {}).positions || [])
    : (a.positions || []).filter(p => p.status === 'open'));
  const nbLong = open.filter(p => p.side === 'long').length;
  const nbShort = open.length - nbLong;
  // Win rate cumulé : trades clôturés de TOUS les comptes (manuels + wallets suivis).
  const ws = useMemo(() => accounts.reduce((s, a) => {
    const w = accWinStats(a, state);
    return { wins: s.wins + w.wins, total: s.total + w.total };
  }, { wins: 0, total: 0 }), [accounts, state]);
  // Capital de référence : valeur au T0 quand un compte en a un, sinon capital net déposé.
  const base = agg.base != null ? agg.base : agg.netDeposits;
  const toggle = () => setUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // USDC et % rendus à la MÊME taille de police → hauteur de bandeau constante au switch.
  const gMain = (v, p) => unit === 'pct'
    ? pctNode(p, 'gnum')
    : <MoneyValue value={v} size="md" signed colored="pnl" showCurrency={false} />;
  const gSub = (v, p) => unit === 'pct'
    ? pctNode(p, 'gnum-sm')
    : <MoneyValue value={v} size="sm" signed colored="pnl" showCurrency={false} />;

  const expoPct = safePct(agg.openMargin, agg.equity);
  // Projections globales : équity purgée du latent (absolu, d'où le + t0Latent) + P&L aux
  // cibles = la somme EXACTE des « Valeur si TP / si SL/liq » des panneaux (computeForecast
  // est additif par compte et sa branche hyperliquid n'utilise pas `price`).
  const fc = useMemo(() => computeForecast(accounts, price), [accounts, price]);
  const valTp = agg.equity - (agg.latent + agg.t0Latent) + fc.upPnl;
  const valSl = agg.equity - (agg.latent + agg.t0Latent) + fc.downPnl;

  // Journal — mêmes enregistrements et même file que la vue Journal, mêmes
  // modales rendues sur place : la colonne est un raccourci, pas une autre surface.
  const records = useMemo(() => jRecs(state).filter(r => !r.orphan), [state.journal]);
  const file = useMemo(() => jFile(state), [state.journal]);
  // Avancement : trades traités / TOUS les trades de l'historique — y compris les
  // antérieurs au suivi jamais touchés (décision utilisateur : le dénominateur mesure
  // l'historique entier, pas la seule dette « comptée » au sens de jCounted).
  const aJour = records.filter(r => !jCardType(r)).length;
  const [deck, setDeck] = useState(null);          // paquet figé + index de départ
  const [detail, setDetail] = useState(null);      // clé du trade dont on lit la fiche
  const [statsOpen, setStatsOpen] = useState(false);
  const [configOpen, setConfigOpen] = useState(false);
  const openRec = (rec) => {
    // Plus rien à saisir → on relit la fiche complète au lieu de ne rien faire.
    if (!jCardType(rec)) return setDetail(rec.key);
    const cards = file.some(r => r.key === rec.key) ? file : [rec].concat(file);
    setDeck({ cards, start: Math.max(0, cards.findIndex(r => r.key === rec.key)) });
  };

  return (
    <div className="kpi-col">
      <ModalStat label="Valeur totale live"><MoneyValue value={agg.equity} size="lg" colored="accent" /></ModalStat>
      <div className="kpi-sep" />
      <div className="kpi-gains" role="button" tabIndex={0} onClick={toggle}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
        title="Cliquer pour basculer USDC / %">
        <div className="kpi-group-head">
          <span className="muted">Gains</span>
          <span className="unit-toggle"><span className={unit === 'usdc' ? 'on' : ''}>USDC</span> / <span className={unit === 'pct' ? 'on' : ''}>%</span></span>
        </div>
        {/* Encaissé d'abord, latent total ensuite, latent du jour enfin.
            L'« Initiale » (base des %) ne vaut plus une ligne : elle survit en infobulle. */}
        <KpiRow label="Réalisés" title={(agg.anyT0 ? 'Initiale (T0) : ' : 'Initiale : ') + (base < 0 ? MINUS : '') + numFmt(base, 2) + ' USDC'}>
          {gMain(agg.realized, safePct(agg.realized, base))}
        </KpiRow>
        <KpiRow label="Latents">{gMain(agg.latent, safePct(agg.latent, agg.openMargin))}</KpiRow>
        <KpiRow label="Aujourd’hui">{gSub(today.latent, today.latentPct)}</KpiRow>
      </div>
      {fc.hasOpen && (
        <>
          <div className="kpi-sep" />
          {/* VALEURS des portefeuilles aux cibles, pas des écarts : ni signe ni couleur — comme les panneaux. */}
          <KpiRow label="Valeur si TP" title="Positions sans TP : leur valeur actuelle est conservée telle quelle dans la projection.">
            <MoneyValue value={valTp} size="md" />
          </KpiRow>
          <KpiRow label="Valeur si SL/liq"><MoneyValue value={valSl} size="md" /></KpiRow>
          {!fc.anyTp && <span className="kpi-note">Définis des TP pour la projection</span>}
        </>
      )}
      <div className="kpi-sep" />
      <KpiRow label="Exposition">
        {open.length > 0 && (
          <span className="kpi-expo-sides">
            <span className="gnum-sm">{nbLong}</span><Badge tone="long" size="sm">L</Badge>
            <span className="gnum-sm">{nbShort}</span><Badge tone="short" size="sm">S</Badge>
          </span>
        )}
        {/* Pourcentage texte — l'anneau reste aux lignes de position (aligné aux badges) ;
            son seuil de risque (rouge ≥75 %) est conservé sur la couleur du texte. */}
        <span className="gnum" style={expoPct >= 75 ? { color: 'var(--loss)' } : undefined}>{Math.round(expoPct)} %</span>
      </KpiRow>
      <KpiRow label="Win rate">
        {ws.total > 0
          ? <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 6 }}>
              <span className="gnum">{Math.round(safePct(ws.wins, ws.total))}%</span>
              <span className="muted">{ws.wins}/{ws.total}</span>
            </span>
          : <span className="muted">—</span>}
      </KpiRow>
      {records.length > 0 && (
        <>
          <div className="kpi-sep" />
          <div className="kpi-fil">
            <div className="kpi-group-head">
              <span className="muted">Journal</span>
              <span className="kpi-fil-actions">
                {file.length > 0 && (
                  <button type="button" className="jrn-chip kpi-fil-count" title="Dérouler les cartes à saisir"
                    onClick={() => setDeck({ cards: file, start: 0 })}>{file.length} à faire</button>
                )}
                <IconButton size="sm" label="Statistiques du journal" onClick={() => setStatsOpen(true)}><IChart /></IconButton>
                <IconButton size="sm" label="Réglages du journal" onClick={() => setConfigOpen(true)}><IMore /></IconButton>
              </span>
            </div>
            <KpiRow label="À jour"><span className="gnum">{aJour} / {records.length}</span></KpiRow>
            <JournalGrid records={records} accounts={accounts} onOpen={openRec} />
          </div>
        </>
      )}
      {deck && <JournalCardModal state={state} update={update} deck={deck.cards}
        startIndex={deck.start} accounts={accounts} onClose={() => setDeck(null)} />}
      {detail && jRec(state, detail) && <JournalTradeModal state={state} update={update} rec={jRec(state, detail)}
        accounts={accounts} onClose={() => setDetail(null)} />}
      {statsOpen && <JournalStatsModal state={state} records={records} onClose={() => setStatsOpen(false)} />}
      {configOpen && <JournalConfigModal state={state} update={update} records={records} onClose={() => setConfigOpen(false)} />}
    </div>
  );
}

/* =============================================================
   GRAPHE — coque & contrôles DS, échelle adaptative conservée
   (le EvolutionChart du DS force un plancher à 0 qui aplatit la
    courbe d'équity en USDC — on garde donc le rendu adaptatif)
   ============================================================= */
function useSize(ref) {
  const [size, setSize] = useState({ w: 900, h: 300 });
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(es => { const e = es[0]; if (e) setSize({ w: e.contentRect.width, h: e.contentRect.height }); });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return size;
}

const RANGES = ['30J', '90J', '1A', 'TOUT'];
const rangeDays = { '30J': 30, '90J': 90, '1A': 365, 'TOUT': Infinity };

// Graphes temps réel en % : gains cumulés (valeur − dépôts nets du jour) rapportés au capital
// déposé du jour — un dépôt n'est pas un gain. Remplace la normalisation sur la 1re valeur
// visible, qui comptait les dépôts comme des gains et restait à 0 % partout quand cette
// 1re valeur valait 0 (wallet vide au début de la plage). Même règle que BWE_Android.
const gainsPct = (equity, netDeposits) =>
  (equity == null || netDeposits == null ? null : safePct(equity - netDeposits, Math.abs(netDeposits)));

function ChartCanvas({ series, labels, unit, w, h, hover, setHover, stepMode = false, hlines = [], markers = [], pctBase = null, xs = null, zoomable = false, setHoverX = null, spans = [], onMarkerClick = null, vlines = [], pctDirect = false }) {
  const padTop = 16, padBot = 30, padLeft = 12, padRight = 64;
  // Zoom (optionnel) : fenêtre visible {a, b} en fractions 0..1 du domaine X (null = tout).
  // Molette = zoom centré curseur · glisser = pan · double-clic / badge ⟲ = reset.
  const [win, setWin] = useState(null);
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);
  const svgRef = useRef(null);
  const nRef = useRef(0);
  const clipId = useRef('cc' + Math.random().toString(36).slice(2, 8)).current;
  // Niveaux d'équité absolus (lignes TP/SL, marqueurs) → convertis dans l'unité courante,
  // en % normalisés sur la base de la série « Valeur ». `pctDirect` : le parent fournit
  // séries, lignes et marqueurs DÉJÀ en % (gainsPct) — aucune re-normalisation ici.
  const conv = (v) => (unit === 'pct' && !pctDirect ? (pctBase ? (v / pctBase - 1) * 100 : 0) : v);
  const iw = Math.max(10, w - padLeft - padRight);
  const ih = Math.max(10, h - padTop - padBot);

  const transformed = series.map(se => {
    const raw = se.data;
    let base = null;
    for (const v of raw) { if (v != null && !isNaN(v)) { base = v; break; } }
    const vals = raw.map(v => {
      if (v == null || isNaN(v)) return null;
      if (unit === 'pct' && !pctDirect) return base ? (v / base - 1) * 100 : 0;
      return v;
    });
    return { ...se, vals };
  });

  const n = labels.length;
  nRef.current = n;
  // fx(i) = fraction du point dans le domaine complet (axe temps via xs, sinon index) ;
  // sx(i) = fraction à l'écran à travers la fenêtre de zoom.
  const fx = (i) => (xs ? (xs[i] != null ? xs[i] : 0) : (n > 1 ? i / (n - 1) : 0.5));
  const a = win ? win.a : 0, b = win ? win.b : 1;
  const spanW = Math.max(1e-9, b - a);
  const sx = (i) => (fx(i) - a) / spanW;
  const visible = (i) => { const s = sx(i); return s >= -1e-9 && s <= 1 + 1e-9; };
  const xAt = (i) => padLeft + sx(i) * iw;

  // Domaine Y : points VISIBLES seulement ; à plein cadre, hlines/marqueurs l'étendent aussi.
  let yMin = Infinity, yMax = -Infinity;
  for (const se of transformed) se.vals.forEach((v, i) => { if (v != null && visible(i)) { yMin = Math.min(yMin, v); yMax = Math.max(yMax, v); } });
  if (!win) {
    for (const hl of hlines) { const cv = conv(hl.value); if (isFinite(cv)) { yMin = Math.min(yMin, cv); yMax = Math.max(yMax, cv); } }
    for (const mk of markers) { const cv = conv(mk.value); if (isFinite(cv)) { yMin = Math.min(yMin, cv); yMax = Math.max(yMax, cv); } }
  }
  if (!isFinite(yMin) || !isFinite(yMax)) { yMin = 0; yMax = unit === 'pct' ? 10 : 100; }
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const padY = (yMax - yMin) * 0.12 || 1;
  yMin -= padY; yMax += padY;

  const yAt = (v) => padTop + (1 - (v - yMin) / (yMax - yMin)) * ih;
  const yInPlot = (y) => y >= padTop - 4 && y <= padTop + ih + 4;
  const hasData = n >= 2 && series.length > 0;

  const yTicks = [];
  for (let i = 0; i <= 3; i++) {
    const v = yMin + (i / 3) * (yMax - yMin);
    yTicks.push({ v, label: unit === 'pct' ? (v >= 0 ? '+' : MINUS) + Math.abs(v).toFixed(0) + '%' : numFmtSigned(v, 0) });
  }
  const xTicks = [];
  if (n) {
    const c = Math.min(stepMode ? 6 : 5, n);
    let prev = -1;
    for (let i = 0; i < c; i++) {
      const f = i / Math.max(1, c - 1);
      let idx = -1, bd = Infinity;
      for (let k = 0; k < n; k++) {
        const s = sx(k);
        if (s < -1e-9 || s > 1 + 1e-9) continue;
        const dk = Math.abs(s - f);
        if (dk < bd) { bd = dk; idx = k; }
      }
      if (idx < 0 || idx === prev) continue;           // dédoublonne (zones clairsemées)
      prev = idx;
      xTicks.push({ x: xAt(idx), label: labels[idx] });
    }
  }

  // Zoom : ⌘/Ctrl + molette, ou pincement du trackpad. Une molette SIMPLE n'est pas
  // interceptée (elle fait défiler la page — avant, survoler un graphe bloquait le scroll).
  // Listeners natifs non-passifs (React attache wheel en passif → preventDefault impossible).
  useEffect(() => {
    if (!zoomable) return;
    const el = svgRef.current;
    if (!el) return;
    // k < 1 = zoom avant, k > 1 = zoom arrière, centré sur la fraction du domaine sous le curseur.
    const zoomAt = (clientX, k) => {
      const rect = el.getBoundingClientRect();
      const f = Math.max(0, Math.min(1, (clientX - rect.left - padLeft) / Math.max(10, rect.width - padLeft - padRight)));
      setWin(prev => {
        const pa = prev ? prev.a : 0, pb = prev ? prev.b : 1;
        const fd = pa + f * (pb - pa);                  // fraction du domaine sous le curseur
        let na = Math.max(0, fd - (fd - pa) * k), nb = Math.min(1, fd + (pb - fd) * k);
        const minSpan = Math.max(0.01, 4 / Math.max(4, nRef.current));   // ~4 points mini
        if (nb - na < minSpan) return prev;
        return (na <= 0 && nb >= 1) ? null : { a: na, b: nb };
      });
    };
    let gesturing = false;
    const onWheel = (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();                               // bloque aussi le zoom de la page
      if (gesturing) return;                            // Safari : le pincement passe par gesture*
      // Le pincement (Chrome/Firefox) arrive en wheel + ctrlKey à petits deltaY → base plus
      // forte ; molette/trackpad avec ⌘/Ctrl : ~±10 % par cran (deltaY ±100), progressif.
      // Borné pour absorber les rafales inertielles. deltaY > 0 (vers soi) = dézoom.
      const pinch = e.ctrlKey && e.deltaMode === 0 && Math.abs(e.deltaY) < 50;
      zoomAt(e.clientX, Math.min(1.4, Math.max(0.7, Math.pow(pinch ? 1.01 : 1.001, e.deltaY))));
    };
    // Safari : pincement = GestureEvent (scale cumulé depuis gesturestart). Sur écran
    // tactile (iPhone/iPad), pas de zoom au doigt : le pincement est seulement neutralisé
    // sur le graphe (sinon c'est la page entière qui zoome) — les boutons de période suffisent.
    const touchScreen = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    let lastScale = 1;
    const onGestureStart = (e) => { e.preventDefault(); gesturing = true; lastScale = 1; };
    const onGestureChange = (e) => {
      e.preventDefault();
      if (touchScreen) return;
      const k = lastScale / (e.scale || 1);
      lastScale = e.scale || 1;
      zoomAt(e.clientX, Math.min(1.4, Math.max(0.7, k)));
    };
    const onGestureEnd = (e) => { e.preventDefault(); gesturing = false; };
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('gesturestart', onGestureStart);
    el.addEventListener('gesturechange', onGestureChange);
    el.addEventListener('gestureend', onGestureEnd);
    return () => {
      el.removeEventListener('wheel', onWheel);
      el.removeEventListener('gesturestart', onGestureStart);
      el.removeEventListener('gesturechange', onGestureChange);
      el.removeEventListener('gestureend', onGestureEnd);
    };
  }, [zoomable]);

  // Événements POINTEUR (souris et doigt, même code). Au doigt : le curseur et l'infobulle
  // suivent le doigt tant qu'il est posé et disparaissent au relâchement (onUp) ; pas de
  // zoom ni de pan tactiles, les boutons de période suffisent. touch-action: pan-y (style
  // du svg) laisse le défilement vertical au navigateur — il émet alors pointercancel,
  // qui efface aussi l'infobulle.
  const endDrag = () => { dragRef.current = null; setDragging(false); };
  const onUp = (e) => (e.pointerType === 'touch' ? onLeave() : endDrag());
  const onDown = (e) => {
    if (e.pointerType === 'touch') { onMove(e); return; }   // infobulle dès le contact
    if (!zoomable || !win) return;                     // pan seulement quand zoomé
    e.preventDefault();
    dragRef.current = { x0: e.clientX, a, b };
    setDragging(true);
  };
  const onMove = (e) => {
    if (dragRef.current) {                             // pan : décale la fenêtre, hover suspendu
      const d = dragRef.current;
      const df = -((e.clientX - d.x0) / iw) * (d.b - d.a);
      let na = d.a + df, nb = d.b + df;
      if (na < 0) { nb -= na; na = 0; }
      if (nb > 1) { na -= (nb - 1); nb = 1; }
      setWin({ a: na, b: nb });
      setHover(null);
      return;
    }
    if (!hasData) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const rel = (e.clientX - rect.left - padLeft) / iw;
    let best = null, bd = Infinity;                    // point visible le plus proche à l'écran
    for (let i = 0; i < n; i++) {
      const s = sx(i);
      if (s < -0.02 || s > 1.02) continue;
      const dk = Math.abs(s - rel);
      if (dk < bd) { bd = dk; best = i; }
    }
    setHover(best);
    if (setHoverX && best != null) setHoverX(Math.max(0, Math.min(1, sx(best))));
  };
  const onLeave = () => { setHover(null); if (setHoverX) setHoverX(null); endDrag(); };

  return (
    <svg ref={svgRef} width="100%" height="100%" style={{ display: 'block', overflow: 'visible', touchAction: 'pan-y' }}
      className={zoomable ? 'zoomable' + (win ? ' zoomed' : '') + (dragging ? ' grabbing' : '') : ''}
      onPointerMove={onMove} onPointerLeave={onLeave} onPointerDown={onDown} onPointerUp={onUp} onPointerCancel={onLeave}
      onDoubleClick={() => zoomable && setWin(null)}>
      {win && <defs><clipPath id={clipId}><rect x={padLeft} y={padTop - 8} width={iw} height={ih + 16} /></clipPath></defs>}
      {/* Filigranes de trades : bandes translucides sur la durée de chaque épisode (arrière-plan) */}
      {spans.map((sp, i) => {
        const SPAN_TONE = { gain: 'var(--gain)', loss: 'var(--loss)', accent: 'var(--accent)' };
        const s0 = Math.max(0, (sp.f0 - a) / spanW), s1 = Math.min(1, (sp.f1 - a) / spanW);
        if (s1 <= 0 || s0 >= 1 || s1 <= s0) return null;
        return <rect key={'sp' + i} x={padLeft + s0 * iw} y={padTop} width={Math.max(1, (s1 - s0) * iw)} height={ih}
          fill={SPAN_TONE[sp.tone] || SPAN_TONE.accent} opacity="0.07" pointerEvents="none" />;
      })}
      {yTicks.map((t, i) => {
        const y = yAt(t.v);
        const isZero = unit === 'pct' && Math.abs(t.v) < 1e-6;
        return (
          <g key={i}>
            <line x1={padLeft} x2={padLeft + iw} y1={y} y2={y} stroke={isZero ? 'var(--hairline-strong)' : 'var(--hairline)'} strokeDasharray={isZero ? '' : '3 4'} />
            <text x={padLeft + iw + 10} y={y + 4} fill="var(--text-muted)" fontSize="12" className="num">{t.label}</text>
          </g>
        );
      })}
      {unit === 'pct' && yMin < 0 && yMax > 0 && (
        <line x1={padLeft} x2={padLeft + iw} y1={yAt(0)} y2={yAt(0)} stroke="var(--hairline-strong)" />
      )}
      {hasData && transformed.map(se => {
        let dpath = '', started = false;
        se.vals.forEach((v, i) => { if (v == null) return; dpath += (started ? 'L' : 'M') + xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1) + ' '; started = true; });
        return <path key={se.key} d={dpath} fill="none" stroke={se.stroke} strokeWidth={se.key === 'total' ? 2 : 1.6}
          strokeDasharray={se.dash ? '5 4' : ''} strokeLinejoin="round" strokeLinecap="round"
          clipPath={win ? 'url(#' + clipId + ')' : undefined} />;
      })}
      {/* Lignes de repère TP/SL — dessinées APRÈS les courbes pour rester au premier plan */}
      {hlines.map((hl, i) => {
        const y = yAt(conv(hl.value));
        if (win && !yInPlot(y)) return null;           // hors zone quand zoomé
        const cv = conv(hl.value);
        const valLabel = unit === 'pct'
          ? (cv >= 0 ? '+' : MINUS) + Math.abs(cv).toFixed(0) + '%'
          : numFmtSigned(hl.value, 0);
        const wv = Math.min(58, valLabel.length * 7 + 12);
        return (
          <g key={'hl' + i}>
            <line x1={padLeft} x2={padLeft + iw} y1={y} y2={y} stroke={hl.color} strokeDasharray="6 4" strokeWidth="1.2" opacity="0.85" />
            <text x={padLeft + 6} y={y - 5} fill={hl.color} fontSize="11" fontWeight="600">{hl.label}</text>
            <rect x={padLeft + iw + 6} y={y - 9} width={wv} height="18" rx="9" fill="var(--surface-card)" stroke={hl.color} strokeWidth="1" opacity="0.95" />
            <text x={padLeft + iw + 6 + wv / 2} y={y + 4} textAnchor="middle" fill={hl.color} fontSize="11" fontWeight="600" className="num">{valLabel}</text>
          </g>
        );
      })}
      {/* Barres verticales de repère (T0) — `f` = fraction du domaine COMPLET, comme spans :
          la soustraction de la fenêtre de zoom suffit, pas besoin de clipPath. */}
      {vlines.map((vl, i) => {
        const s = (vl.f - a) / spanW;
        if (s < -1e-9 || s > 1 + 1e-9) return null;    // hors fenêtre visible
        const x = padLeft + s * iw;
        const atEnd = x > padLeft + iw - 30;                       // label vers l'intérieur au bord droit
        const underBadge = win && x < padLeft + 46;                // badge ⟲ (reset zoom) au coin haut-gauche
        return (
          <g key={'vl' + i} pointerEvents="none">
            <line x1={x} x2={x} y1={padTop} y2={padTop + ih} stroke={vl.color} strokeDasharray="6 4" strokeWidth="1.2" opacity="0.85" />
            <text x={x + (atEnd ? -6 : 6)} y={padTop + (underBadge ? 34 : 11)} textAnchor={atEnd ? 'end' : 'start'}
              fill={vl.color} fontSize="11" fontWeight="600">{vl.label}</text>
          </g>
        );
      })}
      {hasData && xTicks.map((t, i) => (
        <text key={i} x={t.x} y={padTop + ih + 20} textAnchor={i === 0 ? 'start' : i === xTicks.length - 1 ? 'end' : 'middle'} fill="var(--text-muted)" fontSize="12">{t.label}</text>
      ))}
      {hasData && hover != null && (
        <g>
          <line x1={xAt(hover)} x2={xAt(hover)} y1={padTop} y2={padTop + ih} stroke="var(--hairline-strong)" />
          {transformed.map(se => se.vals[hover] != null &&
            <circle key={se.key} cx={xAt(hover)} cy={yAt(se.vals[hover])} r="3.5" fill="var(--surface-card)" stroke={se.stroke} strokeWidth="2" />)}
        </g>
      )}
      {markers.map((mk, i) => {
        const TONE = {
          gain: ['var(--gain-soft)', 'var(--gain)'],
          loss: ['var(--loss-soft)', 'var(--loss)'],
          accent: ['var(--accent-soft)', 'var(--accent)'],
        };
        const [bg, fg] = TONE[mk.tone] || TONE.accent;
        const s = sx(mk.index);
        if (s < -0.005 || s > 1.005) return null;      // hors fenêtre de zoom
        const x = xAt(mk.index), y = yAt(conv(mk.value));
        if (win && !yInPlot(y)) return null;
        const wlab = mk.label.length * 6.6 + 14;
        const px = Math.max(padLeft, Math.min(padLeft + iw - wlab, x - wlab / 2));
        // Étiquette au-dessus du point (clôtures) ou en dessous (entrées, mk.below)
        const py = mk.below ? Math.min(padTop + ih - 18, y + 12) : Math.max(padTop, y - 30);
        const clickable = onMarkerClick && mk.trade;
        return (
          <g key={'mk' + i} style={clickable ? { cursor: 'pointer' } : undefined}
            onClick={clickable ? (e) => { e.stopPropagation(); onMarkerClick(mk); } : undefined}
            onPointerDown={clickable ? (e) => e.stopPropagation() : undefined}
            onDoubleClick={clickable ? (e) => e.stopPropagation() : undefined}>
            <circle cx={x} cy={y} r="3.2" fill="var(--surface-card)" stroke={fg} strokeWidth="2" />
            <rect x={px} y={py} width={wlab} height="18" rx="9" fill={bg} />
            <text x={px + wlab / 2} y={py + 13} textAnchor="middle" fill={fg} fontSize="11" fontWeight="600">{mk.label}</text>
          </g>
        );
      })}
      {/* Badge de réinitialisation du zoom (aussi : double-clic) */}
      {zoomable && win && (
        <g style={{ cursor: 'pointer' }} onClick={() => setWin(null)} onPointerDown={e => e.stopPropagation()}>
          <rect x={padLeft + 4} y={padTop + 2} width="26" height="20" rx="10" fill="var(--surface-active)" stroke="var(--hairline)" />
          <text x={padLeft + 17} y={padTop + 16} textAnchor="middle" fontSize="12" fill="var(--text-secondary)">⟲</text>
        </g>
      )}
    </svg>
  );
}

function EvoChart({ history, accounts, settings, chart, setUnit, setRange, toggleSeries, onBackfill, backfilling }) {
  const bodyRef = useRef(null);
  const { w, h } = useSize(bodyRef);
  const [hover, setHover] = useState(null);
  const [hoverX, setHoverX] = useState(null);   // fraction écran du point survolé (suit le zoom)
  const unit = settings.chartUnit;
  const range = settings.range;

  const data = useMemo(() => {
    if (rangeDays[range] === Infinity) return history;
    const cut = todayStr(new Date(Date.now() - rangeDays[range] * 86400000));
    return history.filter(s => s.date >= cut);
  }, [history, range]);

  // En % : gains cumulés rapportés au capital déposé du jour (gainsPct) — le cash n'a pas
  // d'équivalent en gains, sa série est masquée et sa pastille désactivée.
  const pct = unit === 'pct';
  const series = useMemo(() => {
    const list = [];
    if (chart.total) list.push({ key: 'total', name: 'Total', stroke: 'var(--text-primary)', chipColor: 'var(--text-primary)', dash: false,
      data: data.map(s => (pct ? gainsPct(s.equity, s.netDeposits) : s.equity)) });
    if (chart.cash && !pct) list.push({ key: 'cash', name: 'Cash dispo', stroke: 'var(--text-muted)', chipColor: 'var(--text-muted)', dash: true, data: data.map(s => s.cash) });
    for (const a of accounts) {
      if (chart.accts[a.id]) list.push({ key: a.id, name: a.name, stroke: idVar(a.color), chipColor: idVar(a.color), dash: false,
        data: data.map(s => (!s.accounts ? null : pct ? gainsPct(s.accounts[a.id], s.nd && s.nd[a.id]) : s.accounts[a.id])) });
    }
    return list;
  }, [chart, accounts, data, pct]);

  const labels = useMemo(() => data.map(s => fmtDateShort(s.date)), [data]);
  const hasData = data.length >= 2 && series.length > 0;

  return (
    <div className="panel">
      <div className="panel-head">
        <div className="panel-controls">
          <SegmentedControl size="sm" options={['USDC', '%']} value={unit === 'pct' ? '%' : 'USDC'} onChange={(v) => setUnit(v === '%' ? 'pct' : 'usdc')} />
          <SegmentedControl size="sm" options={RANGES} value={range} onChange={setRange} />
        </div>
      </div>
      <div className="chart-body" ref={bodyRef}>
        <ChartCanvas key={unit + range} series={series} labels={labels} unit={unit} w={w} h={h} hover={hover} setHover={setHover}
          zoomable setHoverX={setHoverX} pctDirect={pct} />
        {!hasData && (
          <div className="chart-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style={{ opacity: 0.5 }}><path d="M3 3v18h18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><path d="M7 14l3-3 3 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" /></svg>
            <span style={{ fontSize: 'var(--text-sm)', maxWidth: 360 }}>
              {accounts.length === 0 ? 'Crée un compte et saisis tes positions (avec leurs dates) pour démarrer.' : 'Reconstruis la courbe depuis ta plus ancienne activité grâce aux cours BTC historiques.'}
            </span>
            {accounts.length > 0 && <Button size="sm" onClick={onBackfill} loading={backfilling}>Reconstruire l’historique</Button>}
          </div>
        )}
        {hasData && hover != null && data[hover] && (
          <div className="chart-tip" style={{ left: Math.min(Math.max(0, (hoverX || 0) * 100), 70) + '%', top: 8 }}>
            <div className="d">{fmtDateShort(data[hover].date)}</div>
            {series.map(se => {
              const val = se.data[hover];             // séries déjà dans l'unité affichée
              if (val == null) return null;
              return <div className="r" key={se.key}><span className="k"><span style={{ width: 8, height: 8, borderRadius: '50%', background: se.chipColor, display: 'inline-block' }} />{se.name}</span><span className="v">{pct ? (val >= 0 ? '+' : MINUS) + Math.abs(val).toFixed(2) + '%' : numFmtSigned(val, 0)}</span></div>;
            })}
          </div>
        )}
      </div>
      <div className="chips">
        <SeriesChip label="Total" color="var(--text-primary)" active={chart.total} onChange={() => toggleSeries('total')} />
        <SeriesChip label="Cash dispo" color="var(--text-muted)" active={chart.cash && !pct} onChange={() => toggleSeries('cash')}
          disabled={pct} title={pct ? 'Le cash n’a pas d’équivalent en % de gains' : undefined} style={pct ? { cursor: 'not-allowed' } : undefined} />
        {accounts.map(a => <SeriesChip key={a.id} label={a.name} color={idVar(a.color)} active={!!chart.accts[a.id]} onChange={() => toggleSeries(a.id)} />)}
      </div>
    </div>
  );
}

/* =============================================================
   GRAPHE D'UN COMPTE — valeur / cash / latent, contrôles LOCAUX
   (réutilise ChartCanvas + useSize ; n'utilise pas EvoChart pour
    ne pas polluer l'unité/plage du graphe principal)
   ============================================================= */
function AccountChart({ acc, color, price, history, priceHistory, onBackfill, backfilling, onPref, onSelectTrade }) {
  const bodyRef = useRef(null);
  const { w, h } = useSize(bodyRef);
  const [hover, setHover] = useState(null);
  const [hoverX, setHoverX] = useState(null);   // fraction écran du point survolé (suit le zoom)
  // Préférences de graphe PORTÉES PAR LE COMPTE (elles survivent au remontage par
  // key={id} à chaque changement d'onglet, et au rechargement). Lecture défensive :
  // champ absent ou valeur inconnue (ex. '7J', propre au graphe HL) → défauts.
  const unit = acc.chartUnit === 'pct' ? 'pct' : 'usdc';
  const range = RANGES.includes(acc.chartRange) ? acc.chartRange : '90J';
  const setUnit = (u) => onPref({ chartUnit: u });
  const setRange = (r) => onPref({ chartRange: r });
  const [shown, setShown] = useState({ equity: true, cash: false, reperes: true, trades: true });

  const data = useMemo(() => {
    if (rangeDays[range] === Infinity) return history;
    const cut = todayStr(new Date(Date.now() - rangeDays[range] * 86400000));
    return history.filter(s => s.date >= cut);
  }, [history, range]);

  // Recalcule l'équité, le cash et les dépôts nets du compte à chaque date (accAt valorise comme buildHistory).
  const rows = useMemo(() => data.map(s => {
    const r = accAt(acc, s.date, priceHistory[s.date]);
    return r.exists ? { equity: r.equity, cash: r.cash, nd: r.netDeposits } : { equity: null, cash: null, nd: null };
  }), [data, acc, priceHistory]);

  // En % : même convention que le graphe global (gainsPct, dépôts neutralisés) — courbe,
  // repères et marqueurs convertis ici puis passés en pctDirect. Cash sans équivalent en %.
  const pct = unit === 'pct';
  const inUnit = (v, nd) => (pct ? gainsPct(v, nd) : v);
  const series = useMemo(() => [
    shown.equity && { key: 'equity', name: 'Valeur', stroke: idVar(color), chipColor: idVar(color), dash: false, data: rows.map(r => inUnit(r.equity, r.nd)) },
    shown.cash && !pct && { key: 'cash', name: 'Cash dispo', stroke: 'var(--text-muted)', chipColor: 'var(--text-muted)', dash: true, data: rows.map(r => r.cash) },
  ].filter(Boolean), [rows, color, shown, pct]);

  // Lignes agrégées TP / SL : niveau d'équité du compte si TOUTES les positions atteignent leur cible.
  const cur = useMemo(() => accAt(acc, todayStr(), price), [acc, price]);
  const fc = useMemo(() => computeForecast([acc], price), [acc, price]);
  const hlines = useMemo(() => {
    if (!shown.reperes || !fc.hasOpen) return [];
    const base = cur.equity - cur.latent;
    // Sans aucun TP saisi, computeForecast retombe sur le latent courant : la ligne « TP »
    // se confondrait avec la valeur actuelle → on ne l'affiche pas.
    return [
      ...(fc.anyTp ? [{ value: inUnit(base + fc.upPnl, cur.netDeposits), label: 'TP', color: 'var(--gain)', soft: 'var(--gain-soft)' }] : []),
      { value: inUnit(base + fc.downPnl, cur.netDeposits), label: 'SL', color: 'var(--loss)', soft: 'var(--loss-soft)' },
    ];
  }, [shown.reperes, fc, cur, pct]);

  // Marqueurs de clôture (TP / SL / Rekt) posés sur la courbe à la date de fermeture,
  // + marqueurs d'ENTRÉE (sous le point) quand « Trades » est actif — numérotés « L#n / S#n »
  // (rang chronologique d'ouverture, stable) et cliquables → la sélection remonte au
  // panneau (onSelectTrade), qui affiche la ligne d'historique du trade sous le graphe.
  const posNum = useMemo(() => {
    const m = new Map();
    (acc.positions || []).slice().sort((a, b) => (a.openedAt || '').localeCompare(b.openedAt || ''))
      .forEach((p, i) => m.set(p.id, i + 1));
    return m;
  }, [acc]);
  const markers = useMemo(() => {
    const out = [];
    for (const p of (acc.positions || [])) {
      const num = (p.side === 'long' ? 'L#' : 'S#') + posNum.get(p.id);
      const closedP = p.status === 'closed';
      const netP = closedP ? posPnl(p, p.exitPrice) - (p.openFee || 0) - (p.closeFee || 0) : null;
      // Entrée antérieure à la plage affichée → pas de marqueur (il se collait au bord gauche,
      // même pour un trade clos avant la plage) ; le filigrane couvre déjà une position à cheval.
      const od = dOf(p.openedAt);
      if (shown.trades && data.length && od >= data[0].date) {
        const oIdx = data.findIndex(s => s.date >= od);
        if (oIdx >= 0 && rows[oIdx] && rows[oIdx].equity != null)
          // Couleur = résultat (comme le filigrane) ; le sens est déjà dans le label L#/S#.
          out.push({ index: oIdx, value: inUnit(rows[oIdx].equity, rows[oIdx].nd), label: num,
                     tone: closedP ? (netP >= 0 ? 'gain' : 'loss') : 'accent', below: true, trade: { p, n: posNum.get(p.id) } });
      }
      if (!shown.reperes || !closedP) continue;
      const idx = data.findIndex(s => s.date === dOf(p.closedAt));
      if (idx < 0 || rows[idx] == null || rows[idx].equity == null) continue;
      const net = netP;
      const expoOpen = safePct(p.margin, equityAtOpen(acc, p));
      const rekt = Math.round(p.exitPrice) === Math.round(posLiqPrice(p)) && expoOpen >= 99.5;
      const hitTp = p.tp != null && Math.round(p.exitPrice) === Math.round(p.tp);
      // Stop touché = SL saisi, ou liquidation à défaut de SL (posStopPrice) — comme le bouton
      // « SL » de la clôture. Sortie manuelle (ni cible ni stop) : pas d'étiquette, le montant
      // suffit (comme les clôtures HL) — avant, tout gain était « TP » et toute perte « SL ».
      const hitSl = Math.round(p.exitPrice) === Math.round(posStopPrice(p));
      const tone = rekt ? 'accent' : ((hitTp || net >= 0) ? 'gain' : 'loss');
      const tag = rekt ? 'Rekt ' : hitTp ? 'TP ' : hitSl ? 'SL ' : '';
      const val = unit === 'pct'
        ? (net >= 0 ? '+' : MINUS) + Math.abs(safePct(net, p.margin)).toFixed(1) + '%'
        : (net >= 0 ? '+' : MINUS) + numFmt(Math.abs(net), 0);
      out.push({ index: idx, value: inUnit(rows[idx].equity, rows[idx].nd), label: num + ' ' + tag + val, tone, trade: { p, n: posNum.get(p.id) } });
    }
    return out;
  }, [shown.reperes, shown.trades, acc, data, rows, unit, posNum]);

  // Filigranes de trades : bande translucide de l'ouverture à la clôture (ou au bord droit).
  const spans = useMemo(() => {
    if (!shown.trades || data.length < 2) return [];
    const n = data.length;
    const frac = (dstr) => {
      if (dstr <= data[0].date) return 0;
      if (dstr >= data[n - 1].date) return 1;
      for (let i = 0; i < n; i++) if (data[i].date >= dstr) return i / (n - 1);
      return 1;
    };
    const out = [];
    for (const p of (acc.positions || [])) {
      const od = dOf(p.openedAt);
      if (!od) continue;
      const closed = p.status === 'closed';
      const f0 = frac(od), f1 = closed ? frac(dOf(p.closedAt) || data[n - 1].date) : 1;
      if (f1 <= 0 || f0 >= 1 || f1 <= f0) continue;
      const net = closed ? posPnl(p, p.exitPrice) - (p.openFee || 0) - (p.closeFee || 0) : 0;
      out.push({ f0, f1, tone: closed ? (net >= 0 ? 'gain' : 'loss') : 'accent' });
    }
    return out;
  }, [shown.trades, acc, data]);

  // Barre verticale du T0 : rien si la date sort de la plage affichée (sinon elle se
  // collerait au bord gauche et laisserait croire que l'historique commence là).
  const vlines = useMemo(() => {
    const t0 = acc.t0 || null;
    const n = data.length;
    if (!t0 || n < 2 || t0 < data[0].date || t0 > data[n - 1].date) return [];
    let i = 0;
    while (i < n - 1 && data[i].date < t0) i++;
    return [{ f: i / (n - 1), label: 'T0', color: 'var(--text-muted)' }];
  }, [acc.t0, data]);

  const labels = useMemo(() => data.map(s => fmtDateShort(s.date)), [data]);
  const hasData = data.length >= 2 && series.length > 0;
  const toggleShown = (k) => setShown(s => ({ ...s, [k]: !s[k] }));

  return (
    <div className="stack">
      <div className="panel-head">
        <div className="panel-controls">
          <SegmentedControl size="sm" options={['USDC', '%']} value={unit === 'pct' ? '%' : 'USDC'} onChange={(v) => setUnit(v === '%' ? 'pct' : 'usdc')} />
          <SegmentedControl size="sm" options={RANGES} value={range} onChange={setRange} />
        </div>
      </div>
      <div className="chart-body" ref={bodyRef}>
        <ChartCanvas key={unit + range} series={series} labels={labels} unit={unit} w={w} h={h} hover={hover} setHover={setHover}
          hlines={hlines} markers={markers} zoomable setHoverX={setHoverX} spans={spans} vlines={vlines}
          onMarkerClick={(mk) => mk.trade && onSelectTrade && onSelectTrade(mk.trade)} pctDirect={pct} />
        {!hasData && (
          <div className="chart-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style={{ opacity: 0.5 }}><path d="M3 3v18h18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><path d="M7 14l3-3 3 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 3" /></svg>
            <span style={{ fontSize: 'var(--text-sm)', maxWidth: 360 }}>
              {(acc.positions || []).length === 0 ? 'Saisis des positions (avec leurs dates) pour démarrer la courbe.' : 'Reconstruis la courbe depuis ta plus ancienne activité grâce aux cours BTC historiques.'}
            </span>
            {onBackfill && <Button size="sm" onClick={onBackfill} loading={backfilling}>Reconstruire l’historique</Button>}
          </div>
        )}
        {hasData && hover != null && data[hover] && (
          <div className="chart-tip" style={{ left: Math.min(Math.max(0, (hoverX || 0) * 100), 70) + '%', top: 8 }}>
            <div className="d">{fmtDateShort(data[hover].date)}</div>
            {series.map(se => {
              const val = se.data[hover];             // séries déjà dans l'unité affichée
              if (val == null) return null;
              return <div className="r" key={se.key}><span className="k"><span style={{ width: 8, height: 8, borderRadius: '50%', background: se.chipColor, display: 'inline-block' }} />{se.name}</span><span className="v">{pct ? (val >= 0 ? '+' : MINUS) + Math.abs(val).toFixed(2) + '%' : numFmtSigned(val, 0)}</span></div>;
            })}
          </div>
        )}
      </div>
      <div className="chips">
        <SeriesChip label="Valeur" color={idVar(color)} active={shown.equity} onChange={() => toggleShown('equity')} />
        <SeriesChip label="Cash dispo" color="var(--text-muted)" active={shown.cash && !pct} onChange={() => toggleShown('cash')}
          disabled={pct} title={pct ? 'Le cash n’a pas d’équivalent en % de gains' : undefined} style={pct ? { cursor: 'not-allowed' } : undefined} />
        <SeriesChip label="Repères" color="var(--text-secondary)" active={shown.reperes} onChange={() => toggleShown('reperes')} />
        <SeriesChip label="Trades" color="var(--text-secondary)" active={shown.trades} onChange={() => toggleShown('trades')} />
      </div>
    </div>
  );
}

/* =============================================================
   FORMULAIRES DE POSITION
   ============================================================= */
function OpenPositionForm({ freeCash, btcPrice, onSubmit, cashless = false, pctMode = false, capitalBasis = 0, hideTitle = false }) {
  const [side, setSide] = useState('long');
  const [margin, setMargin] = useState('');
  const [lev, setLev] = useState('1');
  const [entry, setEntry] = useState(btcPrice ? String(Math.round(btcPrice)) : '');
  const [fee, setFee] = useState('');
  const [openDate, setOpenDate] = useState(todayStr());
  const [tp, setTp] = useState('');
  const [sl, setSl] = useState('');
  const m = parseNum(margin), l = parseNum(lev), e = parseNum(entry), f = parseNum(fee) || 0;
  const basis = pctMode ? capitalBasis : freeCash;
  const marginAbs = pctMode ? Math.min(Math.max(m || 0, 0), capitalBasis) : (m || 0);
  const pct = (basis > 0) ? clampPct((marginAbs / basis) * 100) : 0;
  const netMargin = pctMode ? marginAbs : Math.max(marginAbs - f, 0);
  const cashOut = pctMode ? (marginAbs + f) : marginAbs;
  const ready = (pctMode ? marginAbs > 0 : netMargin > 0) && l != null && l >= 1 && e != null && e > 0;
  const isBackdated = openDate < todayStr();
  const overCash = !cashless && !pctMode && cashOut > freeCash + 1e-9;
  const blockCash = overCash && !isBackdated;
  const valid = ready && !blockCash;
  const qty = ready ? (netMargin * l) / e : 0;
  const liq = ready ? (side === 'long' ? e * (1 - 1 / l) : e * (1 + 1 / l)) : 0;
  const onMarginText = (v) => {
    if (pctMode && capitalBasis > 0) {
      const n = parseNum(v);
      if (n != null && n > capitalBasis) return setMargin(String(capitalBasis));
      if (n != null && n < 0) return setMargin('0');
    }
    setMargin(v);
  };
  const onSlider = (v) => setMargin(String(Math.min(Math.round((clampPct(v) / 100) * basis), Math.floor(basis))));
  const setExpo = (p) => setMargin(String(Math.min(Math.round((p / 100) * basis), Math.floor(basis))));
  const submit = () => {
    const base = { side, leverage: l, entryPrice: e, openFee: f, tp: parseNum(tp), sl: parseNum(sl), openedAt: openDate + 'T12:00:00' };
    onSubmit(pctMode ? { ...base, marginPct: pct } : { ...base, margin: netMargin });
    setMargin(''); setFee(''); setTp(''); setSl('');
  };

  return (
    <div className="stack">
      {hideTitle ? null : <span className="section-title" style={{ fontSize: 'var(--text-md)' }}>Ouvrir une position</span>}

      <>
          <LongShortToggle value={side} onChange={setSide} full />
          <div className="margin-pct">
            <Field label="Marge (USDC)" error={blockCash ? 'Dépasse le cash dispo' : null} hint={overCash && isBackdated ? 'Toléré (trade passé)' : null}>
              <Input numeric invalid={blockCash} value={margin} onChange={ev => onMarginText(ev.target.value)} placeholder="0.00" inputMode="decimal" disabled={pctMode && basis <= 0} />
            </Field>
            <Field label={(pctMode ? 'Part du capital' : 'Exposition') + ' · ' + numFmt(pct, 0) + ' %'}>
              <input type="range" className="range" min="0" max="100" step="1" value={basis > 0 ? pct : 0} disabled={basis <= 0} onChange={ev => onSlider(Number(ev.target.value))} />
            </Field>
          </div>
          {pctMode && <span className="muted">{capitalBasis > 0 ? (numFmt(pct, 1) + ' % du capital · base ' + numFmt(capitalBasis) + ' USDC') : 'Capital disponible nul'}</span>}
          <div className="preset-row">
            {[25, 50, 75, 100].map(p => (
              <button key={p} type="button" className={'preset-chip' + (Math.round(pct) === p ? ' on' : '')} disabled={basis <= 0} onClick={() => setExpo(p)}>{p} %</button>
            ))}
          </div>
          <div className="grid2">
            <Field label="Levier (×)"><Input numeric value={lev} onChange={ev => setLev(ev.target.value)} placeholder="1" inputMode="decimal" /></Field>
            <Field label="Prix d’entrée (USDC)"><Input numeric value={entry} onChange={ev => setEntry(ev.target.value)} placeholder="0" inputMode="decimal" /></Field>
          </div>
          <div className="preset-row">
            {[5, 10, 20, 30].map(p => (
              <button key={p} type="button" className={'preset-chip' + (l === p ? ' on' : '')} onClick={() => setLev(String(p))}>{p}×</button>
            ))}
          </div>
          <div className="grid2">
            <Field label="Date d’ouverture"><Input type="date" value={openDate} max={todayStr()} onChange={ev => setOpenDate(ev.target.value)} /></Field>
            <Field label="Frais d’ouverture" hint="Optionnel"><Input numeric value={fee} onChange={ev => setFee(ev.target.value)} placeholder="0.00" inputMode="decimal" suffix="USDC" /></Field>
          </div>
          <div className="grid2">
            <Field label="Take Profit (USDC)" hint="Optionnel"><Input numeric value={tp} onChange={ev => setTp(ev.target.value)} placeholder="prix cible" inputMode="decimal" /></Field>
            <Field label="Stop Loss (USDC)" hint={ready ? 'Défaut : liquidation ' + numFmt(liq, 0) : 'Optionnel'}><Input numeric value={sl} onChange={ev => setSl(ev.target.value)} placeholder={ready ? numFmt(liq, 0) + ' (liq.)' : 'prix stop'} inputMode="decimal" /></Field>
          </div>
          <div className="derived">
            <div className="d"><span className="k">{pctMode ? 'Coût' : 'Marge nette'}</span><span className="v">{numFmt(pctMode ? (marginAbs + f) : netMargin)} USDC</span></div>
            <div className="d"><span className="k">Quantité</span><span className="v">{numFmt(qty, 6)} BTC</span></div>
            <div className="d"><span className="k">Prix liquidation ≈</span><span className="v">{ready ? numFmt(liq, 0) + ' USDC' : '—'}</span></div>
            <div className="d"><span className="k">Exposition</span><span className="v">{ready ? l + '× ' + (side === 'long' ? 'Long' : 'Short') : '—'}</span></div>
          </div>
          <div className="btn-row">
            <Button variant="primary" disabled={!valid} onClick={submit}>Ouvrir la position</Button>
          </div>
      </>
    </div>
  );
}

function ClosePositionForm({ pos, btcPrice, onConfirm, onCancel }) {
  const [exit, setExit] = useState(btcPrice ? String(Math.round(btcPrice)) : '');
  const [fee, setFee] = useState('');
  const [closeDate, setCloseDate] = useState(todayStr());
  const minDate = dOf(pos.openedAt) || undefined;
  const e = parseNum(exit), f = parseNum(fee) || 0;
  const badDate = minDate && closeDate < minDate;
  const valid = e != null && e > 0 && !badDate;
  const pnl = (e != null && e > 0) ? posPnl({ ...pos }, e) - f : 0;
  return (
    <div className="derived" style={{ marginTop: 10 }}>
      <div>
        <Field label="Prix de sortie (USDC)"><Input numeric value={exit} onChange={ev => setExit(ev.target.value)} inputMode="decimal" autoFocus /></Field>
        <div className="preset-row" style={{ marginTop: 6 }}>
          {pos.tp != null && <button type="button" className="preset-chip" onClick={() => setExit(String(pos.tp))}>TP</button>}
          <button type="button" className="preset-chip" onClick={() => setExit(String(pos.sl != null ? pos.sl : Math.round(posLiqPrice(pos))))}>SL</button>
        </div>
      </div>
      <Field label="Frais de clôture (USDC)"><Input numeric value={fee} onChange={ev => setFee(ev.target.value)} placeholder="0.00" inputMode="decimal" /></Field>
      <Field label="Date de clôture" error={badDate ? 'Antérieure à l’ouverture' : null}>
        <Input type="date" invalid={badDate} value={closeDate} min={minDate} max={todayStr()} onChange={ev => setCloseDate(ev.target.value)} />
      </Field>
      <div className="d" style={{ alignSelf: 'center' }}><span className="k">Résultat net</span>
        <span className="v" style={{ color: semColor(pnl) }}>{(e != null && e > 0) ? (pnl >= 0 ? '+' : MINUS) + numFmt(pnl) + ' USDC' : '—'}</span>
      </div>
      <div className="btn-row" style={{ gridColumn: '1 / -1', alignSelf: 'center' }}>
        <Button size="sm" onClick={onCancel}>Annuler</Button>
        <Button size="sm" variant="primary" disabled={!valid} onClick={() => onConfirm({ exitPrice: e, closeFee: f, closedAt: closeDate + 'T12:00:00' })}>Confirmer</Button>
      </div>
    </div>
  );
}

function EditPositionForm({ pos, onSave, onCancel, pctMode = false, capitalBasis = 0 }) {
  const initAbs = pctMode ? ((pos.marginPct || 0) / 100 * capitalBasis) : pos.margin;
  const [side, setSide] = useState(pos.side);
  const [margin, setMargin] = useState(initAbs != null ? String(Math.round(initAbs * 100) / 100) : '');
  const [lev, setLev] = useState(String(pos.leverage));
  const [entry, setEntry] = useState(String(pos.entryPrice));
  const [fee, setFee] = useState(pos.openFee != null ? String(pos.openFee) : '');
  const [tp, setTp] = useState(pos.tp != null ? String(pos.tp) : '');
  const [sl, setSl] = useState(pos.sl != null ? String(pos.sl) : '');
  const m = parseNum(margin), l = parseNum(lev), e = parseNum(entry), f = parseNum(fee) || 0;
  const marginAbs = pctMode ? Math.min(Math.max(m || 0, 0), capitalBasis) : (m || 0);
  const pct = (pctMode && capitalBasis > 0) ? clampPct((marginAbs / capitalBasis) * 100) : 0;
  const ready = (pctMode ? marginAbs > 0 : (m != null && m > 0)) && l != null && l >= 1 && e != null && e > 0;
  const liq = ready ? (side === 'long' ? e * (1 - 1 / l) : e * (1 + 1 / l)) : 0;
  const onMarginText = (v) => {
    if (pctMode && capitalBasis > 0) {
      const n = parseNum(v);
      if (n != null && n > capitalBasis) return setMargin(String(capitalBasis));
      if (n != null && n < 0) return setMargin('0');
    }
    setMargin(v);
  };
  const onSlider = (v) => setMargin(String(Math.round((clampPct(v) / 100) * capitalBasis)));
  const save = () => {
    const base = { side, leverage: l, entryPrice: e, openFee: f, tp: parseNum(tp), sl: parseNum(sl) };
    onSave(pctMode ? { ...base, marginPct: pct } : { ...base, margin: m });
  };
  return (
    <div className="stack" style={{ padding: 'var(--space-4)', background: 'var(--surface-canvas)', border: '1px solid var(--hairline)', borderRadius: 'var(--radius-md)', marginTop: 10 }}>
      <LongShortToggle value={side} onChange={setSide} full size="sm" />
      {pctMode ? (
        <>
          <div className="margin-pct">
            <Field label="Marge (USDC)"><Input numeric value={margin} onChange={ev => onMarginText(ev.target.value)} inputMode="decimal" disabled={capitalBasis <= 0} /></Field>
            <Field label={'Part du capital · ' + numFmt(pct, 0) + ' %'}><input type="range" className="range" min="0" max="100" step="1" value={capitalBasis > 0 ? pct : 0} disabled={capitalBasis <= 0} onChange={ev => onSlider(Number(ev.target.value))} /></Field>
          </div>
          <span className="muted">{capitalBasis > 0 ? (numFmt(pct, 1) + ' % · base ' + numFmt(capitalBasis) + ' USDC') : 'Capital disponible nul'}</span>
        </>
      ) : (
        <Field label="Marge (USDC)"><Input numeric value={margin} onChange={ev => setMargin(ev.target.value)} inputMode="decimal" /></Field>
      )}
      <div className="grid3">
        <Field label="Levier (×)"><Input numeric value={lev} onChange={ev => setLev(ev.target.value)} inputMode="decimal" /></Field>
        <Field label="Prix d’entrée"><Input numeric value={entry} onChange={ev => setEntry(ev.target.value)} inputMode="decimal" /></Field>
        <Field label="Frais ouverture"><Input numeric value={fee} onChange={ev => setFee(ev.target.value)} placeholder="0.00" inputMode="decimal" /></Field>
      </div>
      <div className="grid2">

// Ligne de position maison (atomes du DS) : sens + levier EMPILÉS à gauche
// (colonne étroite) → anneau d'allocation → description → emplacement droit.
// Sert aux lignes CLÔTURÉES et aux simulations ; les ouvertes passent par OpenPosRow.
/* `levTitle`/`allocTitle` : infobulles optionnelles. Un trade HL clos ne connaît souvent
   ni son levier ni sa marge d'alors — les valeurs affichées sont alors reconstituées, et
   la ligne doit pouvoir le dire sans changer de gabarit. */
// Texte d'une ligne de position découpé aux séparateurs « · » et « @ » : sur écran étroit
// la ligne passe à la ligne ENTRE deux segments, jamais au milieu d'un montant (« SL /
// 78,000 »). Les lignes non textuelles (fragments JSX) passent telles quelles.
function lineSegs(line) {
  if (typeof line !== 'string') return line;
  return line.split(/( · | @ )/).map((s, i) => (i % 2 ? s : <span key={i} className="seg">{s}</span>));
}

// Gabarit en classes (app.css .posrow*) : sur téléphone, la grille passe à deux rangées.

/* Mise en forme minimale des notes — MARQUEURS TEXTE, jamais de HTML stocké ni injecté :
   **gras**, *italique*, __souligné__, ligne commençant par « - » = puce. Une note sans
   marqueurs s'affiche à l'identique : le format est rétro-compatible par construction. */
function noteSpans(line) {
  const out = [];
  const re = /\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\n]+)\*/g;
  let last = 0, m, k = 0;
  while ((m = re.exec(line))) {
    if (m.index > last) out.push(line.slice(last, m.index));
    if (m[1] != null) out.push(<strong key={k++}>{m[1]}</strong>);
    else if (m[2] != null) out.push(<u key={k++}>{m[2]}</u>);
    else out.push(<em key={k++}>{m[3]}</em>);
    last = m.index + m[0].length;
  }
  if (last < line.length) out.push(line.slice(last));
  return out;
}
function NoteBody({ text }) {
  // Lignes « - … » consécutives regroupées en une seule liste à puces.
  const blocks = [];
  let bullets = null;
  for (const line of String(text || '').split('\n')) {
    if (/^- /.test(line)) { (bullets || (bullets = [])).push(line.slice(2)); continue; }
    if (bullets) { blocks.push({ ul: bullets }); bullets = null; }
    blocks.push({ line });
  }
  if (bullets) blocks.push({ ul: bullets });
  return (
    <>
      {blocks.map((b, i) => b.ul
        ? <ul key={i}>{b.ul.map((li, j) => <li key={j}>{noteSpans(li)}</li>)}</ul>
        : <div key={i}>{b.line === '' ? ' ' : noteSpans(b.line)}</div>)}
    </>
  );
}

/* Éditeur de note de trade (réutilise le textarea des Stratégies) ; note vide = suppression.
   Barre de mise en forme : insère les marqueurs autour de la sélection du textarea puis
   restaure focus et sélection — le texte reste brut, l'aperçu se fait à l'enregistrement. */
function NoteEditor({ value, onSave, onCancel, requireText = false }) {
  const [text, setText] = useState(value || '');
  const taRef = useRef(null);
  const wrapSel = (before, after) => {
    const ta = taRef.current; if (!ta) return;
    const a = ta.selectionStart, b = ta.selectionEnd;
    setText(t => t.slice(0, a) + before + t.slice(a, b) + after + t.slice(b));
    requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(a + before.length, b + before.length); });
  };
  const bulletSel = () => {
    const ta = taRef.current; if (!ta) return;
    const a = ta.selectionStart, b = ta.selectionEnd;
    // Étend aux lignes entières couvertes par la sélection, préfixe chacune de « - ».
    const start = text.lastIndexOf('\n', a - 1) + 1;
    const endNl = text.indexOf('\n', b);
    const end = endNl < 0 ? text.length : endNl;
    const lines = text.slice(start, end).split('\n').map(l => /^- /.test(l) ? l : '- ' + l);
    const next = text.slice(0, start) + lines.join('\n') + text.slice(end);
    setText(next);
    requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(start, start + lines.join('\n').length); });
  };
  return (
    <div className="pos-note-edit">
      <div className="note-toolbar">
        <button type="button" title="Gras — **texte**" style={{ fontWeight: 700 }} onClick={() => wrapSel('**', '**')}>G</button>
        <button type="button" title="Italique — *texte*" style={{ fontStyle: 'italic' }} onClick={() => wrapSel('*', '*')}>I</button>
        <button type="button" title="Souligné — __texte__" style={{ textDecoration: 'underline' }} onClick={() => wrapSel('__', '__')}>S</button>
        <button type="button" title="Puces — « - » en début de ligne" onClick={bulletSel}>•</button>
      </div>
      <textarea ref={taRef} className="strat-input" value={text} rows={4} placeholder="Note de trade…" autoFocus onChange={e => setText(e.target.value)} />
      <div className="btn-row">
        <Button size="sm" onClick={onCancel}>Annuler</Button>
        <Button size="sm" variant="primary" disabled={requireText && !text.trim()} onClick={() => onSave(text.trim())}>Enregistrer</Button>
      </div>
    </div>
  );
}
/* Affichage de la note sous une ligne de position (marqueurs interprétés par NoteBody).
   `shared` : variante note PARTAGÉE — pas d'icône, le filet en RAYURES de 6px (une
   par portefeuille où la note est attachée, `colors` = snColors, repli accent) est
   le seul marqueur. */
function PosNote({ text, shared = false, colors = [] }) {
  return <div className={'pos-note' + (shared ? ' shared' : '')} title={shared ? 'Note partagée — modifiée partout où elle est attachée' : undefined}>
    {shared
      ? <span className="pos-note-stripes">
          {(colors.length ? colors : [null]).map((c, i) => <i key={i} style={{ background: c ? idVar(c) : 'var(--accent)' }} />)}
        </span>
      : <INote />}
    <span className="pos-note-text" style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}><NoteBody text={text} /></span>
  </div>;
}

/* Icône « lien » + menu des notes partagées d'une ligne de position. Générique aux
   trois familles : la ligne fournit la référence courante et des callbacks —
   onAttach(idOuNull) (null = détacher, le setter de la famille fait `delete`),
   onNew/onEditText (la ligne rend le NoteEditor sous elle, montage conditionnel :
   le texte est lu au montage, donc jamais périmé à l'ouverture), onClearLocal
   (transformation note locale → partagée : créer + attacher + vider la locale).
   stopPropagation sur le wrap : la ligne HL historique est cliquable. */
function SnoteControl({ state, update, snoteId, localNote, onAttach, onClearLocal, onNew, onEditText, disabled, disabledTitle }) {
  const [open, setOpen] = useState(false);
  const wrap = useRef(null);
  useEffect(() => {
    const h = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const notes = snList(state).slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const preview = (t) => { const l = String(t || '').split('\n')[0]; return l.length > 40 ? l.slice(0, 40) + '…' : l; };
  const convert = () => { setOpen(false); const id = snCreate(update, localNote); onAttach(id); onClearLocal(); };
  return (
    <span className="menu-wrap" ref={wrap} onClick={(e) => e.stopPropagation()}>
      <IconButton size="sm" label="Note partagée" active={!!snoteId} disabled={disabled}
        title={disabled ? disabledTitle : (snoteId ? 'Note partagée attachée' : 'Attacher une note partagée')}
        onClick={() => setOpen(o => !o)}><ILink /></IconButton>
      {open && (
        <div className="menu snote-menu">
          {snoteId && <>
            <button className="menu-item" onClick={() => { setOpen(false); onEditText(); }}>
              <span>Éditer le texte</span><span className="meta"><IEdit /></span>
            </button>
            <button className="menu-item" onClick={() => { setOpen(false); onAttach(null); }}>
              <span>Détacher de cette position</span><span className="meta"><IXmark /></span>
            </button>
            <div className="menu-sep" />
          </>}
          <button className="menu-item" onClick={() => { setOpen(false); onNew(); }}>
            <span>Nouvelle note partagée</span><span className="meta">+</span>
          </button>
          {!!localNote && !snoteId && (
            <button className="menu-item" onClick={convert}>
              <span>Transformer la note locale en note partagée</span>
            </button>
          )}
          {notes.length > 0 && <>
            <div className="menu-sep" />
            <div className="menu-label">Attacher une note existante</div>
            <div className="snote-menu-list">
              {notes.map(n => (
                <button key={n.id} className={'menu-item' + (n.id === snoteId ? ' on' : '')}
                  onClick={() => { setOpen(false); onAttach(n.id); }}>
                  <span className="snote-preview">{preview(n.text)}</span>
                  <span className="meta">{fmtDateShort(dOf(n.at))}</span>
                </button>
              ))}
            </div>
          </>}
        </div>
      )}
    </span>
  );
}

/* En-tête repliable de sous-formulaire (chevron à droite ; titre collé au chevron quand replié,
   migre à gauche quand déplié). Partagé par « Ouvrir une position » et « Nouvelle stratégie ». */
function CollapsibleHeader({ title, open, onToggle }) {
  return (
    <button type="button" onClick={onToggle}
      style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-2)', justifyContent: open ? 'space-between' : 'flex-end', background: 'transparent', border: 'none', padding: 0, cursor: 'pointer', color: 'var(--text-primary)' }}>
      <span className="section-title" style={{ fontSize: 'var(--text-sm)' }}>{title}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{ transform: open ? 'none' : 'rotate(-90deg)', color: 'var(--text-secondary)' }}><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
    </button>

}

function PositionRowView({ pos, price, color, capitalBasis, onClose, onEdit, onDelete, unit, onToggleUnit, state, update, onSetSnote }) {
  const [mode, setMode] = useState(null);
  const live = price != null ? posPnlOpen(pos, price) : 0;
  const pct = safePct(live, pos.margin);
  const slShown = pos.sl != null ? numFmt(pos.sl, 0) : numFmt(posLiqPrice(pos), 0) + ' (liq)';
  const alloc = safePct(pos.margin, capitalBasis);
  const sn = snGet(state, pos.snoteId);
  return (
    <div>
      <OpenPosRow side={pos.side} leverage={pos.leverage} alloc={alloc} color={color}
        line1={`${numFmt(pos.margin)} USDC @ ${numFmt(pos.entryPrice, 0)}`}
        line2={`${numFmt(posQuantity(pos), 4)} BTC · TP ${pos.tp != null ? numFmt(pos.tp, 0) : '—'} · SL ${slShown}`}
        now={pos.margin + live} latent={live} latentPct={pct}
        tpVal={pos.tp != null ? pos.margin + posPnl(pos, pos.tp) : null}
        slVal={pos.margin + posPnl(pos, posStopPrice(pos))} slIsLiq={pos.sl == null}
        unit={unit} onToggleUnit={onToggleUnit}
        actions={<>
          <IconButton size="sm" label="Note" active={!!pos.note} onClick={() => setMode(x => x === 'note' ? null : 'note')}><INote /></IconButton>
          <SnoteControl state={state} update={update} snoteId={pos.snoteId || null} localNote={pos.note || null}
            onAttach={onSetSnote} onClearLocal={() => onEdit({ note: '' })}
            onNew={() => setMode('snote-new')} onEditText={() => setMode('snote-edit')} />
          <IconButton size="sm" label="Éditer" onClick={() => setMode(x => x === 'edit' ? null : 'edit')}><IEdit /></IconButton>
          <IconButton size="sm" label="Fermer" onClick={() => setMode(x => x === 'close' ? null : 'close')}><IXmark /></IconButton>
          <IconButton size="sm" label="Supprimer" onClick={onDelete}><ITrash /></IconButton>
        </>} />
      {mode !== 'snote-edit' && sn && <PosNote text={sn.text} shared colors={snColors(state, sn.id)} />}
      {mode !== 'note' && pos.note && <PosNote text={pos.note} />}
      {mode === 'note' && <NoteEditor value={pos.note} onSave={(t) => { onEdit({ note: t }); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-new' && <NoteEditor requireText value="" onSave={(t) => { if (t) onSetSnote(snCreate(update, t)); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-edit' && sn && <NoteEditor requireText value={sn.text} onSave={(t) => { snSetText(update, sn.id, t); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'edit' && <EditPositionForm pos={pos} onCancel={() => setMode(null)} onSave={(d) => { onEdit(d); setMode(null); }} />}
      {mode === 'close' && <ClosePositionForm pos={pos} btcPrice={price} onCancel={() => setMode(null)} onConfirm={(d) => { onClose(d); setMode(null); }} />}
    </div>
  );
}

/* Ligne d'historique (position clôturée) + éditeur de note inline */
function ClosedPositionRow({ pos, acc, onEditNote, onDelete, state, update, onSetSnote }) {
  const [mode, setMode] = useState(null);
  const res = posPnl(pos, pos.exitPrice) - (pos.openFee || 0) - (pos.closeFee || 0);
  const expoOpen = safePct(pos.margin, equityAtOpen(acc, pos));
  const rekt = Math.round(pos.exitPrice) === Math.round(posLiqPrice(pos)) && expoOpen >= 99.5;
  const sn = snGet(state, pos.snoteId);
  return (
    <div>
      <PosRow side={pos.side} leverage={pos.leverage} alloc={expoOpen} allocColor={acc.color}
        line1={`${numFmt(pos.margin)} USDC · ${numFmt(pos.entryPrice, 0)} → ${numFmt(pos.exitPrice, 0)}`}
        line2={`${pos.closedAt ? new Date(pos.closedAt).toLocaleDateString('fr-FR') : ''} · frais ${numFmt((pos.openFee || 0) + (pos.closeFee || 0))}`}
        center={rekt ? <Badge tone="accent" size="sm">Rekt</Badge> : null}
        right={<>
          <PnLIndicator value={res} percent={safePct(res, pos.margin)} size="sm" />
          <IconButton size="sm" label="Note" active={!!pos.note} onClick={() => setMode(m => m === 'note' ? null : 'note')}><INote /></IconButton>
          <SnoteControl state={state} update={update} snoteId={pos.snoteId || null} localNote={pos.note || null}
            onAttach={onSetSnote} onClearLocal={() => onEditNote('')}
            onNew={() => setMode('snote-new')} onEditText={() => setMode('snote-edit')} />
          <IconButton size="sm" label="Supprimer" onClick={onDelete}><ITrash /></IconButton>
        </>} />
      {mode !== 'snote-edit' && sn && <PosNote text={sn.text} shared colors={snColors(state, sn.id)} />}
      {mode !== 'note' && pos.note && <PosNote text={pos.note} />}
      {mode === 'note' && <NoteEditor value={pos.note} onSave={(t) => { onEditNote(t); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-new' && <NoteEditor requireText value="" onSave={(t) => { if (t) onSetSnote(snCreate(update, t)); setMode(null); }} onCancel={() => setMode(null)} />}
      {mode === 'snote-edit' && sn && <NoteEditor requireText value={sn.text} onSave={(t) => { snSetText(update, sn.id, t); setMode(null); }} onCancel={() => setMode(null)} />}
    </div>
  );
}

/* =============================================================
   MODALE — CRÉATION DE COMPTE
   ============================================================= */
function CreateAccountModal({ usedColors, onClose, onCreate, title = 'Nouveau compte', allowHl = false, hlAddresses = [] }) {
  useEsc(onClose);
  const used = usedColors.map(dsColor);
  const firstFree = ID_ORDER.find(k => !used.includes(k)) || ID_ORDER[0];
  const [src, setSrc] = useState('manual');               // 'manual' | 'hl'
  const [name, setName] = useState('');
  const [color, setColor] = useState(firstFree);
  const [date, setDate] = useState(todayStr());
  const [cash, setCash] = useState('');
  const [addr, setAddr] = useState('');
  const [preview, setPreview] = useState(null);           // {loading} | {equity, nPos} | {error}
  const cashNum = parseNum(cash);
  const addrNorm = addr.trim().toLowerCase();
  const addrValid = HL_ADDR_RE.test(addrNorm);
  const addrDupe = hlAddresses.map(a => (a || '').toLowerCase()).includes(addrNorm);
  const isHl = allowHl && src === 'hl';
  const checkAddr = async () => {
    setPreview({ loading: true });
    try {
      const [ch, spot] = await Promise.all([
        hlFetch({ type: 'clearinghouseState', user: addrNorm }),
        hlFetch({ type: 'spotClearinghouseState', user: addrNorm }),   // l'USDC spot compte dans l'équity
      ]);
      const snap = mapHlSnapshot(ch, [], spot);
      setPreview({ equity: snap.equity, nPos: snap.positions.length });
      if (!name.trim()) setName('HL ' + hlShortAddr(addrNorm));   // nom par défaut depuis l'adresse
    } catch (e) { setPreview({ error: e.message }); }
  };
  const valid = isHl
    ? (name.trim() && addrValid && !addrDupe && preview && preview.equity != null)
    : (name.trim() && cashNum != null && cashNum >= 0);
  const create = () => onCreate(isHl
    ? { name: name.trim(), color, createdAt: todayStr(), source: 'hyperliquid', address: addrNorm,
        hl: { lastSync: null, lastFull: null, error: null, snapshot: null, equityHistory: {}, pnlHistory: {}, ledger: [], fills: [], spotNote: null } }
    : { name: name.trim(), color, createdAt: date, openingCash: cashNum });
  return (
    <Modal open title={title} width="narrow" onClose={onClose}
      footer={<>
        <Button onClick={onClose}>Annuler</Button>
        <Button variant="primary" disabled={!valid} onClick={create}>{isHl ? 'Suivre le wallet' : 'Créer le compte'}</Button>
      </>}>
      <div className="stack">
        {allowHl && (
          <SegmentedControl full options={['Manuel', 'Wallet Hyperliquid']}
            value={src === 'hl' ? 'Wallet Hyperliquid' : 'Manuel'}
            onChange={(v) => { setSrc(v === 'Wallet Hyperliquid' ? 'hl' : 'manual'); setPreview(null); }} />
        )}
        {isHl && (
          <>
            <Field label="Adresse du wallet (0x…)"
              error={addr && !addrValid ? 'Adresse invalide (0x + 40 caractères hexadécimaux)' : (addrDupe ? 'Adresse déjà suivie' : null)}>
              <Input value={addr} invalid={!!addr && (!addrValid || addrDupe)} placeholder="0x0000…"
                onChange={e => { setAddr(e.target.value); setPreview(null); }} autoFocus spellCheck={false} />
            </Field>
            <div className="btn-row" style={{ justifyContent: 'flex-start' }}>
              <Button size="sm" disabled={!addrValid || addrDupe || (preview && preview.loading)}
                loading={!!(preview && preview.loading)} onClick={checkAddr}>Vérifier l’adresse</Button>
              {preview && preview.equity != null && (
                <span className="muted" style={{ alignSelf: 'center' }}>
                  Équity <MoneyValue value={preview.equity} size="sm" /> · {preview.nPos} position{preview.nPos > 1 ? 's' : ''}
                </span>
              )}
              {preview && preview.error && <span className="hl-error" style={{ alignSelf: 'center' }}>{preview.error}</span>}
            </div>
          </>
        )}
        <Field label={isHl ? 'Nom du compte suivi' : 'Nom du compte'}>
          <Input value={name} onChange={e => setName(e.target.value)} placeholder={isHl ? 'Ex. Wallet HL' : 'Ex. Compte Bybit'} autoFocus={!isHl} />
        </Field>
        <Field label="Couleur">
          <div style={{ display: 'flex', gap: 'var(--space-3)', flexWrap: 'wrap' }}>
            {ID_ORDER.map(k => (
              <button key={k} type="button" onClick={() => setColor(k)} title={k}
                style={{ width: 30, height: 30, borderRadius: '50%', cursor: 'pointer', background: ID_VARS[k], border: color === k ? '2px solid var(--text-primary)' : '2px solid transparent', opacity: used.includes(k) && color !== k ? 0.4 : 1, padding: 0 }} />
            ))}
          </div>
        </Field>
        {!isHl && (
          <div className="grid2">
            <Field label="Date de création"><Input type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Cash à l’ouverture"><Input numeric value={cash} onChange={e => setCash(e.target.value)} placeholder="0.00" inputMode="decimal" suffix="USDC" /></Field>
          </div>
        )}
        {isHl && <span className="muted">Compte en lecture seule : positions, équity et historique sont synchronisés depuis Hyperliquid (aucune clé privée requise).</span>}
      </div>
    </Modal>
  );
}

/* =============================================================
   PANNEAU — GESTION DE COMPTE EN LIGNE
   ============================================================= */
/* Section repliable (accordéon) — chevron + dépliement, en-tête optionnellement résumé à droite */
function Section({ title, right, open, onToggle, children }) {
  return (
    <div className="acc-section">
      <button type="button" className="acc-head" aria-expanded={open} onClick={onToggle}>
        <svg className={'chev' + (open ? '' : ' closed')} width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
        <span className="acc-title">{title}</span>
        {right != null && <span className="acc-right">{right}</span>}
      </button>
      {open && <div className="acc-body stack">{children}</div>}
    </div>
  );
}

/* Ligne de stratégie (note datée) — édition inline façon PositionRowView */
function StrategyRow({ strat, onEdit, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState(strat.text);
  if (editing) {
    return (
      <div className="strat-row editing">
        <textarea className="strat-input" value={text} rows={3} onChange={e => setText(e.target.value)} autoFocus />
        <div className="btn-row">
          <Button size="sm" onClick={() => { setText(strat.text); setEditing(false); }}>Annuler</Button>
          <Button size="sm" variant="primary" disabled={!text.trim()} onClick={() => { onEdit(text.trim()); setEditing(false); }}>Enregistrer</Button>
        </div>
      </div>
    );
  }
  return (
    <div className="strat-row">
      <div className="strat-main">
        <span className="muted strat-date">{fmtDateShort(dOf(strat.at))}</span>
        <span className="strat-text" style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{strat.text}</span>
      </div>
      <div className="strat-actions">
        <IconButton size="sm" label="Éditer" onClick={() => setEditing(true)}><IEdit /></IconButton>
        <IconButton size="sm" label="Supprimer" onClick={onDelete}><ITrash /></IconButton>
      </div>
    </div>
  );
}

function AccountPanel({ acc, price, update, usedColors, history, priceHistory, onBackfill, backfilling, state }) {
  const [openSec, setOpenSec] = useState({ tresorerie: false, ouvertes: true, graphique: true, strategies: false, historique: false });
  const toggleSec = (k) => setOpenSec(s => ({ ...s, [k]: !s[k] }));
  const [editing, setEditing] = useState(false);
  const [t0Editing, setT0Editing] = useState(false);
  const [pineOpen, setPineOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const menuRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const [dep, setDep] = useState('');
  const [depDate, setDepDate] = useState(todayStr());
  const [wd, setWd] = useState('');
  const [wdDate, setWdDate] = useState(todayStr());
  const [strat, setStrat] = useState('');
  const [stratFormOpen, setStratFormOpen] = useState(false); // formulaire « Nouvelle stratégie » replié par défaut
  const [posFormOpen, setPosFormOpen] = useState(false); // formulaire « Ouvrir une position » replié par défaut
  const [unit, setUnit] = useState('usdc');             // bascule du bandeau (Réalisé + Win rate)
  const toggleUnit = () => setUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // Bascule du bloc Latent des lignes de position — partagée par TOUTES les lignes du
  // panneau, indépendante de celle du bandeau (latent en % de la marge, réalisé en % du capital).
  const [posUnit, setPosUnit] = useState('usdc');
  const togglePosUnit = () => setPosUnit(u => u === 'usdc' ? 'pct' : 'usdc');
  // Trade sélectionné depuis un repère du graphe — on stocke l'ID (pas la copie du
  // clic) : la ligne est re-résolue à chaque rendu, donc jamais de note périmée.
  const [chartTrade, setChartTrade] = useState(null);   // { pid, n } | null
  const st = accNow(acc, price, priceHistory);          // flux re-basés sur acc.t0 s'il existe
  const free = st.cash, equity = st.equity, latent = st.latent, realized = st.realized;
  const fc = computeForecast([acc], price);
  // Projections = VALEUR que prendrait le compte si toutes les cibles étaient touchées :
  // équity purgée du latent courant (absolu, d'où le + t0Latent), plus le P&L aux cibles.
  // Même grandeur que les repères TP/SL du graphe de compte — pas un écart à la base.
  const eqNoLatent = equity - (latent + st.t0Latent);
  const valTp = eqNoLatent + fc.upPnl, valSl = eqNoLatent + fc.downPnl;
  const open = (acc.positions || []).filter(p => p.status === 'open');
  const closed = (acc.positions || []).filter(p => p.status === 'closed').sort((a, b) => (b.closedAt || '').localeCompare(a.closedAt || ''));
  const ws = accWinStats(acc, state);

  const mutateAcc = (fn) => update(s => { const a = s.accounts.find(x => x.id === acc.id); if (a) fn(a); });
  const addPosition = (d) => mutateAcc(a => { a.positions.push({ id: uid(), status: 'open', openedAt: new Date().toISOString(), ...d }); });
  const closePosition = (pid, d) => mutateAcc(a => { const p = a.positions.find(x => x.id === pid); if (p) { p.status = 'closed'; p.exitPrice = d.exitPrice; p.closeFee = d.closeFee; p.closedAt = d.closedAt || new Date().toISOString(); } });
  const editPosition = (pid, d) => mutateAcc(a => { const p = a.positions.find(x => x.id === pid); if (p) Object.assign(p, d); });
  // Référence de note partagée — setter dédié : editPosition (Object.assign) ne
  // sait pas retirer un champ, et la convention est delete, jamais null.
  const setPosSnote = (pid, id) => mutateAcc(a => { const p = a.positions.find(x => x.id === pid); if (p) { if (id) p.snoteId = id; else delete p.snoteId; } });
  const deletePosition = (pid) => { if (confirm('Supprimer cette position ? (correction d’erreur de saisie)')) mutateAcc(a => { a.positions = a.positions.filter(x => x.id !== pid); }); };
  const doDeposit = () => { const v = parseNum(dep); if (v && v > 0) { mutateAcc(a => a.cashflows.push({ id: uid(), type: 'deposit', amount: v, at: depDate + 'T12:00:00' })); setDep(''); } };
  const doWithdraw = () => { const v = parseNum(wd); if (v && v > 0 && v <= free + 1e-9) { mutateAcc(a => a.cashflows.push({ id: uid(), type: 'withdraw', amount: v, at: wdDate + 'T12:00:00' })); setWd(''); } };
