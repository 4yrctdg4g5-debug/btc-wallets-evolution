const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ── Composants du design system ────────────────────────────────────────
const DS = window.BTCWalletsDesignSystem_4fe162 || {};
const {
  MoneyValue, PnLIndicator, ColorDot, AllocationRing, Badge, LeverageBadge, StatusDot,

/* =============================================================
   CONSTANTES
   ============================================================= */
const MINUS = '−';
const STORAGE_KEY = 'bwe.state.v1';
const OWNER_KEY = 'bwe.owner.v1';             // bail d'écriture : un seul onglet persiste
const BROKEN_PREFIX = 'bwe.state.broken.';    // quarantaine d'un document illisible
const JOURNAL_BACKUP_KEY = 'bwe.journal.backup.v1';   // saisies du journal, clé séparée
const OWNER_RENEW_MS = 20 * 1000;             // ré-estampillage du bail
const STALE_MS = 5 * 60 * 1000;
const AUTO_REFRESH_MS = 60 * 1000;
// Au-delà, le bail est réputé abandonné : 3 renouvellements manqués (60 s). Une page tuée
// sans événement (appli fermée depuis le sélecteur du téléphone) bloquait l'onglet suivant
// 3 min avec l'ancien seuil. Sans risque : persist revérifie le bail à chaque écriture, et
// l'onglet qui reprend le bail relit d'abord le document (tick d'App → resync).
const OWNER_LEASE_MS = 3 * OWNER_RENEW_MS;

const HL_FULL_SYNC_MS = 10 * 60 * 1000;     // synchro complète (portfolio/fills/ledger) au plus toutes les 10 min
const HL_ADDR_RE = /^0x[0-9a-fA-F]{40}$/;
// Vues de premier niveau (hors onglets de simulation, identifiés par leur id).
// migrateSimTabs remet `settings.view` à 'live' pour toute valeur hors de cette liste.
// L'ex-vue 'journal' (onglet supprimé le 2026-07-29) est re-normalisée vers 'live'
// par la migration de loadState — le journal vit dans la colonne KPI de la vue Live.
const ROOT_VIEWS = ['live'];

// Palette d'identité du design system (couleurs froides), + variables CSS.
const ID_ORDER = ['blue', 'cyan', 'violet', 'fuchsia', 'magenta', 'slate'];
const ID_VARS = {
  blue: 'var(--c-id-blue)', cyan: 'var(--c-id-cyan)', violet: 'var(--c-id-violet)',
  fuchsia: 'var(--c-id-fuchsia)', magenta: 'var(--c-id-magenta)', slate: 'var(--c-id-slate)',
};
// Migration des anciens noms de couleur (brutalist) vers la palette DS.
const COLOR_MIGRATION = { blue: 'blue', orange: 'cyan', violet: 'violet', teal: 'slate', pink: 'magenta', red: 'fuchsia' };
const dsColor = (key) => COLOR_MIGRATION[key] || (ID_ORDER.includes(key) ? key : 'slate');
const idVar = (key) => ID_VARS[dsColor(key)] || 'var(--c-id-slate)';

/* =============================================================
   UTILITAIRES
   ============================================================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const todayStr = (d = new Date()) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const parseNum = (v) => {
  if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
};

const clampPct = (n) => Math.min(100, Math.max(0, n));

const relTime = (iso) => {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 45) return 'à l’instant';
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return `il y a ${Math.floor(s / 86400)} j`;
};

const fmtDateShort = (dateStr) => {
  const months = ['jan', 'fév', 'mar', 'avr', 'mai', 'jui', 'juil', 'aoû', 'sep', 'oct', 'nov', 'déc'];
  const d = new Date(dateStr + 'T00:00:00');
  return d.getDate() + ' ' + months[d.getMonth()];
};

// Formatage numérique aligné sur MoneyValue du design system (groupes en-US).
const numFmt = (v, dec = 2) =>
  Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
// numFmt rend la valeur ABSOLUE (le signe est à la charge de l'appelant) ; variante signée
// pour les axes et infobulles des graphes (« −0 » évité quand l'arrondi tombe à zéro).
const numFmtSigned = (v, dec = 2) => { const s = numFmt(v, dec); return (v < 0 && /[1-9]/.test(s) ? MINUS : '') + s; };

/* =============================================================
   COMPTABILITÉ (fonctions pures — inchangées)
   ============================================================= */
const posQuantity = (p) => (p.margin * p.leverage) / p.entryPrice;          // BTC
const posPnl = (p, price) => {
  if (price == null) return 0;
  const qty = posQuantity(p);
  return p.side === 'long' ? qty * (price - p.entryPrice) : qty * (p.entryPrice - price);
};
const posLiqPrice = (p) =>
  p.side === 'long' ? p.entryPrice * (1 - 1 / p.leverage) : p.entryPrice * (1 + 1 / p.leverage);
// Valorisation d'une position OUVERTE au prix courant : la perte est bornée à la marge
// (sous le prix de liquidation, la position est liquidée — elle ne peut pas perdre plus).
// Les clôtures enregistrées (exitPrice réel) et les cibles TP/SL restent sur posPnl brut.
const posPnlOpen = (p, price) => Math.max(posPnl(p, price), -p.margin);

const dOf = (iso) => (iso ? todayStr(new Date(iso)) : null);

function accAt(acc, asOf, price) {
  if (acc.source === 'hyperliquid') return hlAccAt(acc, asOf);   // compte suivi par API : voir hlAccAt
  const created = acc.createdAt || asOf;
  if (created > asOf) return { exists: false, cash: 0, equity: 0, latent: 0, realized: 0, openMargin: 0, netDeposits: 0 };
  let cash = acc.openingCash || 0;
  let netDeposits = acc.openingCash || 0;
  for (const cf of acc.cashflows || []) {
    if (dOf(cf.at) > asOf) continue;
    const sgn = cf.type === 'deposit' ? 1 : -1;
    cash += sgn * cf.amount; netDeposits += sgn * cf.amount;
  }
  let latent = 0, openMargin = 0, openValue = 0;
  for (const p of acc.positions || []) {
    const od = dOf(p.openedAt);
    if (od == null || od > asOf) continue;
    cash -= (p.margin + (p.openFee || 0));
    const cd = p.status === 'closed' ? dOf(p.closedAt) : null;
    if (cd != null && cd <= asOf) {
      cash += p.margin + posPnl(p, p.exitPrice) - (p.closeFee || 0);
    } else {
      const pnl = posPnlOpen(p, price);
      openMargin += p.margin; latent += pnl; openValue += p.margin + pnl;
    }
  }
  const equity = cash + openValue;
  const realized = equity - netDeposits - latent;
  return { exists: true, cash, equity, latent, realized, openMargin, netDeposits };
}

// Valeur du compte au moment de l'ouverture de p (p valorisée comme OUVERTE à son entrée,
// même clôturée le même jour) — base de l'exposition « au moment du trade ».
// On écarte les mouvements de caisse datés du jour d'ouverture ou après (un dépôt/retrait
// postérieur ne faisait pas partie du capital disponible au moment du trade).
const equityAtOpen = (acc, p) => {
  const od = dOf(p.openedAt);
  return accAt({
    ...acc,
    cashflows: (acc.cashflows || []).filter(cf => dOf(cf.at) < od),
    positions: (acc.positions || []).map(x => x.id === p.id ? { ...x, status: 'open' } : x),
  }, od, p.entryPrice).equity;
};

function aggregateAt(accounts, asOf, price) {
  const a = { equity: 0, cash: 0, latent: 0, realized: 0, netDeposits: 0, openMargin: 0 };
  for (const acc of accounts) {
    const r = accAt(acc, asOf, price);
    a.equity += r.equity; a.cash += r.cash; a.latent += r.latent;
    a.realized += r.realized; a.netDeposits += r.netDeposits; a.openMargin += r.openMargin;
  }
  a.totalGains = a.equity - a.netDeposits;
  return a;
}

const accNetDeposits = (acc) => accAt(acc, todayStr(), 0).netDeposits;
const aggregate      = (accounts, price) => aggregateAt(accounts, todayStr(), price);
const safePct = (num, den) => (den && Math.abs(den) > 1e-9 ? (num / den) * 100 : 0);

/* ---- T0 : point de départ des calculs, propre à chaque portefeuille -------
   `acc.t0` ('YYYY-MM-DD', optionnel) re-base les grandeurs de FLUX sur une date
   choisie ; les grandeurs de STOCK (cash, equity, openMargin) restent intactes
   (les filtrer casserait la comptabilité : le cash dépend de TOUT le passé).
     base     = équity(T0) + flux nets depuis T0      → la « valeur initiale »
     total    = équity − base
     latent   = latent(now) − latent(T0)              → gain des positions DEPUIS T0
     realized = total − latent                        (≡ realized(now) − realized(T0))
   Sans t0 : base = netDeposits et latent(T0) = 0 → formules identiques à accAt. */

// Dernier prix BTC connu à une date ≤ d (priceHistory est clairsemé).
const priceAt = (priceHistory, d, fallback) => {
  const v = lastAtOrBefore(priceHistory || {}, d);
  return v != null ? v : fallback;
};

function accNow(acc, price, priceHistory) {
  const now = accAt(acc, todayStr(), price);
  const plain = { ...now, t0: null, t0Latent: 0, base: now.netDeposits };
  const t0 = acc.t0 || null;
  if (!t0 || !now.exists || t0 > todayStr()) return plain;
  const ref = accAt(acc, t0, priceAt(priceHistory, t0, price));
  if (!ref.exists) return plain;                      // T0 antérieur au compte : sans effet
  // hlAccAt historise un latent CONSTANT (= celui du jour) : inexploitable comme
  // référence passée → pour un wallet suivi le latent reste le latent RÉEL (t0Latent = 0)
  // et l'écart tombe dans le réalisé. Un T0 daté d'aujourd'hui lit, lui, le vrai snapshot.
  const t0Latent = (acc.source === 'hyperliquid' && t0 < todayStr()) ? 0 : ref.latent;
  const base = ref.equity + (now.netDeposits - ref.netDeposits);
  const latent = now.latent - t0Latent;
  return { ...now, t0, t0Latent, base, latent, realized: (now.equity - base) - latent };
}

function aggregateNow(accounts, price, priceHistory) {
  const a = { equity: 0, cash: 0, latent: 0, realized: 0, netDeposits: 0, openMargin: 0, base: 0, t0Latent: 0, anyT0: false };
  for (const acc of accounts) {
    const r = accNow(acc, price, priceHistory);
    a.equity += r.equity; a.cash += r.cash; a.latent += r.latent;
    a.realized += r.realized; a.netDeposits += r.netDeposits; a.openMargin += r.openMargin;
    a.base += r.base; a.t0Latent += r.t0Latent;
    if (r.t0) a.anyT0 = true;
  }
  a.totalGains = a.equity - a.base;
  return a;
}

const posStopPrice = (p) => {
  const liq = posLiqPrice(p);
  if (p.sl == null) return liq;
  return p.side === 'long' ? Math.max(p.sl, liq) : Math.min(p.sl, liq);
};

function computeForecast(accounts, price) {
  let downPnl = 0, upPnl = 0, hasOpen = false, anyTp = false, openCount = 0;
  for (const acc of accounts) {
    if (acc.source === 'hyperliquid') {
      // Positions du snapshot API : PnL à un prix cible = taille × écart, sans passer par posPnl (multi-actifs).
      for (const p of (((acc.hl || {}).snapshot || {}).positions || [])) {
        hasOpen = true; openCount++;
        const dir = p.side === 'long' ? 1 : -1;
        const pnlAt = (px) => p.size * (px - p.entryPrice) * dir;
        downPnl += p.sl != null ? pnlAt(p.sl) : (p.liqPrice != null ? pnlAt(p.liqPrice) : -p.margin);
        if (p.tp != null) { anyTp = true; upPnl += pnlAt(p.tp); }
        else upPnl += p.latent;                          // pas de TP : on garde le latent courant
      }
      continue;
    }
    for (const p of (acc.positions || [])) {
      if (p.status !== 'open') continue;
      hasOpen = true; openCount++;
      downPnl += posPnl(p, posStopPrice(p));
      if (p.tp != null) { anyTp = true; upPnl += posPnl(p, p.tp); }
      else upPnl += posPnlOpen(p, price);              // pas de TP : latent courant (borné liq)
    }
  }
  return { hasOpen, anyTp, openCount, downPnl, upPnl };
}

const simChoice = (p) => (p.scenario !== undefined ? p.scenario : (p.tp != null ? 'tp' : 'sl'));

/* Évaluation d'une position simulée à un capital donné : marge dérivée du % + P&L selon l'issue.
   Logique centrale réutilisée par simChain (stats) et simTrajectory (graphes). */
function positionEval(p, capitalBefore, choice) {
  const pct = (p.marginPct != null ? p.marginPct : 0);
  const marginAbs = (pct / 100) * capitalBefore;
  const eff = { ...p, margin: marginAbs };
  const pnlTp = (p.tp != null) ? posPnl(eff, p.tp) : null;
  const pnlSl = posPnl(eff, posStopPrice(eff));
  const fee = p.openFee || 0;
  let net = 0;
  if (choice === 'tp' && pnlTp != null) net = pnlTp - fee;
  else if (choice === 'sl') net = pnlSl - fee;
  return { pct, marginAbs, pnlTp, pnlSl, fee, net };
}

/* Chaîne de capital d'une simulation : positions enchaînées DANS L'ORDRE de `p.order`
   (la marge de chacune dépend du capital laissé par les précédentes). */
function simChain(acc, outcomeFn) {
  const positions = acc.positions || [];
  const idx = new Map(); positions.forEach((p, i) => idx.set(p.id, i));
  const ordered = positions.slice().sort((a, b) =>
    ((a.order != null ? a.order : Infinity) - (b.order != null ? b.order : Infinity)) || (idx.get(a.id) - idx.get(b.id)));
  let capital = accNetDeposits(acc);
  const start = capital;
  const rows = [];
  const rowById = {};
  let scenarioCount = 0;
  for (const p of ordered) {
    const capitalBefore = Math.max(0, capital);
    const choice = outcomeFn(p);
    const ev = positionEval(p, capitalBefore, choice);
    if ((choice === 'tp' && ev.pnlTp != null) || choice === 'sl') scenarioCount++;
    capital += ev.net;
    const row = { id: p.id, capitalBefore, marginAbs: ev.marginAbs, pct: ev.pct, pnlTp: ev.pnlTp, pnlSl: ev.pnlSl, net: ev.net, choice };
    rows.push(row);
    rowById[p.id] = row;
  }
  return { start, rows, rowById, finalCapital: capital, scenarioCount, count: rows.length };
}

/* Créneaux d'ordre DISTINCTS et triés sur toutes les sims d'un onglet (axe temporel partagé). */
function tabOrderSteps(sims) {
  const set = new Set();
  for (const acc of sims || []) for (const p of acc.positions || []) if (p.order != null) set.add(p.order);
  return [...set].sort((a, b) => a - b);
}

/* Trajectoire du capital d'une sim alignée sur les créneaux globaux `steps` :
   PLAT là où la sim n'a pas de position à ce créneau. Même finalCapital que simChain. */
function simTrajectory(acc, steps, outcomeFn) {
  const byStep = new Map();
  for (const p of acc.positions || []) {
    const k = p.order != null ? p.order : Infinity;
    if (!byStep.has(k)) byStep.set(k, []);
    byStep.get(k).push(p);
  }
  let capital = accNetDeposits(acc);
  const traj = [capital];
  for (const v of steps) {
    for (const p of (byStep.get(v) || [])) {
      const capitalBefore = Math.max(0, capital);
      capital += positionEval(p, capitalBefore, outcomeFn(p)).net;
    }
    traj.push(capital);
  }
  return traj;
}

function earliestActivity(accounts) {
  let min = null;
  for (const acc of accounts) {
    const ds = acc.source === 'hyperliquid'
      ? Object.keys((acc.hl || {}).equityHistory || {})
      : [acc.createdAt,
         ...(acc.cashflows || []).map(c => dOf(c.at)),
         ...(acc.positions || []).map(p => dOf(p.openedAt))].filter(Boolean);
    for (const d of ds) if (min == null || d < min) min = d;
  }
  return min;
}

function buildHistory(accounts, priceHistory) {
  if (!accounts.length || !priceHistory) return [];
  const start = earliestActivity(accounts);
  if (!start) return [];
  const today = todayStr();
  // Axe de dates = cours BTC connus ∪ historique d'équity des comptes hyperliquid.
  const set = new Set(Object.keys(priceHistory));
  for (const acc of accounts) if (acc.source === 'hyperliquid')
    for (const d in ((acc.hl || {}).equityHistory || {})) set.add(d);
  const dates = [...set].filter(d => d >= start && d <= today).sort();
  let lastPrice = null;                                  // prix reporté pour les dates sans cours
  return dates.map(date => {
    if (priceHistory[date] != null) lastPrice = priceHistory[date];
    const price = lastPrice;
    const a = aggregateAt(accounts, date, price);
    // netDeposits / nd : dépôts nets du jour (total / par compte), base des graphes en %.
    const point = { date, equity: a.equity, cash: a.cash, latent: a.latent, realized: a.realized, netDeposits: a.netDeposits, accounts: {}, nd: {} };
    for (const acc of accounts) {
      const r = accAt(acc, date, price);
      point.accounts[acc.id] = r.exists ? r.equity : null;
      point.nd[acc.id] = r.exists ? r.netDeposits : null;
    }
    return point;
  });
}

/* =============================================================
   HYPERLIQUID — suivi d'un wallet par adresse (API publique info)
   Lecture seule : POST https://api.hyperliquid.xyz/info, CORS ouvert,
   aucune authentification. Tous les nombres de l'API sont des strings.
   ============================================================= */
const hlNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const hlShortAddr = (a) => (a ? a.slice(0, 6) + '…' + a.slice(-4) : '');
// Prix multi-actifs : décimales adaptées à l'ordre de grandeur (BTC 100k vs tokens < 1)
const hlPx = (v) => numFmt(v, v >= 100 ? 0 : v >= 1 ? 2 : 6);

// Dernière valeur d'un dict {date: n} à une date ≤ d (histoires HL clairsemées).
const lastAtOrBefore = (dict, d) => {
  let bestK = null;
  for (const k in dict) if (k <= d && (bestK == null || k > bestK)) bestK = k;
  return bestK == null ? null : dict[bestK];
};

async function hlFetch(body) {
  const r = await fetch(HL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    // Les erreurs (422 adresse invalide…) arrivent en texte brut, pas en JSON.
    if (r.status === 422) throw new Error('Adresse invalide ou requête refusée');
    if (r.status === 429) throw new Error('Limite API atteinte, réessai au prochain cycle');
    throw new Error('HTTP ' + r.status);
  }
  return r.json();
}

/* Positions perp du snapshot, mappées vers le langage de l'app.
   TP/SL = ordres déclencheurs reduce-only du même coin (triggerPx vs entryPx selon le sens). */
function mapHlPositions(ch, orders) {
  const out = [];
  for (const ap of (ch.assetPositions || [])) {
    const p = ap.position || {};
    const szi = hlNum(p.szi);
    if (!szi) continue;
    const side = szi > 0 ? 'long' : 'short';
    const entry = hlNum(p.entryPx);
    const lev = (p.leverage && p.leverage.value) || 1;
    let tp = null, sl = null;
    for (const o of (orders || [])) {
      if (o.coin !== p.coin || !o.isTrigger || !o.reduceOnly) continue;
      const px = hlNum(o.triggerPx);
      if (!px) continue;
      // Type d'ordre RÉEL en priorité (même règle que mapHlFills) : un stop remonté en
      // profit (break-even, trailing) sur un long est côté profit — l'heuristique
      // prix-vs-entrée le classait TP et faussait projections et repères des graphes.
      // Repli sur l'heuristique quand orderType est absent.
      const ot = o.orderType || '';
      const isTp = /take profit/i.test(ot) ? true
        : /stop/i.test(ot) ? false
        : (side === 'long' ? px > entry : px < entry);
      // Plusieurs déclencheurs du même type : garder le plus PROCHE de l'entrée
      // (cible principale) au lieu de laisser le dernier de la liste écraser les autres.
      if (isTp) { if (tp == null || Math.abs(px - entry) < Math.abs(tp - entry)) tp = px; }
      else if (sl == null || Math.abs(px - entry) < Math.abs(sl - entry)) sl = px;
    }
    out.push({
      coin: p.coin, side, size: Math.abs(szi),
      leverage: lev,
      entryPrice: entry,
      // Marge À L'OUVERTURE (taille × entrée / levier), symétrique du manuel — PAS marginUsed,
      // qui en cross margin fluctue avec le prix mark.
      margin: (Math.abs(szi) * entry) / lev,
      // Funding cumulé depuis l'ouverture (signe API : négatif = reçu) — sert à reconstituer
      // le capital au moment du trade pour l'anneau d'exposition.
      fundingSinceOpen: hlNum(p.cumFunding && p.cumFunding.sinceOpen),
      latent: hlNum(p.unrealizedPnl),
      liqPrice: p.liquidationPx != null ? hlNum(p.liquidationPx) : null,
      tp, sl,
    });
  }
  return out;
}

function mapHlSnapshot(ch, orders, spot) {
  const ms = ch.marginSummary || {};
  const positions = mapHlPositions(ch, orders);
  const usdcBal = (((spot && spot.balances) || [])).find(b => b.coin === 'USDC');
  const usdcTotal = usdcBal ? hlNum(usdcBal.total) : 0;
  const usdcHold = usdcBal ? hlNum(usdcBal.hold) : 0;
  const perpEquity = hlNum(ms.accountValue);
  // ⚠️ Sémantique VÉRIFIÉE sur l'API : balances[USDC].total = USDC de TOUT le wallet
  // (accountValue perp INCLUS — hold couvre la partie bloquée, perp compris).
  // Le vrai spot libre = total − perp ; l'additionner brut compterait le perp deux fois.
  // total − hold = spot disponible. Cohérent avec le total officiel (portfolio allTime).
  const spotUsdc = Math.max(0, usdcTotal - perpEquity);
  return {
    // Équity = compte PERP + vrai USDC SPOT (1:1) : après une clôture les fonds restent
    // côté spot — sans lui, un compte sans position affichait 0.
    // Les tokens spot non-USDC (pas de prix 1:1) restent en note « non compté ».
    equity: perpEquity + spotUsdc,
    perpEquity, spotUsdc,
    cash: hlNum(ch.withdrawable) + Math.max(0, usdcTotal - usdcHold),
    openMargin: hlNum(ms.totalMarginUsed),
    latent: positions.reduce((s, p) => s + p.latent, 0),
    positions,
  };
}

/* Historiques depuis le endpoint portfolio (1 point par jour) :
   - équity : valeurs ABSOLUES → fusion de toutes les fenêtres (du plus grossier au plus fin),
     en conservant les points quotidiens déjà enregistrés par les synchros ;
   - PnL cumulé : baseline PAR FENÊTRE (day/week/month repartent de 0 en début de fenêtre —
     vérifié sur l'API) → seule perpAllTime est un cumul vrai ; reconstruit à chaque synchro.
   hl.netDeposits = dernier couple (équity − PnL all-time) échantillonné par Hyperliquid. */
/* Rétention des échantillons bruts, à PALIERS : ≤ 24 h tout (grain fin du jour),
   24 h–90 j au plus 1/heure, au-delà 1/jour (dernier de chaque pas). Les points
   marqués s[2] (clôtures injectées par applyHlPortfolio, ancrage des marqueurs
   du graphe) sont toujours conservés. L'ancien « tout ≤ 90 j » laissait le point
   live de 60 s saturer le plafond de 4000 en ~3 jours d'onglet ouvert, et le
   dépassement coupait par la TÊTE (points quotidiens anciens + clôtures) ; en
   cas de dépassement résiduel on amincit uniformément les points non protégés. */
function thinHlSamples(samples) {
  const now = Date.now();
  const dayCut = now - 86400000, oldCut = now - 90 * 86400000;
  const out = [];
  let lastSlot = null;
  for (const s of samples) {
    if (s[2] || s[0] >= dayCut) { out.push(s); lastSlot = null; continue; }
    const slot = s[0] >= oldCut ? Math.floor(s[0] / 3600000) : todayStr(new Date(s[0]));
    if (slot !== lastSlot) { out.push(s); lastSlot = slot; }
    else out[out.length - 1] = s;                     // garde le dernier du pas
  }
  let res = out;
  while (res.length > 4000 && res.some(s => !s[2])) {
    let skip = false;
    res = res.filter(s => s[2] || (skip = !skip));    // garde 1 point non protégé sur 2
  }
  return res;
}

function applyHlPortfolio(pf, hl, closeEvents) {
  const pick = (label) => { const e = (pf || []).find(x => x && x[0] === label); return e ? e[1] : null; };
  // Fenêtres TOTALES (perp + spot) en priorité — cohérentes avec l'équity du snapshot
  // (compte perp + USDC spot) ; repli sur les fenêtres perp* si absentes.
  // Les échantillons BRUTS (ts, valeur) sont PERSISTÉS dans hl.samples : fusionnés avec
  // l'existant, ils survivent au glissement des fenêtres HL (la précision s'accumule).
  const byTs = new Map();
  const keepTs = new Set();                        // ts protégés (clôtures injectées, cf. thinHlSamples)
  if (Array.isArray(hl.samples)) for (const s of hl.samples) { byTs.set(s[0], s[1]); if (s[2]) keepTs.add(s[0]); }
  else for (const d in (hl.equityHistory || {})) byTs.set(new Date(d + 'T12:00:00').getTime(), hl.equityHistory[d]);   // seed rétrocompat
  for (const [total, fallback] of [['allTime', 'perpAllTime'], ['month', 'perpMonth'], ['week', 'perpWeek'], ['day', 'perpDay']]) {
    const d = pick(total) || pick(fallback);
    if (!d) continue;
    for (const [ts, v] of (d.accountValueHistory || [])) byTs.set(ts, hlNum(v));
  }
  // INJECTION DES CLÔTURES dans les samples : HL échantillonne à heure arbitraire (~1 pt/17 h
  // au-delà d'une semaine) — sans point à l'instant du trade, le saut de la courbe glisse et
  // le marqueur perd son ancrage. Valeur du point injecté = 1er échantillon POSTÉRIEUR à la
  // clôture (borné avant la suivante pour ne pas importer un PnL ultérieur) ; si le trou
  // d'échantillonnage couvre plusieurs clôtures, on remonte la chaîne depuis la suivante
  // (sa valeur − son PnL net). Persistés dans hl.samples comme les autres points.
  const evs = (closeEvents || [])
    .map(g => ({ ts: new Date(g.at).getTime(), net: (g.closedPnl || 0) - (g.fee || 0) }))
    .sort((a, b) => a.ts - b.ts);
  const sorted0 = [...byTs.entries()].sort((a, b) => a[0] - b[0]);
  const resolved = new Array(evs.length).fill(null);
  for (let i = evs.length - 1; i >= 0; i--) {
    const bound = i + 1 < evs.length ? evs[i + 1].ts : Infinity;
    const after = sorted0.find(s => s[0] >= evs[i].ts && s[0] < bound);
    if (after) resolved[i] = after[1];
    else if (resolved[i + 1] != null) resolved[i] = resolved[i + 1] - evs[i + 1].net;
  }
  evs.forEach((ev, i) => {
    if (resolved[i] != null && !byTs.has(ev.ts)) byTs.set(ev.ts, resolved[i]);
    if (byTs.has(ev.ts)) keepTs.add(ev.ts);        // l'ancrage du marqueur ne doit jamais être aminci
  });
  const samples = thinHlSamples([...byTs.entries()].sort((a, b) => a[0] - b[0])
    .map(([ts, v]) => keepTs.has(ts) ? [ts, v, 1] : [ts, v]));
  hl.samples = samples;
  // Quotidien DÉRIVÉ des samples : valeur d'une date = dernier échantillon du jour (≈ fin de
  // journée) — les points de clôture injectés corrigent d'eux-mêmes les jours de trade.
  const eq = {};
  for (const [ts, v] of samples) eq[todayStr(new Date(ts))] = v;
  const at = pick('allTime') || pick('perpAllTime');
  const pnl = {};
  if (at) {
    for (const [ts, v] of (at.pnlHistory || [])) pnl[todayStr(new Date(ts))] = hlNum(v);
    const avh = at.accountValueHistory || [], ph = at.pnlHistory || [];
    if (avh.length && ph.length) hl.netDeposits = hlNum(avh[avh.length - 1][1]) - hlNum(ph[ph.length - 1][1]);
  }
  hl.equityHistory = eq;
  if (at) hl.pnlHistory = pnl;
}

/* Mouvements de trésorerie (affichage seul) : dépôts/retraits signés, autres types tels quels. */
function mapHlLedger(raw) {
  const rows = [];
  for (const u of (raw || [])) {
    const d = u.delta || {};
    const t = d.type || '?';
    let amount = hlNum(d.usdc != null ? d.usdc : d.netWithdrawnUsd);
    if (t === 'withdraw' || t === 'vaultDeposit') amount = -Math.abs(amount);
    else if (t === 'deposit' || t === 'vaultWithdraw') amount = Math.abs(amount);
    rows.push({ at: new Date(u.time).toISOString(), type: t, amount });
  }
  rows.sort((a, b) => b.at.localeCompare(a.at));
  return rows.slice(0, 100);
}

/* Dictionnaire oid → orderType depuis historicalOrders (identifie les vrais TP/SL).
   Une ligne PAR TRANSITION DE STATUT, pas une par ordre (cf. jTradeOrders) : sur un
   trigger déclenché la ligne `filled` est dégradée en 'Market' — fusion par oid en
   préférant un type trigger, sinon la première valeur non vide. Un dernier-gagnant
   dépendrait de l'ordre de la réponse (DESC aujourd'hui) et perdrait le vrai type. */
function hlOrdersById(histOrders) {
  const m = {};
  const trig = (t) => /take profit|stop/i.test(t);
  for (const h of (histOrders || [])) {
    if (!h || !h.order || h.order.oid == null) continue;
    const ot = h.order.orderType || '';
    const cur = m[h.order.oid];
    if (cur == null || (!trig(cur) && (trig(ot) || !cur))) m[h.order.oid] = ot;
  }
  return m;
}

function mapHlFills(raw, ordersById, address) {
  const addr = (address || '').toLowerCase();
  return (raw || []).slice().sort((a, b) => b.time - a.time).slice(0, 200).map(f => {
    const ot = (ordersById && ordersById[f.oid]) || '';
    // Une vraie liquidation n'arrive PAS en dir='Liquidation' : le fill est un
    // 'Close…' banal (orderType 'Market') dont seul l'objet `liquidation` trahit la
    // nature. `liquidatedUser` départage — la contrepartie du fill reçoit le même
    // objet, avec l'adresse de l'autre. (Test sur dir conservé en ceinture.)
    const liq = f.dir === 'Liquidation'
      || (f.liquidation && String(f.liquidation.liquidatedUser || '').toLowerCase() === addr);
    const kind = liq ? 'liq'
      : /take profit/i.test(ot) ? 'tp'
      : /stop/i.test(ot) ? 'sl' : null;
    return { at: new Date(f.time).toISOString(), coin: f.coin, dir: f.dir || '',
      px: hlNum(f.px), sz: hlNum(f.sz), closedPnl: hlNum(f.closedPnl), fee: hlNum(f.fee),
      startPosition: f.startPosition != null ? hlNum(f.startPosition) : null,   // taille AVANT le fill (borne d'épisode)
      oid: f.oid, kind };
  });
}

/* Épisodes de trade par coin : d'une OUVERTURE à position nulle (startPosition ≈ 0) jusqu'au
   close qui RAMÈNE la position à zéro — entrées/sorties partielles incluses. Fondé sur les
   fills stockés (fenêtre limitée) : un épisode dont l'ouverture est hors horizon est ignoré. */
function hlEpisodes(fills) {
  const list = fills || [];
  if (!list.length || list.some(f => f.startPosition == null)) return [];   // anciens fills sans startPosition
  const byCoin = new Map();
  for (const f of list) {
    if (!byCoin.has(f.coin)) byCoin.set(f.coin, []);
    byCoin.get(f.coin).push(f);
  }
  const out = [];
  for (const [coin, l] of byCoin) {
    const asc = l.slice().sort((x, y) => x.at.localeCompare(y.at));
    let cur = null;
    for (const f of asc) {
      const isOpen = /^Open/.test(f.dir);
      const isClose = /^Close/.test(f.dir) || f.dir === 'Liquidation';
      if (!isOpen && !isClose) continue;
      const sp = Math.abs(f.startPosition);
      if (!cur) {
        if (isOpen && sp < 1e-9)
          cur = { coin, side: /Long/.test(f.dir) ? 'long' : 'short', t0: new Date(f.at).getTime(), t1: null,
                  net: -(f.fee || 0), entryPx: f.px, sizeOpened: f.sz, entryNotional: f.sz * f.px };
        continue;                                   // fills d'un épisode commencé hors horizon
      }
      if (isOpen) { cur.net -= (f.fee || 0); cur.sizeOpened += f.sz; cur.entryNotional += f.sz * f.px; continue; }
      cur.net += (f.closedPnl || 0) - (f.fee || 0);
      if (Math.abs(sp - f.sz) < Math.max(1e-6, f.sz * 1e-4)) {   // position revenue à zéro
        cur.t1 = new Date(f.at).getTime();
        out.push(cur); cur = null;
      }
    }
    if (cur) out.push(cur);                         // épisode encore ouvert
  }
  out.sort((x, y) => x.t0 - y.t0);
  // Numéro de trade = rang chronologique DANS L'HORIZON des fills stockés (peut glisser
  // quand un vieux trade sort des 200 fills) + prix d'entrée moyen pondéré.
  out.forEach((ep, i) => {
    ep.n = i + 1;
    ep.avgEntry = ep.sizeOpened > 0 ? ep.entryNotional / ep.sizeOpened : ep.entryPx;
  });
  return out;
}

/* Win rate d'un compte : trades CLÔTURÉS gagnants (net > 0, frais inclus) / clôturés.
   Manuel = positions closed ; hyperliquid = enregistrements du journal — MÊME source que
   la section Historique, sinon les deux nombres se contrediraient (les épisodes, eux,
   disparaissent quand leurs fills sortent de la fenêtre des 200). Une clôture posée à
   l'estime (`net` nul, en attente des fills) est exclue plutôt que comptée perdante.
   Borné au T0 du compte quand il existe : on retient les trades CLÔTURÉS à partir du T0
   (un trade ouvert avant le T0 mais fermé après compte donc en entier). */
function accWinStats(acc, state) {
  const t0 = acc.t0 || null;
  if (acc.source === 'hyperliquid') {
    const t0ms = t0 ? new Date(t0 + 'T00:00:00').getTime() : null;
    const closed = jRecs(state).filter(r => r.walletId === acc.id && r.t1 != null && !r.orphan
      && r.cap && r.cap.exit && r.cap.exit.net != null && (t0ms == null || r.t1 >= t0ms));
    return { wins: closed.filter(r => r.cap.exit.net > 0).length, total: closed.length };
  }
  const closed = (acc.positions || []).filter(p => p.status === 'closed' && (!t0 || (dOf(p.closedAt) || '') >= t0));
  const wins = closed.filter(p => posPnl(p, p.exitPrice) - (p.openFee || 0) - (p.closeFee || 0) > 0).length;
  return { wins, total: closed.length };
}

/* =============================================================
   EXPORT PINE SCRIPT — rejouer les trades BTC sur TradingView
   ============================================================= */
/* Pine ne sait PAS instancier les outils « Long/Short Position » de TradingView (aucune API
   ne les expose) : on en reproduit le visuel avec box/line/label.
   Format pivot d'un trade : horodatages en ms epoch, `tp`/`sl` à **0** quand inconnus
   (un prix est toujours > 0 → sentinelle sans ambiguïté, et Pine gère mal `na`). */

const PINE_MAX_TRADES = 200;   // jusqu'à 2 boîtes + 1 ligne + 1 étiquette par trade, Pine plafonne à 500 objets/type

/* Trades BTC d'un compte, format commun manuel / hyperliquid.
   Filtre T0 = celui d'accWinStats (date de CLÔTURE ≥ T0) ; les positions ouvertes passent toujours. */
function collectBtcTrades(acc, price) {
  const t0 = acc.t0 || null;
  const out = [];
  if (acc.source === 'hyperliquid') {
    const fills = (acc.hl || {}).fills || [];
    const t0ms = t0 ? new Date(t0 + 'T00:00:00').getTime() : null;
    const snapPos = (((acc.hl || {}).snapshot || {}).positions || []).find(p => p.coin === 'BTC');
    // Numérotation ep.n tous coins confondus (= badges « L#16 BTC » du graphe HL) → on filtre APRÈS.
    for (const ep of hlEpisodes(fills).filter(e => e.coin === 'BTC')) {
      const open = ep.t1 == null;
      if (!open && t0ms != null && ep.t1 < t0ms) continue;
      const ex = open ? null : hlEpisodeExit(fills, ep);
      out.push({
        acct: acc.name, hl: true,
        n: ep.n, side: ep.side, open, tOpen: ep.t0, tClose: ep.t1,
        entry: ep.avgEntry, exit: open ? 0 : ex.avgExit,
        // TP/SL d'un trade CLOS : perdus (l'API ne garde pas les triggers) → repli sur la boîte réalisée.
        tp: open && snapPos && snapPos.tp != null ? snapPos.tp : 0,
        sl: open && snapPos ? (snapPos.sl != null ? snapPos.sl : (snapPos.liqPrice != null ? snapPos.liqPrice : 0)) : 0,
        net: open ? (snapPos ? snapPos.latent : 0) : ep.net,
        size: ep.sizeOpened, fees: open ? 0 : ex.fees,
        lev: open && snapPos ? snapPos.leverage : null,
        margin: open && snapPos ? snapPos.margin : null,
      });
    }
    return out;
  }
  // Compte manuel : tout est BTC par construction. n = rang par openedAt sur TOUTES les
  // positions → les numéros collent aux marqueurs L#n/S#n du graphe de l'app.
  const all = (acc.positions || []).slice().sort((a, b) => (a.openedAt || '').localeCompare(b.openedAt || ''));
  all.forEach((p, i) => {
    const open = p.status !== 'closed';
    if (!open && t0 && (dOf(p.closedAt) || '') < t0) return;
    out.push({
      acct: acc.name, hl: false,
      n: i + 1, side: p.side, open,
      tOpen: new Date(p.openedAt).getTime(),
      tClose: open ? null : new Date(p.closedAt).getTime(),
      entry: p.entryPrice, exit: open ? 0 : p.exitPrice,
      tp: p.tp != null ? p.tp : 0,
      // Cibles réelles seulement : un trade clos sans TP ni SL tombe sur la boîte réalisée.
      // Exception pour la position ouverte, où la liquidation EST le stop (convention de l'app).
      sl: p.sl != null ? p.sl : (open ? posLiqPrice(p) : 0),
      net: open ? posPnlOpen(p, price) : posPnl(p, p.exitPrice) - (p.openFee || 0) - (p.closeFee || 0),
      size: posQuantity(p), fees: (p.openFee || 0) + (open ? 0 : (p.closeFee || 0)),
      lev: p.leverage, margin: p.margin,
    });
  });
  return out;
}

/* Tous les trades BTC de tous les portefeuilles, fusionnés sur un axe de temps commun
   (chaque compte garde son propre T0 : le filtre est appliqué par collectBtcTrades). */
function collectAllBtcTrades(accounts, price) {
  const out = [];
  for (const acc of accounts || []) out.push(...collectBtcTrades(acc, price));
  return out.sort((a, b) => a.tOpen - b.tOpen);
}

const shortName = (s, n = 12) => { const t = String(s || '').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
const pineStr = (s) => '"' + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
const pineNum = (v, d = 2) => (Number.isFinite(v) ? v : 0).toFixed(d);
const pineSigned = (v) => (v >= 0 ? '+' : '-') + Math.abs(Math.round(v));
const pineDt = (t) => new Date(t).toLocaleDateString('fr-FR') + ' ' + new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

/* Script Pine v6 : un appel f_trade() par trade (pas de tableaux — lignes courtes et
   autonomes, on évite la règle de continuation de ligne de Pine). */
function buildPineScript(scope, trades) {
  const kept = trades.slice(-PINE_MAX_TRADES);                 // les plus récents
  const skipped = trades.length - kept.length;
  const warnings = [];
  if (skipped > 0) warnings.push(skipped + ' trade(s) plus ancien(s) écarté(s) : Pine plafonne à 500 objets de dessin par type.');
  // Avertissements déduits des trades RÉELLEMENT exportés (un script global peut mêler les deux).
  if (kept.some(t => t.hl)) warnings.push("Historique borné aux 200 derniers fills conservés par l'API Hyperliquid.");
  if (kept.some(t => !t.hl)) warnings.push("Les dates saisies à la main sont horodatées à midi : pas d'heure de trade réelle.");
  const title = 'BWE · Trades BTC — ' + scope.name;
  const L = [];
  L.push('//@version=6');       // DOIT rester la 1re ligne (sinon Pine retombe sur une vieille version)
  L.push('// ─────────────────────────────────────────────────────────────');
  L.push('//  Trades BTC — « ' + scope.name + ' »');
  L.push('//  Généré par BTC Wallets Evolution le ' + todayStr() + ' · ' + kept.length + ' trade(s)');
  if (scope.multi) {
    L.push('//  Portefeuilles : ' + [...new Set(kept.map(t => t.acct))].join(', '));
    if (scope.anyT0) L.push('//  Le T0 propre à chaque portefeuille a été appliqué.');
  } else if (scope.t0) L.push('//  Depuis le T0 du portefeuille : ' + scope.t0);
  L.push('//  À coller dans l’éditeur Pine de TradingView, sur un graphe BTC (BTCUSD, BTCUSDT…).');
  for (const w of warnings) L.push('//  ⚠ ' + w);
  L.push('// ─────────────────────────────────────────────────────────────');
  L.push('indicator(' + pineStr(title) + ', overlay = true, max_boxes_count = 500, max_lines_count = 500, max_labels_count = 500)');
  L.push('');
  L.push('showZones  = input.bool(true, "Zones TP / SL")');
  L.push('showLabels = input.bool(true, "Étiquettes")');
  L.push('opa        = input.int(85, "Transparence des zones", minval = 50, maxval = 95)');
  // Bleu / rose plutôt que vert / rouge : les couleurs de bougies de TradingView sont
  // déjà vert/rouge, les zones s'y noyaient.
  L.push('cWin       = input.color(#2962FF, "Gain (bleu)")');
  L.push('cLoss      = input.color(#FF4081, "Perte (rose)")');
  L.push('cEntry     = input.color(#B2B5BE, "Entrée")');
  L.push('');
  L.push('// tClose = 0 → trade encore ouvert (bord droit = maintenant) ; tp/sl = 0 → cible inconnue.');
  L.push('f_trade(tOpen, tClose, dir, entry, exitPx, tp, sl, net, tag, tip) =>');
  L.push('    x2  = tClose == 0 ? timenow : tClose');
  L.push('    col = net >= 0 ? cWin : cLoss');
  L.push('    line.new(tOpen, entry, x2, entry, xloc = xloc.bar_time, color = cEntry, style = line.style_dotted, width = 1)');
  L.push('    if showZones');
  L.push('        if tp > 0');
  L.push('            box.new(tOpen, math.max(entry, tp), x2, math.min(entry, tp), xloc = xloc.bar_time, bgcolor = color.new(cWin, opa), border_color = color.new(cWin, 45))');
  L.push('        if sl > 0');
  L.push('            box.new(tOpen, math.max(entry, sl), x2, math.min(entry, sl), xloc = xloc.bar_time, bgcolor = color.new(cLoss, opa), border_color = color.new(cLoss, 45))');
  L.push('        if tp <= 0 and sl <= 0 and exitPx > 0');
  L.push('            box.new(tOpen, math.max(entry, exitPx), x2, math.min(entry, exitPx), xloc = xloc.bar_time, bgcolor = color.new(col, opa), border_color = color.new(col, 45))');
  L.push('    if showLabels');
  L.push('        y = exitPx > 0 ? exitPx : entry');
  L.push('        sty = dir == 1 ? label.style_label_down : label.style_label_up');
  L.push('        label.new(x2, y, tag, xloc = xloc.bar_time, style = sty, color = color.new(col, 15), textcolor = color.white, size = size.small, tooltip = tip)');
  L.push('    bool drawnOk = true   // valeur de retour constante : la fonction ne sert qu\'aux dessins');
  L.push('');
  L.push('var bool drawn = false');
  L.push('if barstate.islast and not drawn');
  L.push('    drawn := true');
  L.push('    if not str.contains(str.upper(syminfo.ticker), "BTC")');
  L.push('        label.new(bar_index, high, "⚠ Script BWE : à appliquer sur un graphe BTC", style = label.style_label_down, color = cLoss, textcolor = color.white, size = size.small)');
  for (const t of kept) {
    const pre = t.side === 'long' ? 'L#' : 'S#';
    // En multi-portefeuilles, les numéros L#n se répètent d'un compte à l'autre → préfixe court
    // sur l'étiquette, nom complet dans l'infobulle.
    const tag = (scope.multi ? shortName(t.acct) + ' ' : '') + pre + t.n + (t.open ? ' en cours' : ' ' + pineSigned(t.net));
    const tip = [
      ...(scope.multi ? ['Portefeuille : ' + t.acct] : []),
      (t.side === 'long' ? 'Long' : 'Short') + (t.lev ? ' ' + numFmt(t.lev, 1) + '×' : '') + (t.margin != null ? ' · marge ' + numFmt(t.margin) + ' USDC' : ''),
      'Entrée ' + numFmt(t.entry) + ' le ' + pineDt(t.tOpen) + ' · ' + numFmt(t.size, 4) + ' BTC',
      t.open ? 'Position encore ouverte' : 'Sortie ' + numFmt(t.exit) + ' le ' + pineDt(t.tClose),
      'Frais ' + numFmt(t.fees) + ' · ' + (t.open ? 'Latent ' : 'Net ') + (t.net >= 0 ? '+' : MINUS) + numFmt(Math.abs(t.net)) + ' USDC',
    ].join('\n');
    L.push('    f_trade(' + [
      Math.round(t.tOpen), t.open ? 0 : Math.round(t.tClose), t.side === 'long' ? 1 : -1,
      pineNum(t.entry), pineNum(t.exit), pineNum(t.tp), pineNum(t.sl), pineNum(t.net),
      pineStr(tag), pineStr(tip),
    ].join(', ') + ')');
  }
  return { code: L.join('\n') + '\n', count: kept.length, skipped, warnings };
}

/* Regroupe les fills en « ordres » : même coin, même sens, même type, même MINUTE
   (un ordre limite s'exécute souvent en plusieurs fills partiels) — quantités sommées,
   prix moyen pondéré, frais/PnL additionnés, horodaté au dernier fill. */
function groupHlFills(fills) {
  const map = new Map();
  for (const f of (fills || [])) {
    const key = f.coin + '|' + f.dir + '|' + (f.kind || '') + '|' + (f.at ? f.at.slice(0, 16) : '');
    const g = map.get(key);
    if (!g) map.set(key, { ...f, key, firstAt: f.at });
    else {
      g.px = (g.px * g.sz + f.px * f.sz) / ((g.sz + f.sz) || 1);
      g.sz += f.sz; g.fee += f.fee; g.closedPnl += f.closedPnl;
      if (f.at > g.at) g.at = f.at;
      // `startPosition` du fill le PLUS ANCIEN = taille avant l'ordre ENTIER. Aucun
      // affichage ne s'en sert, mais le journal en a besoin pour classer l'ordre
      // (partielle vs totale) : sans ça une sortie totale découpée en huit se lit
      // comme sept partielles suivies d'une clôture. `key`/`firstAt` sont exposés
      // pour la même raison — id stable et instant de début de l'ordre.
      if (f.at < g.firstAt) { g.firstAt = f.at; g.startPosition = f.startPosition; }
    }
  }
  return [...map.values()].sort((a, b) => b.at.localeCompare(a.at));
}

/* Côté SORTIE d'un épisode, symétrique de l'entrée : un épisode ne porte que son `net`,
   les prix de sortie sont à reconstruire depuis les fills de sa fenêtre [t0, t1].
   → { closedSz, avgExit (moyen pondéré), fees (entrées + sorties), kinds } */
function hlEpisodeExit(fills, ep) {
  const inEp = (fills || []).filter(f => {
    const ts = new Date(f.at).getTime();
    return f.coin === ep.coin && ts >= ep.t0 && (ep.t1 == null || ts <= ep.t1);
  });
  const grouped = groupHlFills(inEp);
  const closes = grouped.filter(f => /^Close/.test(f.dir) || f.dir === 'Liquidation').sort((a, b) => a.at.localeCompare(b.at));
  const closedSz = closes.reduce((s, f) => s + f.sz, 0);
  return {
    closes,
    closedSz,
    avgExit: closedSz > 0 ? closes.reduce((s, f) => s + f.px * f.sz, 0) / closedSz : 0,
    fees: grouped.reduce((s, f) => s + (f.fee || 0), 0),
    kinds: [...new Set(closes.map(f => f.kind).filter(Boolean))],
  };
}

/* Date+heure et durée lisibles — partagés par les lignes de trade et le journal. */
const fmtDateTime = (t) => new Date(t).toLocaleDateString('fr-FR') + ' '
  + new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const fmtDur = (t0, t1) => {
  const ms = Math.max(0, t1 - t0);
  const dj = Math.floor(ms / 86400000), hh = Math.floor((ms % 86400000) / 3600000);
  return dj > 0 ? dj + ' j ' + hh + ' h' : hh + ' h ' + Math.floor((ms % 3600000) / 60000) + ' min';
};

/* Équity interpolée à un instant sur la courbe d'échantillons. Sert au levier
   effectif d'un trade clos (l'API ne conserve ni marge ni levier historiques) et à
   figer `equityAtOpen` dans le journal — nécessaire car thinHlSamples réduit les
   échantillons à un par jour au-delà de 90 jours, donc l'interpolation se dégrade. */
function hlEquityAt(samples, ts) {
  let prev = null, next = null;
  for (const s of (samples || [])) { if (s[0] <= ts) prev = s; else { next = s; break; } }
  if (prev && next) return prev[1] + (next[1] - prev[1]) * ((ts - prev[0]) / Math.max(1, next[0] - prev[0]));
  return prev ? prev[1] : (next ? next[1] : null);
}

/* Tokens spot NON comptés dans l'équity (pas de valorisation 1:1) → note informative.
   L'USDC spot, lui, est intégré à l'équity/cash du snapshot. */
function mapHlSpotNote(spot) {
  const others = ((spot && spot.balances) || []).filter(b => b.coin !== 'USDC' && hlNum(b.total) > 0);
  if (!others.length) return null;
  return others.map(b => b.coin).slice(0, 4).join(', ') + (others.length > 4 ? '…' : '');
}

/* Récupération groupée : légère (état + ordres + spot, poids ~24) ou complète (+ historiques). */
async function fetchHlData(address, full) {
  const [ch, orders, spot] = await Promise.all([
    hlFetch({ type: 'clearinghouseState', user: address }),
    hlFetch({ type: 'frontendOpenOrders', user: address }),
    hlFetch({ type: 'spotClearinghouseState', user: address }),   // poids 2 — l'USDC spot compte dans l'équity
  ]);
  const out = { snapshot: mapHlSnapshot(ch, orders, spot), spotNote: mapHlSpotNote(spot) };
  if (full) {
    const [pf, ledger, fills, histOrders] = await Promise.all([
      hlFetch({ type: 'portfolio', user: address }),
      hlFetch({ type: 'userNonFundingLedgerUpdates', user: address, startTime: 0 }),
      hlFetch({ type: 'userFills', user: address, aggregateByTime: true }),   // fusion native des fills d'un même ordre
      hlFetch({ type: 'historicalOrders', user: address }),                   // orderType réel (TP/SL) par oid
    ]);
    out.portfolio = pf; out.ledger = ledger; out.fills = fills; out.histOrders = histOrders;
  }
  return out;
}

/* Équivalent d'accAt pour un compte hyperliquid : présent = snapshot, passé = historiques.
   netDeposits(t) = équity(t) − PnL cumulé(t) (mêmes échantillons portfolio) ;
   latent historique inconnu → constant (les variations quotidiennes passent en « réalisé »). */
function hlAccAt(acc, asOf) {
  const hl = acc.hl || {};
  const snap = hl.snapshot;
  if (!snap) return { exists: true, cash: 0, equity: 0, latent: 0, realized: 0, openMargin: 0, netDeposits: 0 };
  if (asOf >= todayStr()) {
    const nd = hl.netDeposits != null ? hl.netDeposits : snap.equity - snap.latent;
    return { exists: true, cash: snap.cash, equity: snap.equity, latent: snap.latent,
             realized: snap.equity - nd - snap.latent, openMargin: snap.openMargin, netDeposits: nd };
  }
  const eq = lastAtOrBefore(hl.equityHistory || {}, asOf);
  if (eq == null) return { exists: false, cash: 0, equity: 0, latent: 0, realized: 0, openMargin: 0, netDeposits: 0 };
  const pnl = lastAtOrBefore(hl.pnlHistory || {}, asOf);
  const nd = pnl != null ? eq - pnl : (hl.netDeposits || 0);
  return { exists: true, cash: 0, equity: eq, latent: snap.latent, realized: eq - nd - snap.latent, openMargin: 0, netDeposits: nd };
}

/* =============================================================
   ÉTAT PAR DÉFAUT + PERSISTANCE (inchangés)
   ============================================================= */
const defaultState = () => ({
  version: 1,
  settings: { theme: 'dark', chartUnit: 'usdc', autoRefresh: true, range: '90J', view: 'live', liveAcct: null, simUnit: 'usdc', simChart: { total: true, accts: {} } },
  chart: { total: true, cash: false, accts: {} },
  btc: { price: null, updatedAt: null },
  accounts: [],
  priceHistory: {},
  sims: [],
  simTabs: [],
  // Notes partagées entre positions (manuel, sim, HL). Table centrale ; les
  // positions/records ne portent qu'une référence `snoteId`. Tranche plate reçue
  // gratuitement par hydrate, comme `journal` — AUCUNE migration, et un state
  // partiel n'est pas complété : toute lecture passe par snList/snGet.
  sharedNotes: [],
  // Journal de trading. Tranche plate : loadState fait `{...defaultState(), ...parsed}`
  // et ne fusionne en profondeur que `settings`/`chart`, donc un ancien store la reçoit
  // gratuitement — AUCUNE fonction de migration, et il est interdit d'en ajouter (un
  // throw dans loadState met tout le document en quarantaine). Corollaire : un `journal`
  // PARTIEL n'est pas complété, donc toute lecture passe par les accesseurs jXxx().
  journal: { trades: {}, config: {}, seen: {} },
});

function migrateSims(parsed) {
  for (const acc of (parsed.sims || [])) {
    if (!Array.isArray(acc.strategies)) acc.strategies = [];
    (acc.positions || []).forEach((p, i) => { if (p.order == null) p.order = i + 1; });
    let capital = acc.openingCash || 0;
    for (const p of (acc.positions || [])) {
      const capitalBefore = Math.max(0, capital);
      const legacyMargin = p.margin;
      if (p.marginPct == null) {
        p.marginPct = (legacyMargin != null && capitalBefore > 1e-9)
          ? clampPct((legacyMargin / capitalBefore) * 100) : 0;
      }
      const marginAbs = legacyMargin != null ? legacyMargin : (p.marginPct / 100) * capitalBefore;
      const eff = { ...p, margin: marginAbs };
      const pnlTp = p.tp != null ? posPnl(eff, p.tp) : null;
      const pnlSl = posPnl(eff, posStopPrice(eff));
      const fee = p.openFee || 0;
      const choice = simChoice(p);
      if (choice === 'tp' && pnlTp != null) capital += pnlTp - fee;
      else if (choice === 'sl') capital += pnlSl - fee;
      delete p.margin;
    }
  }
  return parsed;
}

function migrateSimTabs(parsed) {
  if (!Array.isArray(parsed.simTabs)) parsed.simTabs = [];
  const sims = parsed.sims || [];
  const orphans = sims.filter(s => !s.simTab);
  if (orphans.length) {
    let tabId;
    if (parsed.simTabs.length === 0) { tabId = uid(); parsed.simTabs.push({ id: tabId, name: 'Simulation' }); }
    else tabId = parsed.simTabs[0].id;
    for (const s of orphans) s.simTab = tabId;
  }
  const set = parsed.settings || {};
  if (set.view === 'sim') set.view = parsed.simTabs.length ? parsed.simTabs[0].id : 'live';
  else if (set.view && !ROOT_VIEWS.includes(set.view) && !parsed.simTabs.some(t => t.id === set.view)) set.view = 'live';
  return parsed;
}

/* =============================================================
   BAIL D'ÉCRITURE — un seul onglet persiste
   -------------------------------------------------------------
   `persist` réécrit TOUT le document depuis l'instantané mémoire de l'onglet,
   et deux ticks de 60 s (prix BTC, synchro HL) s'y terminent. Sans bail, un
   onglet resté ouvert écrase en boucle ce qu'un autre vient de saisir — sans
   conséquence tant que les données sont re-téléchargeables, fatal dès qu'elles
   sont tapées à la main. Un seul onglet écrit ; les autres suivent via
   l'événement `storage` et proposent de prendre la main.
   ============================================================= */
const TAB_ID = uid();
let persistBlock = null;    // raison textuelle : persist() refuse d'écrire
let brokenKey = null;       // clé de quarantaine d'un document illisible
let quotaFull = false;      // dernière écriture refusée par le quota

const readOwner = () => {
  try { return JSON.parse(localStorage.getItem(OWNER_KEY) || 'null'); } catch (e) { return null; }
};
const ownerStale = (o) => !o || !o.at || (Date.now() - o.at) > OWNER_LEASE_MS;
const isOwner = () => { const o = readOwner(); return !!o && o.tabId === TAB_ID; };
const stampOwner = () => {
  try { localStorage.setItem(OWNER_KEY, JSON.stringify({ tabId: TAB_ID, at: Date.now() })); } catch (e) { return false; }
  const back = readOwner();                      // localStorage n'a pas de CAS : on relit
  return !!back && back.tabId === TAB_ID;         // et on cède si un autre onglet a gagné la course
};
/* Réclame le bail s'il est libre ou périmé, le ré-estampille si on l'a déjà. */
function refreshOwnerLease() {
  const cur = readOwner();
  if (cur && cur.tabId !== TAB_ID && !ownerStale(cur)) return false;
  return stampOwner();
}
const takeOverOwner = () => stampOwner();        // reprise explicite demandée par l'utilisateur
const releaseOwner = () => { if (isOwner()) { try { localStorage.removeItem(OWNER_KEY); } catch (e) {} } };

/* Fusion d'un document parsé sur les valeurs par défaut. Deux appelants
   (chargement et import) : la centraliser évite qu'une nouvelle tranche d'état
   soit ajoutée d'un côté et oubliée de l'autre. */
function hydrate(parsed) {
  const d = defaultState();
  return { ...d, ...parsed,
    settings: { ...d.settings, ...(parsed.settings || {}) },
    chart: { ...d.chart, ...(parsed.chart || {}) } };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return hydrate(migrateSimTabs(migrateSims(JSON.parse(raw))));
  } catch (e) {
    // Quarantaine plutôt que réinitialisation : renvoyer un état vide ferait
    // écraser le document intact par le tick de 60 s, définitivement. On copie
    // la chaîne sous une clé neuve et on bloque toute écriture.
    console.warn('État illisible :', e);
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        // Un rechargement en boucle ne doit pas empiler les copies : si ce même
        // contenu est déjà en quarantaine, on réutilise sa clé.
        const already = Object.keys(localStorage)
          .filter(k => k.indexOf(BROKEN_PREFIX) === 0)
          .find(k => localStorage.getItem(k) === raw);
        brokenKey = already || (BROKEN_PREFIX + Date.now());
        if (!already) localStorage.setItem(brokenKey, raw);
      }
    } catch (e2) { brokenKey = null; }
    persistBlock = 'État illisible — sauvegarde suspendue pour ne pas écraser tes données.';
    return defaultState();
  }
}
/* Part SAISIE À LA MAIN du journal — la seule donnée de l'app qui ne se retélécharge
   pas. Extraite pour être sauvegardée sous une clé séparée : quelques centaines
   d'octets, contre ~75 Ko pour le journal complet dont la capture machine est
   reconstituable auprès de l'API. */
function jDeclarative(J, sharedNotes) {
  const out = { config: (J && J.config) || {}, entries: {}, sharedNotes: sharedNotes || [] };
  const trades = (J && J.trades) || {};
  for (const k of Object.keys(trades)) {
    const r = trades[k];
    if (!r) continue;
    if (r.opening || r.closing || (r.midNotes || []).length || r.note || r.snoozedAt || r.snoteId) {
      out.entries[k] = { opening: r.opening || null, closing: r.closing || null,
        midNotes: r.midNotes || [], note: r.note || null, snoozedAt: r.snoozedAt || null,
        snoteId: r.snoteId || null };
    }
  }
  return out;
}

function persist(state) {
  if (persistBlock || !isOwner()) return false;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Clé SÉPARÉE : survit à un import malheureux, à une réinitialisation et à une
    // quarantaine du document principal.
    if (state && state.journal) localStorage.setItem(JOURNAL_BACKUP_KEY, JSON.stringify(jDeclarative(state.journal, state.sharedNotes)));
    quotaFull = false; return true;
  } catch (e) { quotaFull = true; console.error('Sauvegarde impossible :', e); return false; }
}

function useStore() {
  const [state, setState] = useState(loadState);
  const update = useCallback((fn) => {
    setState(prev => {
      const draft = JSON.parse(JSON.stringify(prev));
      const next = fn(draft) || draft;
      persist(next);
      return next;
    });
  }, []);
  const replace = useCallback((next) => { persist(next); setState(next); }, []);
  // Un autre onglet a écrit : on adopte son document au lieu d'afficher du périmé.
  // L'événement ne se déclenche que dans les AUTRES onglets — donc jamais sur nos
  // propres écritures. Toute charge illisible est ignorée, pas fatale.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      try { setState(hydrate(migrateSimTabs(migrateSims(JSON.parse(e.newValue))))); }
      catch (err) { console.warn('storage : document illisible, ignoré', err); }
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  // Relecture du document stocké, SANS écrire : appelée quand l'onglet reprend le bail
  // (sa mémoire peut dater d'avant les écritures d'un autre onglet).
  const resync = useCallback(() => setState(loadState()), []);
  return [state, update, replace, resync];
}
